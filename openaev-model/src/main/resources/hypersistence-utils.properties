# Read by hypersistence-utils at class-init time (io.hypersistence.utils.hibernate.type.util.Configuration).
# Clone @Type(JsonType.class) attributes through Jackson rather than Java serialization: the default
# serializer of the Hibernate 7 compatible releases requires every JSON payload to implement
# Serializable, which our model objects are not. See JacksonJsonCloner for the full rationale.
hypersistence.utils.json.serializer=io.openaev.database.converter.JacksonJsonCloner
