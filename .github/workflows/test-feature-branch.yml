name: Deploy feature branch on staging
on:
  workflow_dispatch:
    inputs:
      openaev_config:
        type: string
        default: '{ "SPRING_PROFILES_ACTIVE": "ci,test-feature-branch", "OPENAEV_ENABLED-DEV-FEATURES": "*" }'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  deployment-slug:
    name: deployment-slug
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.slug.outputs.value }}
    steps:
      - name: Compute deployment slug
        id: slug
        env:
          REF_VERSION: ${{ github.ref_name }}
          REF_SHA: ${{ github.sha }}
        run: |
          slug=$(echo "$REF_VERSION" | tr '/._' '-' | cut -c 1-15 | sed 's/[^[:alnum:]-]/-/g' | sed 's/^-*//' | sed 's/-*$//')
          if [ -z "$slug" ]; then
            slug="sha-${REF_SHA:0:8}"
          fi
          echo "value=$slug" >> "$GITHUB_OUTPUT"
  openaev-platform:
    name: openaev-platform
    needs: [deployment-slug]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jirutka/setup-alpine@v1
        with:
          branch: v3.23
          extra-repositories: |
            https://dl-cdn.alpinelinux.org/alpine/edge/community/
          packages: >
            nodejs npm git tini gcc g++ make musl-dev cargo openjdk21-jdk maven postfix postfix-pcre
      - name: Setup Node.js
        run: |
          npm install -g corepack
        shell: alpine.sh --root {0}
      - name: Build into Alpine
        run: |
          export JAVA_HOME=/usr/lib/jvm/default-jvm/
          cd openaev-front
          yarn install
          yarn build
          cd ../
          mvn install -DskipTests -Pdev
        shell: alpine.sh {0}
      - run: mkdir -p openaev-build/
      - run: cp openaev-api/target/openaev-api.jar openaev-build/
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: filigran/openaev-platform
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.deployment-slug.outputs.value }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: buildpush
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_ga_deprecated
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=filigran/openaev-platform:buildcache
          cache-to: type=registry,ref=filigran/openaev-platform:buildcache,mode=max
    outputs:
      dockerBuildDigest: ${{ steps.buildpush.outputs.digest }}
  deploy:
    name: deploy
    needs: [deployment-slug, openaev-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Install AWX cli
        run: pip install awxkit
      - name: Deploy feature environment via AWX
        id: awx
        run: |
          set +e
          launch_output=$(awx --conf.host ${{ secrets.AWX_URL }} \
            --conf.username ${{ secrets.AWX_USER }} \
            --conf.password ${{ secrets.AWX_PASSWORD }} \
            -f json \
          job_templates launch 'Deploy OpenAEV feature branch for testing' \
            --wait \
            --inventory eu-west-staging \
            --extra_vars '{"openaev_version":"${{ needs.deployment-slug.outputs.value }}","openaev_config":${{ inputs.openaev_config }},"image_digest":"${{ needs.openaev-platform.outputs.dockerBuildDigest }}"}')
          awx_exit_code=$?
          echo "$launch_output"
          job_id=$(printf '%s' "$launch_output" | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data.get("job") or data.get("id") or "")')
          if [ -n "$job_id" ]; then
            echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          fi
          exit "$awx_exit_code"
      - name: Print AWX job stdout on failure
        if: failure() && steps.awx.outputs.job_id != ''
        run: |
          awx --conf.host ${{ secrets.AWX_URL }} \
            --conf.username ${{ secrets.AWX_USER }} \
            --conf.password ${{ secrets.AWX_PASSWORD }} \
            jobs stdout "${{ steps.awx.outputs.job_id }}" || true
      - name: display URL
        run: echo "https://feat-${{ needs.deployment-slug.outputs.value }}.oaev.staging.filigran.io"
