name: Deploy feature branch on staging
on:
  workflow_dispatch:
    inputs:
      openaev_config:
        type: string
        default: '{ "SPRING_PROFILES_ACTIVE": "ci,test-feature-branch", "OPENAEV_ENABLED-DEV-FEATURES": "*" }'
        required: false

permissions:
  contents: read
  packages: write

jobs:
  openaev-platform:
    name: openaev-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jirutka/setup-alpine@v1
        with:
          branch: v3.23
          extra-repositories: |
            https://dl-cdn.alpinelinux.org/alpine/edge/community/
          packages: >
            nodejs npm git tini gcc g++ make musl-dev cargo openjdk21-jdk maven postfix postfix-pcre
      - name: Setup Node.js
        run: |
          npm install -g corepack
        shell: alpine.sh --root {0}
      - name: Build into Alpine
        run: |
          export JAVA_HOME=/usr/lib/jvm/default-jvm/
          cd openaev-front
          yarn install
          yarn build
          cd ../
          mvn install -DskipTests -Pdev
        shell: alpine.sh {0}
      - run: mkdir -p openaev-build/
      - run: cp openaev-api/target/openaev-api.jar openaev-build/
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: filigran/openaev-platform
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        id: buildpush
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_ga_deprecated
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=filigran/openaev-platform:buildcache
          cache-to: type=registry,ref=filigran/openaev-platform:buildcache,mode=max
    outputs:
      dockerBuildDigest: ${{ steps.buildpush.outputs.digest }}
  deploy:
    name: deploy
    needs: [openaev-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: filigran/openaev-platform
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Install AWX cli
        run: pip install awxkit
      - name: Deploy feature environment via AWX
        env:
          AWX_HOST: ${{ secrets.AWX_URL }}
          AWX_USERNAME: ${{ secrets.AWX_USER }}
          AWX_PASSWORD: ${{ secrets.AWX_PASSWORD }}
          OPENAEV_CONFIG: ${{ inputs.openaev_config }}
          FEATURE_ADMIN_PASSWORD: ${{ secrets.FEATURE_BRANCH_ADMIN_PASSWORD }}
          OPENAEV_VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ needs.openaev-platform.outputs.dockerBuildDigest }}
        run: |
          extra_vars=$(jq -cn \
            --arg version "$OPENAEV_VERSION" \
            --arg password "$FEATURE_ADMIN_PASSWORD" \
            --arg digest "$IMAGE_DIGEST" \
            --argjson config "$OPENAEV_CONFIG" \
            '{
              openaev_version: $version,
              openaev_config: ($config + {
                OPENAEV_ADMIN_PASSWORD: $password
              }),
              image_digest: $digest
            }')
          awx --conf.host "$AWX_HOST" \
            --conf.username "$AWX_USERNAME" \
            --conf.password "$AWX_PASSWORD" \
            -f human \
          job_templates launch 'Deploy OpenAEV feature branch for testing' \
            --wait \
            --inventory eu-west-staging \
            --extra_vars "$extra_vars"
      - name: Forge URL to match playbook limitations
        id: urlforge
        run: |
          url=$(echo "${{steps.meta.outputs.version}}" | cut -c 1-15 | sed 's/[_.]/-/g' | sed 's/-*$//')
          echo "url=$url" >> $GITHUB_OUTPUT
      - name: display URL
        run: echo "https://feat-${{steps.urlforge.outputs.url}}.oaev.staging.filigran.io"
