name: "[OpenAEV] Validate PR title Worker"
on:
  pull_request:
    branches: [ main ]
    types: [ opened, edited, reopened, ready_for_review, synchronize ]
permissions:
  contents: read
jobs:
  validate-pr-title:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: "Generate a token"
        id: generate-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OPENAEV_PR_CHECKS_APP_ID }}
          private-key: ${{ secrets.OPENAEV_PR_CHECKS_PRIVATE_KEY }}
      - name: "Detect a private related issue"
        id: related
        env:
          BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          # Keep only the "### Related issues" section, without HTML comments or empty bullets
          section=$(printf '%s\n' "$BODY" | tr -d '\r' | perl -0pe 's/<!--.*?-->//gs' \
            | awk '/^### /{in_section = ($0 ~ /^### Related issues[[:space:]]*$/); next} in_section' \
            | sed -E '/^[[:space:]]*\*?[[:space:]]*$/d')
          if [[ "$section" =~ ^[[:space:]]*\*[[:space:]]*N/A[[:space:]]*$ ]]; then
            echo "private=true" >> "$GITHUB_OUTPUT"
          else
            echo "private=false" >> "$GITHUB_OUTPUT"
          fi
      - name: "Validate PR title and create check"
        if: steps.related.outputs.private != 'true'
        uses: FiligranHQ/filigran-ci-tools/actions/pr-title-check@main
        with:
          token: ${{ steps.generate-token.outputs.token }}
      - name: "Validate PR title for a private issue"
        if: steps.related.outputs.private == 'true'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "Invalid PR title. Required format: type(scope?)!?: description"
            exit 1
          fi
          issue_ref='#[0-9]+'
          if [[ "$TITLE" =~ $issue_ref ]]; then
            echo "Invalid PR title. A PR related to a private issue must not reference an issue (#N) in its title"
            exit 1
          fi
