name: "[Core] CI"

# Continuous Integration pipeline.
# Snyk findings are reported but intentionally never block Core CI.
# ⚠️ Branch-protection status check: "pipeline / ✅ Pipeline Gate"

on:
  push:
    branches: [main, testing-xtm-one]
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  pipeline:
    uses: ./.github/workflows/_ci-pipeline.yml
    with:
      # ── API Tests: 6 shards × Elasticsearch ──
      api-matrix: >
        [
          {"shard":"1","shard_name":"main","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"io/openaev/api/**/*Test.java\nio/openaev/integration/**/*Test.java\nio/openaev/injects/**/*Test.java\nio/openaev/opencti/**/*Test.java\nio/openaev/service/**/*Test.java","excludes":""},
          {"shard":"2","shard_name":"rest-1","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"io/openaev/rest/*Test.java\nio/openaev/rest/asset_group/**/*Test.java\nio/openaev/rest/attack_pattern/**/*Test.java\nio/openaev/rest/custom_dashboard/**/*Test.java\nio/openaev/rest/dashboard/**/*Test.java\nio/openaev/rest/exercise/**/*Test.java","excludes":""},
          {"shard":"3","shard_name":"rest-2","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"io/openaev/rest/**/*Test.java","excludes":"io/openaev/rest/*Test.java\nio/openaev/rest/asset_group/**/*Test.java\nio/openaev/rest/attack_pattern/**/*Test.java\nio/openaev/rest/custom_dashboard/**/*Test.java\nio/openaev/rest/dashboard/**/*Test.java\nio/openaev/rest/exercise/**/*Test.java"},
          {"shard":"4","shard_name":"misc-1","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"io/openaev/config/**/*Test.java\nio/openaev/database/**/*Test.java\nio/openaev/scheduler/**/*Test.java","excludes":""},
          {"shard":"5","shard_name":"misc-2","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"io/openaev/datapack/**/*Test.java\nio/openaev/debug/**/*Test.java\nio/openaev/output_processor/**/*Test.java\nio/openaev/executors/**/*Test.java\nio/openaev/engine/**/*Test.java\nio/openaev/context/**/*Test.java\nio/openaev/processor/**/*Test.java\nio/openaev/injector_contract/**/*Test.java\nio/openaev/helper/**/*Test.java\nio/openaev/runner/**/*Test.java\nio/openaev/healthcheck/**/*Test.java\nio/openaev/telemetry/**/*Test.java\nio/openaev/aop/**/*Test.java\nio/openaev/architecture/**/*Test.java\nio/openaev/utils/**/*Test.java\nio/openaev/utilstest/**/*Test.java\nio/openaev/notification/**/*Test.java","excludes":""},
          {"shard":"6","shard_name":"remaining","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"catchall","excludes":""}
        ]
      # ── E2E Tests: 4 images × 2 browsers × 3 shards + infra ──
      # Shards mirror the API split: two explicit buckets plus a catch-all that
      # automatically picks up any newly added spec.
      e2e-matrix: >
        [
          {"browser":"chrome","project":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"tests_e2e/tests/threat-arsenals","excludes":"","artifact_suffix":"-std-amd64-arsenals"},
          {"browser":"chrome","project":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"tests_e2e/tests/multitenant","excludes":"","artifact_suffix":"-std-amd64-multitenant"},
          {"browser":"chrome","project":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"catchall","excludes":"tests_e2e/tests/threat-arsenals\ntests_e2e/tests/multitenant\ntests_e2e/tests/infra","artifact_suffix":"-std-amd64-remaining"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"tests_e2e/tests/threat-arsenals","excludes":"","artifact_suffix":"-std-amd64-arsenals"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"tests_e2e/tests/multitenant","excludes":"","artifact_suffix":"-std-amd64-multitenant"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"catchall","excludes":"tests_e2e/tests/threat-arsenals\ntests_e2e/tests/multitenant\ntests_e2e/tests/infra","artifact_suffix":"-std-amd64-remaining"},
          {"browser":"chromium","project":"chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"tests_e2e/tests/threat-arsenals","excludes":"","artifact_suffix":"-std-arm64-arsenals"},
          {"browser":"chromium","project":"chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"tests_e2e/tests/multitenant","excludes":"","artifact_suffix":"-std-arm64-multitenant"},
          {"browser":"chromium","project":"chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"catchall","excludes":"tests_e2e/tests/threat-arsenals\ntests_e2e/tests/multitenant\ntests_e2e/tests/infra","artifact_suffix":"-std-arm64-remaining"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"tests_e2e/tests/threat-arsenals","excludes":"","artifact_suffix":"-std-arm64-arsenals"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"tests_e2e/tests/multitenant","excludes":"","artifact_suffix":"-std-arm64-multitenant"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"catchall","excludes":"tests_e2e/tests/threat-arsenals\ntests_e2e/tests/multitenant\ntests_e2e/tests/infra","artifact_suffix":"-std-arm64-remaining"},
          {"browser":"chrome","project":"chrome","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"tests_e2e/tests/threat-arsenals","excludes":"","artifact_suffix":"-ubi9-amd64-arsenals"},
          {"browser":"chrome","project":"chrome","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"tests_e2e/tests/multitenant","excludes":"","artifact_suffix":"-ubi9-amd64-multitenant"},
          {"browser":"chrome","project":"chrome","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"catchall","excludes":"tests_e2e/tests/threat-arsenals\ntests_e2e/tests/multitenant\ntests_e2e/tests/infra","artifact_suffix":"-ubi9-amd64-remaining"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"tests_e2e/tests/threat-arsenals","excludes":"","artifact_suffix":"-ubi9-amd64-arsenals"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"tests_e2e/tests/multitenant","excludes":"","artifact_suffix":"-ubi9-amd64-multitenant"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"catchall","excludes":"tests_e2e/tests/threat-arsenals\ntests_e2e/tests/multitenant\ntests_e2e/tests/infra","artifact_suffix":"-ubi9-amd64-remaining"},
          {"browser":"chromium","project":"chromium","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"tests_e2e/tests/threat-arsenals","excludes":"","artifact_suffix":"-ubi9-arm64-arsenals"},
          {"browser":"chromium","project":"chromium","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"tests_e2e/tests/multitenant","excludes":"","artifact_suffix":"-ubi9-arm64-multitenant"},
          {"browser":"chromium","project":"chromium","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"catchall","excludes":"tests_e2e/tests/threat-arsenals\ntests_e2e/tests/multitenant\ntests_e2e/tests/infra","artifact_suffix":"-ubi9-arm64-remaining"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"tests_e2e/tests/threat-arsenals","excludes":"","artifact_suffix":"-ubi9-arm64-arsenals"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"tests_e2e/tests/multitenant","excludes":"","artifact_suffix":"-ubi9-arm64-multitenant"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"catchall","excludes":"tests_e2e/tests/threat-arsenals\ntests_e2e/tests/multitenant\ntests_e2e/tests/infra","artifact_suffix":"-ubi9-arm64-remaining"},
          {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","includes":"","excludes":"","artifact_suffix":"-std-amd64-infra"},
          {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","includes":"","excludes":"","artifact_suffix":"-std-arm64-infra"}
        ]
      snyk-fail-on-error: false
    secrets: inherit
