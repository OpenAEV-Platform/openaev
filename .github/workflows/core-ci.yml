name: "[Core] CI"

# Continuous Integration pipeline.
# Container vulnerability findings are reported but intentionally never block Core CI.
# ⚠️ Branch-protection status check: "pipeline / ✅ Pipeline Gate"

on:
  push:
    branches: [main, testing-xtm-one]
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_ci-pipeline.yml
    with:
      # ── API Tests: 9 shards + catch-all ──
      # Shard patterns live in .github/shards; the catch-all covers unassigned tests.
      api-matrix: >
        [
          {"shard":"1","shard_name":"elk8-1","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"2","shard_name":"elk8-2","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"3","shard_name":"elk8-3","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"4","shard_name":"elk8-4","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"5","shard_name":"elk8-5","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"6","shard_name":"elk8-6","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"7","shard_name":"elk8-7","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"8","shard_name":"elk8-8","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"9","shard_name":"elk8-9","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"10","shard_name":"elk8-remaining","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"catchall","excludes":""}
        ]
      # ── E2E Tests ──
      # PRs shard Chromium on AMD64; main and tags also cover supported browser/architecture combinations.
      e2e-matrix: >-
        ${{ github.event_name == 'pull_request' && '[
        {"browser":"chromium","project":"chromium","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","shard_name":"arsenals","includes":"tests_e2e/tests/threat-arsenals","excludes":"","artifact_suffix":"-std-amd64-arsenals"},
        {"browser":"chromium","project":"chromium","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","shard_name":"external-integrations","includes":"tests_e2e/tests/multitenant/catalog-external-","excludes":"","artifact_suffix":"-std-amd64-external-integrations"},
        {"browser":"chromium","project":"chromium","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","shard_name":"remaining","includes":"catchall","excludes":"tests_e2e/tests/threat-arsenals\ntests_e2e/tests/multitenant/catalog-external-\ntests_e2e/tests/infra","artifact_suffix":"-std-amd64-remaining"},
        {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","shard_name":"infra-agent","includes":"tests_e2e/tests/infra/agent-implant\\.spec\\.ts$","excludes":"","artifact_suffix":"-std-amd64-infra-agent"},
        {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","shard_name":"infra-remaining","includes":"catchall","excludes":"tests_e2e/tests/infra/agent-implant\\.spec\\.ts$\ntests_e2e/tests/infra/agent-implant-multitenant\\.spec\\.ts$","artifact_suffix":"-std-amd64-infra-remaining"},
        {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","shard_name":"infra-multitenant","includes":"tests_e2e/tests/infra/agent-implant-multitenant\\.spec\\.ts$","excludes":"","artifact_suffix":"-std-amd64-infra-multitenant"}
        ]' || '[
        {"browser":"chrome","project":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","shard_name":"arsenals","includes":"tests_e2e/tests/threat-arsenals","excludes":"","artifact_suffix":"-std-amd64-arsenals"},
        {"browser":"chrome","project":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","shard_name":"external-integrations","includes":"tests_e2e/tests/multitenant/catalog-external-","excludes":"","artifact_suffix":"-std-amd64-external-integrations"},
        {"browser":"chrome","project":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","shard_name":"remaining","includes":"catchall","excludes":"tests_e2e/tests/threat-arsenals\ntests_e2e/tests/multitenant/catalog-external-\ntests_e2e/tests/infra","artifact_suffix":"-std-amd64-remaining"},
        {"browser":"chromium","project":"chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","shard_name":"arsenals","includes":"tests_e2e/tests/threat-arsenals","excludes":"","artifact_suffix":"-std-arm64-arsenals"},
        {"browser":"chromium","project":"chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","shard_name":"remaining","includes":"catchall","excludes":"tests_e2e/tests/threat-arsenals\ntests_e2e/tests/multitenant/catalog-external-\ntests_e2e/tests/infra","artifact_suffix":"-std-arm64-remaining"},
        {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","shard_name":"infra-agent","includes":"tests_e2e/tests/infra/agent-implant\\.spec\\.ts","excludes":"","artifact_suffix":"-std-amd64-infra-agent"},
        {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","shard_name":"infra-multitenant","includes":"tests_e2e/tests/infra/agent-implant-multitenant\\.spec\\.ts","excludes":"","artifact_suffix":"-std-amd64-infra-multitenant"},
        {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","shard_name":"infra-agent","includes":"tests_e2e/tests/infra/agent-implant\\.spec\\.ts","excludes":"","artifact_suffix":"-std-arm64-infra-agent"},
        {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","shard_name":"infra-multitenant","includes":"tests_e2e/tests/infra/agent-implant-multitenant\\.spec\\.ts","excludes":"","artifact_suffix":"-std-arm64-infra-multitenant"}
        ]' }}
      vulnerability-scan-fail-on-error: false
    secrets: inherit
