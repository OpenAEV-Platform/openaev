name: "[Core] CI"

# Continuous Integration pipeline.
# Snyk findings are reported but intentionally never block Core CI.
# ⚠️ Branch-protection status check: "pipeline / ✅ Pipeline Gate"

on:
  push:
    branches: [main, testing-xtm-one]
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  pipeline:
    uses: ./.github/workflows/_ci-pipeline.yml
    with:
      # ── API Tests: 4 shards × Elasticsearch ──
      api-matrix: >
        [
          {"shard":"1","shard_name":"main","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"io/openaev/api/**/*Test.java\nio/openaev/integration/**/*Test.java\nio/openaev/injects/**/*Test.java\nio/openaev/opencti/**/*Test.java\nio/openaev/service/**/*Test.java","excludes":""},
          {"shard":"2","shard_name":"rest-1","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"io/openaev/rest/*Test.java\nio/openaev/rest/asset_group/**/*Test.java\nio/openaev/rest/attack_pattern/**/*Test.java\nio/openaev/rest/custom_dashboard/**/*Test.java\nio/openaev/rest/dashboard/**/*Test.java\nio/openaev/rest/exercise/**/*Test.java","excludes":""},
          {"shard":"3","shard_name":"rest-2","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"io/openaev/rest/**/*Test.java","excludes":"io/openaev/rest/*Test.java\nio/openaev/rest/asset_group/**/*Test.java\nio/openaev/rest/attack_pattern/**/*Test.java\nio/openaev/rest/custom_dashboard/**/*Test.java\nio/openaev/rest/dashboard/**/*Test.java\nio/openaev/rest/exercise/**/*Test.java"},
          {"shard":"4","shard_name":"remaining","search_engine":"elasticsearch","engine_selector":"elk","artifact_suffix":"","includes":"catchall","excludes":""}
        ]
      # ── E2E Tests: 4 images × 2 browsers + infra ──
      e2e-matrix: >
        [
          {"browser":"chrome","project":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"chromium","project":"chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"chrome","project":"chrome","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"chromium","project":"chromium","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":"-infra"},
          {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-infra"}
        ]
      snyk-fail-on-error: false
    secrets: inherit
