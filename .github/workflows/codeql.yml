name: "CodeQL"

# Advanced setup mirroring GitHub's default setup for this repository: same languages,
# build modes, query suite, threat model, job names and analysis categories, so alert
# history carries over. It only differs in cache handling and PR hygiene:
#   - Java restores the shared maven-v2 cache read-only instead of CodeQL's own dependency
#     cache, a ~500 MB copy of ~/.m2/repository that default setup also wrote on PR refs.
#   - Overlay (incremental) analysis is off: it stored a ~160 MB database per push to main.
#   - Superseded PR runs are cancelled and documentation-only PRs are skipped.
# Uploads from this workflow are rejected while code scanning default setup is enabled.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # CodeQL is not a required check, so a skipped run cannot block a merge.
    paths-ignore:
      - "docs/**"
      - "adr/**"
      - "brainstorming/**"
      - "**/*.md"
  schedule:
    - cron: "44 23 * * 5"
  workflow_dispatch:

permissions:
  contents: read

# PR runs cancel the previous run of the same PR; every other event gets its own group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CODEQL_OVERLAY_DATABASE_MODE: none

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Same language names and build modes as default setup, which keeps the categories
        # /language:actions, /language:java and /language:javascript.
        include:
          - language: actions
            build-mode: none
          - language: java
            build-mode: autobuild
          - language: javascript
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Read-only: backend-compile is the sole writer of maven-v2.
      - name: Restore Maven dependencies
        if: matrix.language == 'java'
        uses: actions/cache/restore@v6
        with:
          path: ~/.m2/repository
          key: maven-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          dependency-caching: none

      # Selects the highest Java version declared in the POMs among the runner's JDKs.
      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
