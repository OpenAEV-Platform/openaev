name: "[OpenAEV] Copilot On-Demand Review"

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: copilot-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  parse:
    name: "🤖 Parse review command"
    # The author_association gate is the security boundary: the review job below
    # checks out PR head code and runs an agent over it.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.parse.outputs.agents }}
      known: ${{ steps.parse.outputs.known }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      is_fork: ${{ steps.pr.outputs.is_fork }}
      base_ref: ${{ steps.pr.outputs.base_ref }}
    steps:
      - name: Parse review command
        id: parse
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          # Values must match the file basenames in .github/agents/*.agent.md
          ALL='["code-reviewer","security-reviewer","performance-reviewer","multi-tenancy-reviewer","test-specialist","frontend-reviewer","docs-reviewer"]'

          case "$COMMENT" in
            */review\ security*)   AGENTS='["security-reviewer"]' ;;
            */review\ perf*)       AGENTS='["performance-reviewer"]' ;;
            */review\ tenancy*)    AGENTS='["multi-tenancy-reviewer"]' ;;
            */review\ test*)       AGENTS='["test-specialist"]' ;;
            */review\ frontend*)   AGENTS='["frontend-reviewer"]' ;;
            */review\ docs*)       AGENTS='["docs-reviewer"]' ;;
            */review\ api*)        AGENTS='["api-reviewer"]' ;;
            */review\ migration*)  AGENTS='["migration-reviewer"]' ;;
            */review\ chaining*)   AGENTS='["chaining-engine-reviewer"]' ;;
            */review\ code*)       AGENTS='["code-reviewer"]' ;;
            */review\ all*)        AGENTS="$ALL" ;;
            *)
              echo "Unknown review command: $COMMENT"
              AGENTS='[]'
              ;;
          esac

          [ "$AGENTS" = '[]' ] && echo "known=false" >> "$GITHUB_OUTPUT" || echo "known=true" >> "$GITHUB_OUTPUT"
          echo "agents=$AGENTS" >> "$GITHUB_OUTPUT"

      # issue_comment payloads carry no head ref, so the SHA has to be resolved
      # here and pinned for every downstream step.
      - name: Resolve PR head
        id: pr
        if: steps.parse.outputs.known == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr view "$PR_NUMBER" --json headRefOid,isCrossRepository,baseRefName > /tmp/pr.json
          {
            echo "head_sha=$(jq -r .headRefOid /tmp/pr.json)"
            echo "is_fork=$(jq -r .isCrossRepository /tmp/pr.json)"
            echo "base_ref=$(jq -r .baseRefName /tmp/pr.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Acknowledge command
        if: steps.parse.outputs.known == 'true' && steps.pr.outputs.is_fork == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            const agents = JSON.parse('${{ steps.parse.outputs.agents }}');
            const sha = '${{ steps.pr.outputs.head_sha }}';
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🤖 Running ${agents.map((a) => `\`${a}\``).join(', ')} for `
                + `@${context.payload.comment.user.login} against \`${sha.slice(0, 7)}\`. `
                + `Findings will be posted here.`,
            });

      - name: Refuse fork pull requests
        if: steps.parse.outputs.known == 'true' && steps.pr.outputs.is_fork != 'false'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🚫 On-demand agent review is disabled for pull requests from forks.\n\n'
                + 'The review job checks out the head commit and runs an agent over it with '
                + 'repository credentials present, so it only runs on branches in this repository.',
            });

      - name: Unknown command
        if: steps.parse.outputs.known == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '❓ Unknown review command. Available commands:',
                '',
                '| Command | Agent |',
                '|---|---|',
                '| `/review code` | 🔍 Code Reviewer |',
                '| `/review security` | 🔒 Security Reviewer |',
                '| `/review perf` | ⚡ Performance Reviewer |',
                '| `/review tenancy` | 🏠 Multi-Tenancy Reviewer |',
                '| `/review tests` | 🧪 Test Specialist |',
                '| `/review frontend` | 🎨 Frontend Reviewer |',
                '| `/review docs` | 📖 Docs Reviewer |',
                '| `/review api` | 🔌 API Reviewer |',
                '| `/review migration` | 🗃️ Migration Reviewer |',
                '| `/review chaining` | 🔗 Chaining Engine Reviewer |',
                '| `/review all` | All review agents |',
              ].join('\n'),
            });

  review:
    name: "🤖 ${{ matrix.agent }}"
    needs: parse
    if: needs.parse.outputs.known == 'true' && needs.parse.outputs.is_fork == 'false'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: ${{ fromJSON(needs.parse.outputs.agents) }}
    steps:
      - name: Check Copilot CLI credentials
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
        run: |
          if [ -z "$COPILOT_TOKEN" ]; then
            echo "❌ Secret COPILOT_CLI_TOKEN is not set. Copilot CLI needs a token"
            echo "   from an account with a Copilot subscription — the default"
            echo "   GITHUB_TOKEN has no Copilot entitlement."
            exit 1
          fi

      - name: Checkout pinned PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.parse.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve merge base
        env:
          HEAD_SHA: ${{ needs.parse.outputs.head_sha }}
          BASE_REF: ${{ needs.parse.outputs.base_ref }}
        run: |
          ACTUAL=$(git rev-parse HEAD)
          if [ "$ACTUAL" != "$HEAD_SHA" ]; then
            echo "❌ Checked out $ACTUAL but expected $HEAD_SHA"
            exit 1
          fi
          git fetch --no-tags origin "$BASE_REF"
          echo "BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)" >> "$GITHUB_ENV"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      # No GITHUB_TOKEN in this step: the agent reads attacker-authored files, so
      # anything it can reach is reachable by prompt injection.
      - name: Run reviewer agent
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          AGENT: ${{ matrix.agent }}
        run: |
          PROMPT="Review the changes returned by 'git diff ${BASE_SHA}..HEAD'.
          Follow your agent definition exactly, including its context-loading and
          skill steps. Report findings as GitHub-flavoured Markdown grouped by
          severity, each with a file path and line number. If you find nothing,
          say so in one line. Output the report only."

          copilot --agent="$AGENT" \
                  --prompt "$PROMPT" \
                  --allow-all-tools \
                  --excluded-tools 'create,edit,apply_patch' \
                  --deny-tool 'write' \
                  --deny-tool 'url' \
                  --deny-tool 'shell(git push)' \
                  --deny-tool 'shell(gh)' \
                  --disable-builtin-mcps \
                  --no-ask-user \
                  --silent \
            | tee /tmp/review-raw.md

      - name: Post findings
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT: ${{ matrix.agent }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.parse.outputs.head_sha }}
        run: |
          {
            echo "### 🤖 \`$AGENT\` — reviewed \`${HEAD_SHA:0:7}\`"
            echo
            if [ -s /tmp/review-raw.md ]; then
              head -c 60000 /tmp/review-raw.md  # PR comment bodies cap at 65536
            else
              echo "Agent produced no output — see the workflow run for details."
            fi
          } > /tmp/review.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/review.md
