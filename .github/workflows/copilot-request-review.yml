name: "[OpenAEV] Copilot On-Demand Review"

on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: copilot-review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  request-review:
    name: "🤖 Request Copilot review"
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Request GitHub Copilot code review
        uses: actions/github-script@v9
        with:
          script: |
            const command = context.payload.comment.body.trim();
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            };

            if (command !== '/review') {
              await github.rest.issues.createComment({
                owner: request.owner,
                repo: request.repo,
                issue_number: request.pull_number,
                body: '❓ The token-free workflow supports `/review` only. '
                  + 'GitHub-hosted Copilot review applies repository instructions and '
                  + 'relevant review skills automatically, but it cannot select a custom agent.',
              });
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                ...request,
                reviewers: ['copilot-pull-request-reviewer[bot]'],
              });
              await github.rest.reactions.createForIssueComment({
                owner: request.owner,
                repo: request.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket',
              });
              await github.rest.issues.createComment({
                owner: request.owner,
                repo: request.repo,
                issue_number: request.pull_number,
                body: `🤖 GitHub Copilot code review requested by `
                  + `@${context.payload.comment.user.login}.`,
              });
            } catch (error) {
              await github.rest.issues.createComment({
                owner: request.owner,
                repo: request.repo,
                issue_number: request.pull_number,
                body: '❌ Could not request GitHub Copilot code review. Ensure Copilot '
                  + 'code review is enabled for this repository; see the workflow log for details.',
              });
              core.setFailed(error.message);
            }
