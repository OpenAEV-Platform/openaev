name: "[OpenAEV] Check Signed Commits in PR"
on:
  pull_request_target:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: write
jobs:
  check-signed-commits:
    runs-on: ubuntu-24.04
    steps:
      - name: Check signed commits in PR
        uses: FiligranHQ/filigran-ci-tools/actions/check-signed-commit@56eae5a1f6a69ffb895f9b260745583f05a0bade # main
