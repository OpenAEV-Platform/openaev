name: "[OpenAEV] Check Signed Commits in PR"
on:
  pull_request_target:
    branches: [ main ]
permissions:
  contents: read
  pull-requests: write
jobs:
  check-signed-commits:
    runs-on: ubuntu-24.04
    steps:
      - name: Check signed commits in PR
        uses: FiligranHQ/filigran-ci-tools/actions/check-signed-commit@7d1dbb14c31f82a69a00bf72ee5a18b85035e248 # main
