name: "[Core] Deploy Feature Branch Build"

# Unprivileged build workflow dispatched by deploy-feature-branch.yml.
# SECURITY: The build job has read-only contents/actions access — no secrets
# and no write-capable token. Only report-failure, which never runs PR code,
# can write deployment statuses.
# It builds untrusted PR code. The run is on main's ref, so every job can write
# main's Actions cache: PR code may only run inside containers, never directly on
# the runner. Actions and scripts come from main's checkout at the workspace root;
# the PR is checked out under pr/ and only used as the Docker build context.
#
# The application is built from source via a multi-stage Dockerfile. Agent,
# implant, and catalog assets are prepared once and included in the image.
# Feature environments only run linux/amd64, so arm64 is not built. On success,
# the OCI archive is uploaded for downstream promotion.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number"
        required: true
        type: string
      head_ref:
        description: "PR branch name"
        required: true
        type: string
      head_sha:
        description: "PR head commit SHA"
        required: true
        type: string
      deployment_id:
        description: "GitHub deployment ID to report status on"
        required: true
        type: string

concurrency:
  # The dispatcher finishes immediately, so concurrency must cover the actual
  # build workflow. A newer /deploy request for the same PR supersedes the old one.
  group: feature-deploy-build-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read # strictly read-only for the build job — no secrets, no write token
  actions: read

jobs:
  docker-build:
    name: "🐳 Docker Build (amd64)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Trusted: the main commit this run was dispatched on
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            scripts
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_sha }}
          path: pr
          # prepare-bundled-assets derives the local asset version from `git describe`
          fetch-depth: 0
          filter: blob:none
          # The checkout is the build context, which RUN steps can bind-mount
          persist-credentials: false
      - name: Compute immutable Docker tag
        id: image-tag
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: echo "value=openaev:${HEAD_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/docker-build
        id: docker-build
        with:
          tags: ${{ steps.image-tag.outputs.value }}
          context: pr
          dockerfile: pr/Dockerfile
          platform: linux/amd64
          download-release-assets: "true"
          allow-registry: "false"
          untrusted-context: "true"
          upload-artifact: "false"
      # Promotion expects one openaev-image artifact holding openaev-image.tar.gz.
      # The single-platform OCI archive already carries an image index, so no merge is needed.
      - name: Rename image archive for promotion
        env:
          ARCHIVE: ${{ steps.docker-build.outputs.artifact-name }}.tar.gz
        run: mv "$ARCHIVE" openaev-image.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: openaev-image
          path: openaev-image.tar.gz
          retention-days: 1
          # The archive is already compressed.
          compression-level: 0
      # Metadata for the promotion, which only runs on a successful build
      - name: Write metadata file
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_REF: ${{ inputs.head_ref }}
          HEAD_SHA: ${{ inputs.head_sha }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          BUILD_RESULT: success
        run: |
          mkdir -p metadata
          jq -n \
            --arg pr "$PR_NUMBER" \
            --arg ref "$HEAD_REF" \
            --arg sha "$HEAD_SHA" \
            --arg did "$DEPLOYMENT_ID" \
            --arg res "$BUILD_RESULT" \
            '{pr_number: $pr, head_ref: $ref, head_sha: $sha, deployment_id: $did, build_result: $res}' \
            > metadata/deploy-metadata.json
      - uses: actions/upload-artifact@v7
        with:
          name: deploy-metadata
          path: metadata/

  # Only runs when the build did not succeed, so a successful build costs no
  # extra runner. It never runs PR code.
  report-failure:
    name: "🚦 Report build failure"
    needs: docker-build
    if: always() && needs.docker-build.result != 'success'
    permissions:
      deployments: write # to update the deployment status
    runs-on: ubuntu-latest
    steps:
      - name: Update deployment status
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BUILD_RESULT: ${{ needs.docker-build.result }}
        with:
          script: |
            const { DEPLOYMENT_ID, HEAD_SHA, BUILD_RESULT } = process.env;
            const shortSha = HEAD_SHA.slice(0, 7);
            // Cancelled: superseded by a newer commit or /deploy
            const cancelled = BUILD_RESULT === 'cancelled';
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: Number(DEPLOYMENT_ID),
              state: cancelled ? 'inactive' : 'failure',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: cancelled
                ? `${shortSha} superseded by a newer deployment`
                : `Image build failed for ${shortSha}`,
              auto_inactive: false
            });
