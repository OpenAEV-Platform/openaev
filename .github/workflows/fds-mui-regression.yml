# Blocks a MUI component from re-entering the codebase where the design system
# already replaces it in THIS product. Reads only the symbols a file did not
# already import on the merge base, so existing code is untouched by
# construction.
#
# The watched list is generated, never typed here:
# fds-migration/mui-regression-policy.generated.json, emitted by
# `pnpm generate:mui-regression-policy --product openaev` in the
# filigran-design-system repo.
#
# Only pull requests targeting design-system/current run it. Against main the
# gate reads the whole migration as new code — 42 findings across 27 files,
# mostly Typography, when this gate was installed — because those files do not
# exist there yet.
# Drop the `branches:` filter when design-system/current merges into main:
# from then on a PR to main carries a normal-sized diff, which is the
# situation OpenCTI's copy of this gate already runs in.
#
# No `paths:` filter, on purpose: a required check that never runs leaves
# unrelated PRs pending forever. On a PR that touches no front-end file the
# gate reads zero added imports, reports PASS and says so.
name: FDS MUI regression

on:
  pull_request:
    branches: [design-system/current]
  workflow_dispatch:

jobs:
  mui-regression:
    name: MUI regression gate
    runs-on: ubuntu-latest
    steps:
      # Full history: the gate diffs against the merge base with the target
      # branch, which a shallow clone cannot resolve.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check for MUI regressions
        run: node fds-migration/scripts/check-mui-regression.mjs --base origin/${{ github.base_ref }}

      # Runs whatever the verdict was: on a red gate this is the context the
      # author needs, and printing it only on success would hide it exactly
      # when it matters.
      - name: Policy in force
        if: always()
        run: node fds-migration/scripts/check-mui-regression.mjs --explain
