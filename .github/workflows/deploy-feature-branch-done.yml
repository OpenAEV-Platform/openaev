name: "[Core] Deploy Feature Branch Done"

# Triggered when the unprivileged build workflow completes.
# Reports a failed or cancelled build on the PR's GitHub deployment. On
# success it stays silent: a downstream promotion workflow
# picks up the artifact, deploys the image and owns the deployment status.
#
# SECURITY: This workflow NEVER checks out PR code. The metadata artifact is
# produced by a run that executed PR code, so its deployment_id is only
# trusted once the deployment's status log_url matches this build run.

on:
  workflow_run:
    workflows: ['\[Core\] Deploy Feature Branch Build']
    types: [completed]

permissions:
  actions: read # to download artifacts
  deployments: write # to update the deployment status

jobs:
  notify:
    name: "🚦 Update deployment status"
    runs-on: ubuntu-latest
    steps:
      - name: Download metadata artifact
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const match = artifacts.data.artifacts.find(a => a.name === 'deploy-metadata');
            if (!match) {
              core.setFailed('deploy-metadata artifact not found');
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: 'zip',
            });
            const fs = require('fs');
            fs.writeFileSync('metadata.zip', Buffer.from(download.data));

      - name: Extract metadata
        run: |
          unzip -o metadata.zip -d metadata
          cat metadata/deploy-metadata.json

      - name: Update deployment status
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const meta = JSON.parse(fs.readFileSync('metadata/deploy-metadata.json', 'utf8'));
            const deploymentId = parseInt(meta.deployment_id, 10);
            const runId = context.payload.workflow_run.id;
            const runUrl = context.payload.workflow_run.html_url;
            const conclusion = context.payload.workflow_run.conclusion;

            if (conclusion === 'success' && meta.build_result === 'success') {
              // Downstream promotion reports progress from here on
              core.info('Build succeeded, downstream promotion takes over the deployment status.');
              return;
            }

            const { data: deployment } = await github.rest.repos.getDeployment({
              owner, repo, deployment_id: deploymentId
            });
            const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
              owner, repo, deployment_id: deploymentId, per_page: 100
            });
            const runPattern = new RegExp(`/actions/runs/${runId}(/attempts/\\d+)?$`);
            if (!deployment.environment.startsWith('feature-pr-') ||
                !statuses.some(s => runPattern.test(s.log_url || ''))) {
              core.setFailed(`Deployment ${deploymentId} does not belong to build run ${runUrl}`);
              return;
            }

            const shortSha = deployment.sha.slice(0, 7);
            let state, description;
            if (conclusion === 'cancelled') {
              // Superseded by a newer commit or /deploy
              state = 'inactive';
              description = `${shortSha} superseded by a newer deployment`;
            } else {
              state = 'failure';
              description = `Image build failed for ${shortSha}`;
            }

            await github.rest.repos.createDeploymentStatus({
              owner, repo,
              deployment_id: deploymentId,
              state,
              log_url: runUrl,
              description,
              auto_inactive: false
            });
