name: Claude rules sync check

on:
  push:
    paths:
      - '.github/instructions/**'
      - '.claude/rules/**'
      - '.github/scripts/sync-claude-rules.py'
      - '.github/workflows/ci-claude-rules.yml'
  pull_request:
    paths:
      - '.github/instructions/**'
      - '.claude/rules/**'
      - '.github/scripts/sync-claude-rules.py'
      - '.github/workflows/ci-claude-rules.yml'

permissions:
  contents: read

jobs:
  claude-rules:
    name: Check .claude/rules matches .github/instructions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check generated Claude rules
        run: python .github/scripts/sync-claude-rules.py --check
