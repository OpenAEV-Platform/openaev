name: Deploy design-system

on:
  workflow_dispatch:
  push:
    branches:
      - design-system/current

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build design-system image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: jirutka/setup-alpine@v1
        with:
          branch: v3.23
          extra-repositories: |
            https://dl-cdn.alpinelinux.org/alpine/edge/community/
          packages: >
            nodejs npm git tini gcc g++ make musl-dev cargo openjdk21-jdk maven postfix postfix-pcre
      - name: Setup Node.js
        run: |
          npm install -g corepack
        shell: alpine.sh --root {0}
      - name: Build into Alpine
        env:
          FDS_GIT_TOKEN: ${{ secrets.FDS_GIT_TOKEN }}
        run: |
          export JAVA_HOME=/usr/lib/jvm/default-jvm/
          # These two lines are inlined on purpose, and duplicated across the
          # three Alpine workflows: this step runs with `shell: alpine.sh`, and a
          # composite action's `shell: bash` step cannot execute there — so
          # ./.github/actions/setup-fds-auth is unusable in this block. Do not
          # "de-duplicate" this into the composite action: it breaks all three.
          # openaev-front consumes the private XTM-Foundation/filigran-design-system
          # repository as a direct git dependency; yarn cannot clone it anonymously.
          if [ -z "$FDS_GIT_TOKEN" ]; then
            echo "FDS_GIT_TOKEN is empty: yarn install cannot clone the design system." >&2
            exit 1
          fi
          git config --global \
            url."https://x-access-token:${FDS_GIT_TOKEN}@github.com/".insteadOf \
            "https://github.com/"
          cd openaev-front
          yarn install
          yarn build
          cd ../
          mvn install -DskipTests -Pdev
        shell: alpine.sh {0}
      - run: mkdir -p openaev-build/
      - run: cp openaev-api/target/openaev-api.jar openaev-build/
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: filigran/openaev-platform
          tags: |
            type=raw,value=ds

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: buildpush
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile_ga
          push: true
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=filigran/openaev-platform:buildcache
          cache-to: type=registry,ref=filigran/openaev-platform:buildcache,mode=max

  deploy:
    name: Restart design-system instance
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Install AWX cli
        run: pip install awxkit

      - name: Restart instance via AWX
        run: |
          awx --conf.host ${{ secrets.AWX_URL }} \
            --conf.username ${{ secrets.AWX_USER }} \
            --conf.password ${{ secrets.AWX_PASSWORD }} \
            job_templates launch 'Rollout restart an instance resources' \
            --inventory eu-west-staging \
            --extra_vars '{"solution":"openaev", "customer":"design-system-oaev"}' \
            --wait \
            -f human
