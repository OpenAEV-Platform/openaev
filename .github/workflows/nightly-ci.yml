name: "[Core] Nightly CI"

on:
  schedule:
    - cron: "0 3 * * *" # Every day at 3:00 AM UTC
  workflow_dispatch: {} # Manual trigger for on-demand runs

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:

  # ────────────────────────────────────────────────────────────────────
  # Build stages (Linux only — artifacts are OS-independent)
  # ────────────────────────────────────────────────────────────────────

  backend-compile:
    name: Backend Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-compile

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend-build

  prepare-release-assets:
    name: Prepare Release Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute versions
        id: versions
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "binary_version=${TAG}" >> "$GITHUB_OUTPUT"
            echo "catalog_version=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "binary_version=latest" >> "$GITHUB_OUTPUT"
            echo "catalog_version=rolling" >> "$GITHUB_OUTPUT"
          fi

      - name: Download agent & implant binaries
        run: |
          BINARY_VERSION="${{ steps.versions.outputs.binary_version }}"

          if [[ "${{ steps.versions.outputs.catalog_version }}" == "rolling" || "${{ steps.versions.outputs.catalog_version }}" == "prerelease" ]]; then
            LOCAL_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo "$BINARY_VERSION")"
          else
            LOCAL_VERSION="$BINARY_VERSION"
          fi

          chmod +x scripts/download-binaries.sh
          bash scripts/download-binaries.sh "$BINARY_VERSION" "$LOCAL_VERSION"

      - name: Patch catalog version
        run: |
          CATALOG_FILE=openaev-api/src/main/resources/catalog/catalog-integrators.json
          CATALOG_VERSION="${{ steps.versions.outputs.catalog_version }}"

          jq --arg ver "$CATALOG_VERSION" \
            '.contracts[].container_version = $ver | .version = $ver' \
            "$CATALOG_FILE" > catalog.tmp
          mv catalog.tmp "$CATALOG_FILE"

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            openaev-api/src/main/resources/agents/
            openaev-api/src/main/resources/implants/
            openaev-api/src/main/resources/catalog/

  # ────────────────────────────────────────────────────────────────────
  # Backend API tests — full suite (no sharding)
  # Two parallel variants: Elasticsearch vs OpenSearch
  # Services use classic GitHub Actions service containers.
  # MinIO requires a custom command (server /data) and is started manually.
  # ────────────────────────────────────────────────────────────────────

  api-tests-elasticsearch:
    name: API Tests (Elasticsearch)
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: openaev
          POSTGRES_PASSWORD: openaev
          POSTGRES_DB: openaev
          POSTGRES_INITDB_ARGS: "-c max_connections=1000"
        options: >-
          --health-cmd "pg_isready -U openaev" --health-interval 10s
          --health-timeout 5s --health-retries 5
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.19.15
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms2g -Xmx2g"
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit
          1" --health-interval 15s --health-timeout 10s --health-retries 20
          --health-start-period 30s
      rabbitmq:
        image: rabbitmq:4.3-management
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running" --health-interval
          15s --health-timeout 10s --health-retries 15 --health-start-period 20s
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openaev
      SPRING_DATASOURCE_USERNAME: openaev
      SPRING_DATASOURCE_PASSWORD: openaev
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 11000
      ENGINE_URL: http://localhost:9200
      OPENBAS_RABBITMQ_HOSTNAME: localhost
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 11000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-06-13T11-33-47Z server /data

          echo "⏳ Waiting for MinIO..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:11000/minio/health/live && break
            sleep 1
          done
          curl -sf http://localhost:11000/minio/health/live || { echo "❌ MinIO failed to start"; exit 1; }
          echo "✅ MinIO ready"

      - name: Build all modules (skip tests)
        run: mvn -B -ntp clean install -DskipTests


      - name: Run API tests (Elasticsearch)
        run: mvn -B -ntp -pl openaev-api verify

      - name: Upload JaCoCo exec data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-exec-elasticsearch
          path: openaev-api/target/jacoco.exec
          if-no-files-found: warn

  api-tests-opensearch:
    name: API Tests (OpenSearch)
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: openaev
          POSTGRES_PASSWORD: openaev
          POSTGRES_DB: openaev
          POSTGRES_INITDB_ARGS: "-c max_connections=1000"
        options: >-
          --health-cmd "pg_isready -U openaev" --health-interval 10s
          --health-timeout 5s --health-retries 5
      opensearch:
        image: opensearchproject/opensearch:3.6.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit
          1" --health-interval 15s --health-timeout 10s --health-retries 20
          --health-start-period 30s
      rabbitmq:
        image: rabbitmq:4.3-management
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running" --health-interval
          15s --health-timeout 10s --health-retries 15 --health-start-period 20s
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openaev
      SPRING_DATASOURCE_USERNAME: openaev
      SPRING_DATASOURCE_PASSWORD: openaev
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 11000
      ENGINE_URL: http://localhost:9200
      ENGINE_ENGINESELECTOR: opensearch
      OPENBAS_RABBITMQ_HOSTNAME: localhost
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 11000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-06-13T11-33-47Z server /data

          echo "⏳ Waiting for MinIO..."
          for i in $(seq 1 30); do
            curl -sf http://localhost:11000/minio/health/live && break
            sleep 1
          done
          curl -sf http://localhost:11000/minio/health/live || { echo "❌ MinIO failed to start"; exit 1; }
          echo "✅ MinIO ready"

      - name: Build all modules (skip tests)
        run: mvn -B -ntp clean install -DskipTests


      - name: Run API tests (OpenSearch)
        run: mvn -B -ntp -pl openaev-api verify

      - name: Upload JaCoCo exec data
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-exec-opensearch
          path: openaev-api/target/jacoco.exec
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────
  # Backend package (needed for E2E tests)
  # ────────────────────────────────────────────────────────────────────

  backend-package:
    name: Backend Package
    needs: [ frontend-build, backend-compile, prepare-release-assets ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-package
        with:
          download-release-assets: 'true'

  e2e-infra-tests:
    name: "E2E Infra (${{ matrix.arch }})"
    needs: [ backend-package ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openaev
      SPRING_DATASOURCE_USERNAME: openaev
      SPRING_DATASOURCE_PASSWORD: openaev
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 11000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_ACCESS_SECRET: minioadmin
      ENGINE_URL: http://localhost:9200
      OPENBAS_RABBITMQ_HOSTNAME: localhost
      OPENAEV_ADMIN_EMAIL: admin@openaev.io
      OPENAEV_ADMIN_PASSWORD: admin
      OPENAEV_ADMIN_TOKEN: 0d17ce9a-f3a8-4c6d-9721-c98dc3dc023f
      OPENAEV_ADMIN_ENCRYPTION_KEY: ThisIsMyUltraSecureEncryptionKey
      OPENAEV_ADMIN_ENCRYPTION_SALT: ilikesaltyfoodnomnom
      SPRING_PROFILES_ACTIVE: ci
      OPENAEV_APPLICATION_LICENSE: ${{ secrets.OPENAEV_APPLICATION_LICENSE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-tests
        with:
          playwright-config: playwright.infra.chromium_config.ts
          browser: chromium
          start-all-services: 'true'
          app-readiness-check: port

  # ────────────────────────────────────────────────────────────────────
  # E2E tests — browser × engine matrix (Linux x64, services managed by GitHub)
  # Search engine and MinIO use docker run (services: doesn't support
  # custom commands or conditional images).
  # ────────────────────────────────────────────────────────────────────

  e2e-tests:
    name: "E2E (${{ matrix.engine.name }} / ${{ matrix.browser }})"
    needs: [ backend-package ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox, webkit, edge ]
        engine:
          - name: elasticsearch
            image: docker.elastic.co/elasticsearch/elasticsearch:8.18.3
          - name: opensearch
            image: opensearchproject/opensearch:3.3.2
    services:
      pgsql:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: openaev
          POSTGRES_PASSWORD: openaev
          POSTGRES_DB: openaev
          POSTGRES_INITDB_ARGS: "-c max_connections=1000"
        options: >-
          --health-cmd "pg_isready -U openaev" --health-interval 10s
          --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:4.3-management
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running" --health-interval
          15s --health-timeout 10s --health-retries 15 --health-start-period 20s
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openaev
      SPRING_DATASOURCE_USERNAME: openaev
      SPRING_DATASOURCE_PASSWORD: openaev
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 11000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_ACCESS_SECRET: minioadmin
      ENGINE_URL: http://localhost:9200
      ENGINE_ENGINESELECTOR: ${{ matrix.engine.name == 'opensearch' && 'opensearch' || 'elk' }}
      OPENBAS_RABBITMQ_HOSTNAME: localhost
      OPENAEV_ADMIN_EMAIL: admin@openaev.io
      OPENAEV_ADMIN_PASSWORD: admin
      OPENAEV_ADMIN_TOKEN: 0d17ce9a-f3a8-4c6d-9721-c98dc3dc023f
      OPENAEV_ADMIN_ENCRYPTION_KEY: ThisIsMyUltraSecureEncryptionKey
      OPENAEV_ADMIN_ENCRYPTION_SALT: ilikesaltyfoodnomnom
      SPRING_PROFILES_ACTIVE: ci
      OPENAEV_APPLICATION_LICENSE: ${{ secrets.OPENAEV_APPLICATION_LICENSE }}
    steps:
      - uses: actions/checkout@v7
      - name: Run E2E tests
        uses: ./.github/actions/e2e-tests
        with:
          browser: ${{ matrix.browser }}
          playwright-config: playwright.nightly.config.ts
          playwright-extra-args: --project=setup --project=${{ matrix.browser }} --workers=1 --retries=2
          start-search-engine: 'true'
          engine-name: ${{ matrix.engine.name }}
          engine-image: ${{ matrix.engine.image }}
          install-chromium-for-setup: 'true'
          app-readiness-check: port
          app-log-artifact-name: app-log-${{ matrix.engine.name }}-${{ matrix.browser }}
          playwright-report-artifact-name: playwright-report-${{ matrix.engine.name }}-${{ matrix.browser }}

      - name: Verify API types are up to date
        if: matrix.browser == 'chromium' && matrix.engine.name == 'elasticsearch'
        working-directory: openaev-front
        run: |
          API_URL=http://localhost:8080 yarn generate-types-from-api
          if git diff --name-only | grep -q './src/utils/api-types.d.ts'; then
            git diff ./src/utils/api-types.d.ts
            echo "⚠️ Forgot to generate types! Run 'yarn generate-types-from-api' before committing."; exit 1
          fi

  # ────────────────────────────────────────────────────────────────────
  # E2E tests — Linux ARM, browser × engine matrix
  # Playwright supports chromium and firefox on arm64 Linux.
  # ────────────────────────────────────────────────────────────────────

  e2e-tests-arm:
    name: "E2E (arm / ${{ matrix.engine.name }} / ${{ matrix.browser }})"
    needs: [ backend-package ]
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        browser: [ chromium, firefox ]
        engine:
          - name: elasticsearch
            image: docker.elastic.co/elasticsearch/elasticsearch:8.18.3
          - name: opensearch
            image: opensearchproject/opensearch:3.3.2
    services:
      pgsql:
        image: postgres:17-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: openaev
          POSTGRES_PASSWORD: openaev
          POSTGRES_DB: openaev
          POSTGRES_INITDB_ARGS: "-c max_connections=1000"
        options: >-
          --health-cmd "pg_isready -U openaev" --health-interval 10s
          --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:4.3-management
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running" --health-interval
          15s --health-timeout 10s --health-retries 15 --health-start-period 20s
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openaev
      SPRING_DATASOURCE_USERNAME: openaev
      SPRING_DATASOURCE_PASSWORD: openaev
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 11000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_ACCESS_SECRET: minioadmin
      ENGINE_URL: http://localhost:9200
      ENGINE_ENGINESELECTOR: ${{ matrix.engine.name == 'opensearch' && 'opensearch' || 'elk' }}
      OPENBAS_RABBITMQ_HOSTNAME: localhost
      OPENAEV_ADMIN_EMAIL: admin@openaev.io
      OPENAEV_ADMIN_PASSWORD: admin
      OPENAEV_ADMIN_TOKEN: 0d17ce9a-f3a8-4c6d-9721-c98dc3dc023f
      OPENAEV_ADMIN_ENCRYPTION_KEY: ThisIsMyUltraSecureEncryptionKey
      OPENAEV_ADMIN_ENCRYPTION_SALT: ilikesaltyfoodnomnom
      SPRING_PROFILES_ACTIVE: ci
      OPENAEV_APPLICATION_LICENSE: ${{ secrets.OPENAEV_APPLICATION_LICENSE }}
    steps:
      - uses: actions/checkout@v7
      - name: Run E2E tests (arm)
        uses: ./.github/actions/e2e-tests
        with:
          browser: ${{ matrix.browser }}
          playwright-config: playwright.nightly.config.ts
          playwright-extra-args: --project=setup --project=${{ matrix.browser }} --workers=1 --retries=2
          start-search-engine: 'true'
          engine-name: ${{ matrix.engine.name }}
          engine-image: ${{ matrix.engine.image }}
          install-chromium-for-setup: 'true'
          app-readiness-check: port
          ci-arch: arm64
          app-log-artifact-name: app-log-arm-${{ matrix.engine.name }}-${{ matrix.browser }}
          playwright-report-artifact-name: playwright-report-arm-${{ matrix.engine.name }}-${{ matrix.browser }}

