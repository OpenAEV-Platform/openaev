name: "[Core] Nightly CI"

# Nightly: same pipeline, larger matrix.
# Adds OpenSearch, Firefox, Edge, ubuntu-22.04 variants.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  pipeline:
    uses: ./.github/workflows/_ci-pipeline.yml
    with:
      # ── API Tests: 4 shards × Elasticsearch + 4 shards × OpenSearch ──
      api-matrix: >
        [
          {"shard":"1","shard_name":"main","search_engine":"elasticsearch","engine_selector":"","artifact_suffix":"","includes":"io/openaev/api/**/*Test.java\nio/openaev/integration/**/*Test.java\nio/openaev/injects/**/*Test.java\nio/openaev/opencti/**/*Test.java\nio/openaev/service/**/*Test.java","excludes":""},
          {"shard":"2","shard_name":"rest-1","search_engine":"elasticsearch","engine_selector":"","artifact_suffix":"","includes":"io/openaev/rest/*Test.java\nio/openaev/rest/asset_group/**/*Test.java\nio/openaev/rest/attack_pattern/**/*Test.java\nio/openaev/rest/custom_dashboard/**/*Test.java\nio/openaev/rest/dashboard/**/*Test.java\nio/openaev/rest/exercise/**/*Test.java","excludes":""},
          {"shard":"3","shard_name":"rest-2","search_engine":"elasticsearch","engine_selector":"","artifact_suffix":"","includes":"io/openaev/rest/**/*Test.java","excludes":"io/openaev/rest/*Test.java\nio/openaev/rest/asset_group/**/*Test.java\nio/openaev/rest/attack_pattern/**/*Test.java\nio/openaev/rest/custom_dashboard/**/*Test.java\nio/openaev/rest/dashboard/**/*Test.java\nio/openaev/rest/exercise/**/*Test.java"},
          {"shard":"4","shard_name":"remaining","search_engine":"elasticsearch","engine_selector":"","artifact_suffix":"","includes":"catchall","excludes":""},
          {"shard":"1","shard_name":"main-os","search_engine":"opensearch","engine_selector":"opensearch","artifact_suffix":"-opensearch","includes":"io/openaev/api/**/*Test.java\nio/openaev/integration/**/*Test.java\nio/openaev/injects/**/*Test.java\nio/openaev/opencti/**/*Test.java\nio/openaev/service/**/*Test.java","excludes":""},
          {"shard":"2","shard_name":"rest-1-os","search_engine":"opensearch","engine_selector":"opensearch","artifact_suffix":"-opensearch","includes":"io/openaev/rest/*Test.java\nio/openaev/rest/asset_group/**/*Test.java\nio/openaev/rest/attack_pattern/**/*Test.java\nio/openaev/rest/custom_dashboard/**/*Test.java\nio/openaev/rest/dashboard/**/*Test.java\nio/openaev/rest/exercise/**/*Test.java","excludes":""},
          {"shard":"3","shard_name":"rest-2-os","search_engine":"opensearch","engine_selector":"opensearch","artifact_suffix":"-opensearch","includes":"io/openaev/rest/**/*Test.java","excludes":"io/openaev/rest/*Test.java\nio/openaev/rest/asset_group/**/*Test.java\nio/openaev/rest/attack_pattern/**/*Test.java\nio/openaev/rest/custom_dashboard/**/*Test.java\nio/openaev/rest/dashboard/**/*Test.java\nio/openaev/rest/exercise/**/*Test.java"},
          {"shard":"4","shard_name":"remaining-os","search_engine":"opensearch","engine_selector":"opensearch","artifact_suffix":"-opensearch","includes":"catchall","excludes":""}
        ]
      # ── E2E Tests: core browsers + Firefox + Edge + OpenSearch + ubuntu-22 ──
      e2e-matrix: >
        [
          {"browser":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"webkit","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"webkit","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"chrome","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"webkit","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"chromium","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"webkit","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":""},
          {"browser":"firefox","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":"-firefox"},
          {"browser":"firefox","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":"-firefox"},
          {"browser":"edge","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":"-edge"},
          {"browser":"edge","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-latest","search_engine":"elasticsearch","artifact_suffix":"-edge"},
          {"browser":"firefox","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-firefox"},
          {"browser":"firefox","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-firefox"},
          {"browser":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"opensearch","artifact_suffix":"-opensearch"},
          {"browser":"webkit","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-latest","search_engine":"opensearch","artifact_suffix":"-opensearch"},
          {"browser":"chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"opensearch","artifact_suffix":"-opensearch"},
          {"browser":"webkit","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"opensearch","artifact_suffix":"-opensearch"},
          {"browser":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-22.04","search_engine":"elasticsearch","artifact_suffix":"-ubuntu22"},
          {"browser":"firefox","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-22.04","search_engine":"elasticsearch","artifact_suffix":"-ubuntu22"}
        ]
      # ── E2E Infra: x64 + arm64 ──
      e2e-infra-matrix: >
        [
          {"arch":"x64","runner":"ubuntu-latest","docker_image":"openaev-image-amd64"},
          {"arch":"arm64","runner":"ubuntu-24.04-arm","docker_image":"openaev-image-arm64"}
        ]
    secrets: inherit
