name: "[Core] Nightly CI"

# Nightly: same pipeline, larger matrix.
# Adds OpenSearch coverage for Chrome/WebKit/Chromium, Firefox and Edge on
# Elasticsearch, and expanded infrastructure-test coverage.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_ci-pipeline.yml
    with:
      # ── API Tests: 15 shards + catch-all across Elasticsearch and OpenSearch ──
      # The engine client is detected from the server: search_engine picks the server started
      # (elasticsearch8, elasticsearch for the compose default major, or opensearch).
      api-matrix: >
        [
          {"shard":"1","shard_name":"1","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"2","shard_name":"2","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"3","shard_name":"3","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"4","shard_name":"4","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"5","shard_name":"5","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"6","shard_name":"6","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"7","shard_name":"7","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"8","shard_name":"8","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"9","shard_name":"9","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"10","shard_name":"10","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"11","shard_name":"11","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"12","shard_name":"12","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"13","shard_name":"13","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"14","shard_name":"14","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"15","shard_name":"15","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"16","shard_name":"remaining","search_engine":"elasticsearch8","artifact_suffix":"","includes":"catchall","excludes":""},
          {"shard":"1","shard_name":"elk9-1","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"2","shard_name":"elk9-2","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"3","shard_name":"elk9-3","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"4","shard_name":"elk9-4","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"5","shard_name":"elk9-5","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"6","shard_name":"elk9-6","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"7","shard_name":"elk9-7","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"8","shard_name":"elk9-8","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"9","shard_name":"elk9-9","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"10","shard_name":"elk9-10","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"11","shard_name":"elk9-11","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"12","shard_name":"elk9-12","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"13","shard_name":"elk9-13","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"14","shard_name":"elk9-14","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"15","shard_name":"elk9-15","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"shardfile","excludes":""},
          {"shard":"16","shard_name":"elk9-remaining","search_engine":"elasticsearch","artifact_suffix":"-elk9","includes":"catchall","excludes":""},
          {"shard":"1","shard_name":"1-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"2","shard_name":"2-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"3","shard_name":"3-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"4","shard_name":"4-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"5","shard_name":"5-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"6","shard_name":"6-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"7","shard_name":"7-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"8","shard_name":"8-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"9","shard_name":"9-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"10","shard_name":"10-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"11","shard_name":"11-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"12","shard_name":"12-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"13","shard_name":"13-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"14","shard_name":"14-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"15","shard_name":"15-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"shardfile","excludes":""},
          {"shard":"16","shard_name":"remaining-os","search_engine":"opensearch","artifact_suffix":"-opensearch","includes":"catchall","excludes":""}
        ]
      # ── E2E: OpenSearch (Chrome/WebKit/Chromium) + ES Firefox/Edge + expanded infra ──
      # artifact_suffix must be unique per cell: the report artifact is named
      # playwright-report-<browser><suffix> and duplicates fail the upload.
      # The two without_license cells run without the EE licence: the specs that need it skip
      # themselves, so they cover every spec that must work in the Community Edition.
      e2e-matrix: >
        [
          {"browser":"chrome","project":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-std-amd64"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-std-amd64"},
          {"browser":"chromium","project":"chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-std-arm64"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-std-arm64"},
          {"browser":"chrome","project":"chrome","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-ubi9-amd64"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-ubi9-amd64"},
          {"browser":"chromium","project":"chromium","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-ubi9-arm64"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-ubi9-arm64"},
          {"browser":"firefox","project":"firefox","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-std-amd64"},
          {"browser":"firefox","project":"firefox","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-ubi9-amd64"},
          {"browser":"edge","project":"edge","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-std-amd64"},
          {"browser":"edge","project":"edge","docker_image":"openaev-ubi9-image-amd64","variant":"ubi9-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-ubi9-amd64"},
          {"browser":"firefox","project":"firefox","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-std-arm64"},
          {"browser":"firefox","project":"firefox","docker_image":"openaev-ubi9-image-arm64","variant":"ubi9-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-ubi9-arm64"},
          {"browser":"chrome","project":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"opensearch","artifact_suffix":"-std-amd64-opensearch"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"opensearch","artifact_suffix":"-std-amd64-opensearch"},
          {"browser":"chromium","project":"chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"opensearch","artifact_suffix":"-std-arm64-opensearch"},
          {"browser":"webkit","project":"webkit","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"opensearch","artifact_suffix":"-std-arm64-opensearch"},
          {"browser":"chrome","project":"infra-chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-std-amd64-infra"},
          {"browser":"firefox","project":"infra-firefox","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-std-amd64-infra"},
          {"browser":"webkit","project":"infra-webkit","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-std-amd64-infra"},
          {"browser":"edge","project":"infra-edge","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-std-amd64-infra"},
          {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-std-arm64-infra"},
          {"browser":"firefox","project":"infra-firefox","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-std-arm64-infra"},
          {"browser":"webkit","project":"infra-webkit","docker_image":"openaev-image-arm64","variant":"std-arm64","runner":"ubuntu-24.04-arm","search_engine":"elasticsearch","artifact_suffix":"-std-arm64-infra"},
          {"browser":"chrome","project":"chrome","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-std-amd64-no-ee","without_license":true},
          {"browser":"chromium","project":"infra-chromium","docker_image":"openaev-image-amd64","variant":"std-amd64","runner":"ubuntu-24.04","search_engine":"elasticsearch","artifact_suffix":"-std-amd64-infra-no-ee","without_license":true}
        ]
      # Keep Nightly runs out of shared caches used by PR workflows.
      no-cache: true
    secrets: inherit
