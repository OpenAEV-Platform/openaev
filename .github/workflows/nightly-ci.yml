name: "[Core] Nightly CI"

# Nightly: same pipeline, larger matrix.
# Adds OpenSearch coverage for Chrome/WebKit/Chromium, Firefox and Edge on
# Elasticsearch, and expanded infrastructure-test coverage.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  pipeline:
    uses: ./.github/workflows/_ci-pipeline.yml
    with:
      # ── Multi-tenancy v2 shadow runs (epic #6393), Elasticsearch only ──
      # Same suite, different activation. "shadow-prod" runs under the active-tables list
      # main ships, so a regression on a table that is already live surfaces the night it
      # lands, whoever wrote it. "shadow-all" runs with every strict tenant table active,
      # which is the exhaustive list of what activating the rest would break, obtained
      # without changing anything on main. Both turn the fail-closed detector on.
      # Reports, not gates: continue_on_error keeps a red one from failing the workflow, so a
      # shard reports its true result and the "Tenant shadow verdict" job collects them into one
      # table on the run page. Their measured distance to green, and what they currently fail on,
      # is in .github/tenant-shadow-distance.md.
      # Retire both when the migration is done; shadow-prod may then become a core gate.
      # ── API Tests: 14 shards + catch-all across Elasticsearch and OpenSearch ──
      # The engine client is detected from the server: search_engine picks the server started
      # (elasticsearch8, elasticsearch for the compose default major, or opensearch).
      api-matrix: >
        [
          {"shard":"1","shard_name":"1","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
          {"shard":"2","shard_name":"2","search_engine":"elasticsearch8","artifact_suffix":"","includes":"shardfile","excludes":""},
