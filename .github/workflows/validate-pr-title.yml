name: "Simple Check Run Error"

on:
  pull_request:

jobs:
  simple-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write   # needed for Checks API

    steps:
      - name: Create failing check run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # 1) Create a check run in "in_progress" state
          CHECK_RUN=$(
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$REPO/check-runs \
              -d @- <<EOF
          {
            "name": "Simple Check",
            "head_sha": "$SHA",
            "status": "in_progress"
          }
          EOF
          )

          CHECK_RUN_ID=$(echo "$CHECK_RUN" | jq -r '.id')
          echo "Created check run ID: $CHECK_RUN_ID"

          SUMMARY="❌ Something went wrong. This is a test error."

          # 2) Mark the check run as completed with failure + summary
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/check-runs/$CHECK_RUN_ID \
            -d @- <<EOF
          {
            "name": "Simple Check",
            "status": "completed",
            "conclusion": "failure",
            "output": {
              "summary": "$SUMMARY"
            }
          }
          EOF

          # 3) Fail the job so branch protection sees it
          exit 1