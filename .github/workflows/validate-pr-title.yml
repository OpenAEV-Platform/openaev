name: "Validate PR Title (Checks API)"

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write         # IMPORTANT for Checks API
      pull-requests: write

    steps:
      - name: Validate PR title and create custom check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE="${{ github.event.pull_request.title }}"

          echo "PR title: $TITLE"

          # 1) Create a pending check run
          CHECK_RUN=$(curl -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/check-runs \
            -d @- <<EOF
          {
            "name": "Validate PR Title",
            "head_sha": "$SHA",
            "status": "in_progress"
          }
          EOF
          )

          CHECK_RUN_ID=$(echo "$CHECK_RUN" | jq -r '.id')

          # Regex for:
          # [category/subcategory] type(scope?): description (#123)
          PATTERN='^\[([a-z]+(/[a-z]+)*)\] (feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z-]+\))?: [a-z].*( \(#[0-9]+\))$'

          # Skip validation for renovate
          if [[ "$TITLE" == "chore(deps)"* ]]; then
            SUMMARY="⚠️ Skipping validation for Renovate PRs."
            CONCLUSION="success"
          elif [[ "$TITLE" =~ $PATTERN ]]; then
            SUMMARY="✅ PR title is valid."
            CONCLUSION="success"
          else
            SUMMARY="❌ Invalid PR title. Must match: [category] type(scope?): description (#123)"
            CONCLUSION="failure"
          fi

          echo "Check run ID: $CHECK_RUN_ID"
          echo "Conclusion: $CONCLUSION"
          echo "Summary: $SUMMARY"

          # 2) Complete the check run with conclusion + summary (this is what appears like CodeQL)
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/check-runs/$CHECK_RUN_ID \
            -d @- <<EOF
          {
            "name": "Validate PR Title",
            "status": "completed",
            "conclusion": "$CONCLUSION",
            "output": {
              "summary": "$SUMMARY"
            }
          }
          EOF

          # 3