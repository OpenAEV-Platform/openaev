name: "Validate PR Title"

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Validate PR title and create check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          TITLE="${{ github.event.pull_request.title }}"
          echo "PR title: $TITLE"

          # Skip validation for renovate
          if [[ "$TITLE" == "chore(deps)"* ]]; then
            echo "⚠️ Skipping validation for renovate PRs."
            SUMMARY="⚠️ Skipping validation for Renovate PRs."
            CONCLUSION="success"
          else
            # Full pattern:
            # [category/subcategory] type(scope?): description (#123)
            FULL_PATTERN='^\[([a-z]+(/[a-z]+)*)\] (feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z-]+\))?: [a-z].*( \(#[0-9]+\))$'

            if [[ "$TITLE" =~ $FULL_PATTERN ]]; then
              echo "✅ PR title is valid."
              SUMMARY="✅ PR title is valid."
              CONCLUSION="success"
            else
              # Diagnose common failures

              # 1) Check category block: [category/subcategory]
              CATEGORY_PATTERN='^\[([a-z]+(/[a-z]+)*)\]'
              if ! [[ "$TITLE" =~ $CATEGORY_PATTERN ]]; then
                REASON="missing or invalid [category] block (expected: [category] or [category/subcategory])"
              fi

              # 2) Check type + optional scope
              TYPE_PATTERN='^\[([a-z]+(/[a-z]+)*)\] (feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z-]+\))?: '
              if [[ -z "${REASON:-}" ]] && ! [[ "$TITLE" =~ $TYPE_PATTERN ]]; then
                REASON="missing or invalid type. Expected one of: feat, fix, chore, docs, style, refactor, perf, test, build, ci, revert (with optional scope: type(scope))"
              fi

              # 3) Check description starts with lowercase letter
              DESC_PATTERN='^\[([a-z]+(/[a-z]+)*)\] (feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z-]+\))?: [a-z]'
              if [[ -z "${REASON:-}" ]] && ! [[ "$TITLE" =~ $DESC_PATTERN ]]; then
                REASON="description must start with a lowercase letter after ': '"
              fi

              # 4) Check issue reference at the end: (#123)
              ISSUE_PATTERN='\(#[0-9]+\)$'
              if [[ -z "${REASON:-}" ]] && ! [[ "$TITLE" =~ $ISSUE_PATTERN ]]; then
                REASON="missing issue reference at the end. Expected: (#123)"
              fi

              if [[ -z "${REASON:-}" ]]; then
                REASON="title does not match the required pattern"
              fi

              echo "❌ Invalid PR title: $REASON"
              echo "Required format:"
              echo "[category] type(scope?): description (#123)"

              SUMMARY="❌ Invalid PR title: $REASON. Required: [category] type(scope?): description (#123)"
              CONCLUSION="failure"
            fi
          fi

          # Create custom check run
          CHECK_RUN=$(
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$REPO/check-runs \
              -d @- <<EOF
          {
            "name": "PR Title",
            "head_sha": "$SHA",
            "status": "in_progress"
          }
          EOF
          )

          CHECK_RUN_ID=$(echo "$CHECK_RUN" | jq -r '.id')
          echo "Created check run ID: $CHECK_RUN_ID"

          # Complete the check run with conclusion + detailed summary
          curl -sS -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/check-runs/$CHECK_RUN_ID \
            -d @- <<EOF
          {
            "name": "PR Title",
            "status": "completed",
            "conclusion": "$CONCLUSION",
            "output": {
              "title": "$SUMMARY",
            }
          }
          EOF

          # Do not fail job (continue-on-error is true)
          exit 0