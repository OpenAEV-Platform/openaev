name: "PR Title Check"

on:
  pull_request:

jobs:
  pr-title-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write   # required to create custom checks

    steps:
      - name: Create failing PR title check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # 1) Create the check run
          CHECK_RUN=$(
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$REPO/check-runs \
              -d @- <<EOF
          {
            "name": "PR Title (dynamic)",
            "head_sha": "$SHA",
            "status": "in_progress"
          }
          EOF
          )

          CHECK_RUN_ID=$(echo "$CHECK_RUN" | jq -r '.id')
          echo "Created check run ID: $CHECK_RUN_ID"

          # 2) Complete the check as failing with a short message
          MESSAGE="fail because title is too long"

          curl -sS -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/check-runs/$CHECK_RUN_ID \
            -d @- <<EOF
          {
            "name": "PR Title (dynamic)",
            "status": "completed",
            "conclusion": "failure",
            "output": {
              "title": "PR Title",
              "summary": "$MESSAGE"
            }
          }
          EOF

          # 3) Fail the workflow job as well
          exit 1