name: "Validate PR Title"

on:
  pull_request:
    types: [ opened, edited, reopened, ready_for_review, synchronize ]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Force error annotation
        run: |
          echo "::error title=Invalid PR title::Title must match: [category] type(scope?): description (#123)"
          exit 1