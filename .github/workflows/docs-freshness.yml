name: Docs freshness

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: docs-freshness
  cancel-in-progress: true

jobs:
  report:
    name: Docs freshness report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build the report
        run: |
          python docs/scripts/docs-freshness.py --output docs-freshness.md
          cat docs-freshness.md >> "$GITHUB_STEP_SUMMARY"

