name: "[Core] Auto-Retry Failed CI"

# Triggers when core-ci or nightly-ci completes with failure.
# Retries failed jobs up to twice, so back-to-back infra flakes are still covered.
#
# Cancelled runs are never retried, whatever the cause: a manual cancel, a newer push
# superseding the run and a job hitting its timeout-minutes all end as "cancelled", and
# telling them apart would mean parsing GitHub's annotation messages.
# A run is not retried either once a newer run of the same workflow exists for its branch:
# the CI concurrency group cancels in progress, so the re-run would cancel the newer run.

on:
  workflow_run:
    # Workflow names are glob patterns, so literal brackets must be escaped.
    # https://github.com/github/docs/issues/12572#issuecomment-1014035978
    workflows: ['\[Core\] CI', '\[Core\] Nightly CI']
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    name: "🔄 Retry Failed Jobs"
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.run_attempt <= 2
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WORKFLOW_ID: ${{ github.event.workflow_run.workflow_id }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          latest_run_id=$(gh api --method GET "repos/${REPO}/actions/workflows/${WORKFLOW_ID}/runs" \
            -f branch="${HEAD_BRANCH}" -f event="${EVENT}" -F per_page=1 \
            --jq '.workflow_runs[0].id')
          if [ "${latest_run_id}" != "${RUN_ID}" ]; then
            echo "⏭️ ${RUN_NAME} run #${RUN_ID} was superseded by run #${latest_run_id} — not retrying."
            exit 0
          fi
          echo "🔄 ${RUN_NAME} run #${RUN_ID} failed on attempt ${ATTEMPT} — retrying failed jobs..."
          gh api "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs" --method POST
          echo "✅ Re-run triggered (attempt $((ATTEMPT + 1)))"
