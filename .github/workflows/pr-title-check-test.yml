name: "PR Title Check Test"

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, synchronize]

jobs:
  pr-title-check-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Create failing PR title check (test)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Workflow: PR Title Check Test"
          echo "Repo: $REPO"
          echo "SHA: $SHA"

          CHECK_RUN=$(
            curl -sS -X POST \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/$REPO/check-runs \
              -d @- <<EOF
          {
            "name": "PR Title (test)",
            "head_sha": "$SHA",
            "status": "in_progress"
          }
          EOF
          )

          echo "Raw check-run response:"
          echo "$CHECK_RUN"

          CHECK_RUN_ID=$(echo "$CHECK_RUN" | jq -r '.id')
          echo "Created check run ID: $CHECK_RUN_ID"

          MESSAGE="fail because title is too long (test)"

          curl -sS -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/$REPO/check-runs/$CHECK_RUN_ID \
            -d @- <<EOF
          {
            "name": "PR Title (test)",
            "status": "completed",
            "conclusion": "failure",
            "output": {
              "title": "PR Title Validation (test)",
              "summary": "$MESSAGE"
            }
          }
          EOF

          exit 1