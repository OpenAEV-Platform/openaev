name: "🔍 Aikido Rolling Image Scan"

# Daily Aikido scan of the rolling platform images published on Docker Hub,
# with Aikido's release gate: the open high and critical issues of each image,
# left out when ignored in Aikido, are reported in the job summary, as a
# warning and as job artifacts. Issues do not fail the run, a scanner error
# does.

on:
  push:
    branches: [ci/aikido-rolling-image-scan]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      release:
        description: "Release to scan (for example 3.261009.0); empty scans the rolling images"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: aikido-rolling-image-scan
  cancel-in-progress: false

jobs:
  scan:
    name: "🔍 Scan openaev/platform:${{ matrix.tag }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(inputs.release && format('["{0}", "{0}-ubi9"]', inputs.release) || '["rolling", "rolling-ubi9"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions/aikido-image-scan

      - name: Pull openaev/platform:${{ matrix.tag }}
        env:
          IMAGE: openaev/platform:${{ matrix.tag }}
        run: docker pull "$IMAGE"

      - id: scan
        uses: ./.github/actions/aikido-image-scan
        with:
          image: openaev/platform:${{ matrix.tag }}
          report-name: aikido-platform-${{ matrix.tag }}
          api-key: ${{ secrets.AIKIDO_TOKEN }}
          mode: release
          aikido-image-name: openaev-platform-${{ matrix.tag }}

      - name: Warn about open issues
        if: ${{ steps.scan.outputs.issues != '0' }}
        env:
          IMAGE: openaev/platform:${{ matrix.tag }}
          ISSUES: ${{ steps.scan.outputs.issues }}
        run: |
          echo "::warning::$IMAGE has $ISSUES open high or critical issue(s) in Aikido: see the job summary"
