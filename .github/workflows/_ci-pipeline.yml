name: "CI Pipeline"

# ════════════════════════════════════════════════════════════════════
# Single reusable workflow for the entire CI/CD pipeline.
# Called by core-ci.yml (defaults) and nightly-ci.yml (all flags on).
# Nightly-only jobs are gated behind boolean inputs.
# ════════════════════════════════════════════════════════════════════

on:
  workflow_call:
    inputs:
      api-matrix:
        description: "JSON array of API test matrix entries"
        type: string
        required: true
      e2e-matrix:
        description: "JSON array of E2E test matrix entries (includes both regular and infra)"
        type: string
        required: true
      no-cache:
        description: >
          Bypass every Maven, Yarn, Playwright and buildx cache, for both reads and
          writes. Set by Nightly, which may run slow and whose entries would only evict the
          ones Core CI PRs read.
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read
  # Docker images are handed between jobs through GHCR; artifacts are still uploaded.
  packages: write

jobs:
  # ════════════════════════════════════════════════════════════════════
  # Build
  # ════════════════════════════════════════════════════════════════════

  migrations-guard:
    name: "🔎 Migrations Guard"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-tags: "true"
          fetch-depth: 0
      - uses: ./.github/actions/find-latest-tag
        id: latest-tag
      - uses: ./.github/actions/migrations-guard
        with:
          last-release-number: ${{ steps.latest-tag.outputs.latest-tag }}

  # Blocking on purpose: a pull request must not merge an ADR number main already has.
  adr-numbering:
    name: "🔢 ADR Numbering"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request or a merge queue group: the merge commit and its first parent, the
          # target branch.
          fetch-depth: 2
      - uses: ./.github/actions/adr-numbering
        with:
          pull-request: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

  ocsf-parser-generation-stability:
    strategy:
      matrix:
        version: [ "1.9.0" ]
    name: "🔎 OCSF Parser Generation Stability"
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: "Install OpenAEV maven plugin"
        run: |
          mvn -B clean install -pl openaev-maven-plugin
      - uses: ./.github/actions/generate-ocsf-parser
        with:
          version: ${{ matrix.version }}
        id: generate-ocsf-parser
      - uses: ./.github/actions/ensure-no-git-diff
        id: ensure-no-git-diff

  backend-compile:
    name: "🔨 Backend Compile"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-compile
        with:
          no-cache: ${{ inputs.no-cache }}

  frontend-build:
    name: "🎨 Frontend Build"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend-build
        with:
          no-cache: ${{ inputs.no-cache }}

  prepare-bundled-assets:
    name: "📦 Prepare Bundled Assets"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/prepare-bundled-assets

  # ════════════════════════════════════════════════════════════════════
  # Static quality checks
  # ════════════════════════════════════════════════════════════════════

  spotless-check:
    name: "🔍 Spotless Check"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/spotless-check
        with:
          no-cache: ${{ inputs.no-cache }}

  # Reported through the Pipeline Gate as advisory, never blocking, until it has run clean for a while
  # on real PRs. Making it blocking means taking the job out of the advisory list in the gate below.
  bom-override-guard:
    name: "🔎 BOM Override Guard"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bom-override-guard
        with:
          no-cache: ${{ inputs.no-cache }}

  frontend-quality:
    name: "🧪 Frontend Quality & Unit Tests"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/frontend-quality
        with:
          no-cache: ${{ inputs.no-cache }}

  fds-conformity:
    name: "🎨 FDS Conformity"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fds-conformity

  # Pull requests only: the gate reads what a PR adds against its target branch, and a push or a
  # scheduled run has no target branch. Skipped counts as passed in the Pipeline Gate.
  fds-mui-regression:
    name: "🎨 FDS MUI Regression"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # The gate diffs against the merge base with the target branch.
          fetch-depth: 0
      - uses: ./.github/actions/fds-mui-regression
        with:
          base: origin/${{ github.base_ref }}

  # ════════════════════════════════════════════════════════════════════
  # API Tests — matrix passed from caller
  # ════════════════════════════════════════════════════════════════════

  api-tests:
    name: "🧪 API Tests (${{ matrix.shard_name }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.api-matrix) }}
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openaev
      SPRING_DATASOURCE_USERNAME: openaev
      SPRING_DATASOURCE_PASSWORD: openaev
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 11000
      # No engine selector: the platform detects Elasticsearch 8, 9 or OpenSearch from ENGINE_URL,
      # so a shard picks its client through the server it starts (matrix.search_engine).
      ENGINE_URL: http://localhost:9200
      OPENBAS_RABBITMQ_HOSTNAME: localhost
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/api-tests
        with:
          includes: ${{ matrix.includes }}
          excludes: ${{ matrix.excludes }}
          shard: ${{ matrix.shard }}
          shard-name: ${{ matrix.shard_name }}
          search-engine: ${{ matrix.search_engine }}
          artifact-suffix: ${{ matrix.artifact_suffix }}
          no-cache: ${{ inputs.no-cache }}

  # ════════════════════════════════════════════════════════════════════
  # E2E Tests — matrix passed from caller
  # ════════════════════════════════════════════════════════════════════

  e2e-tests:
    name: "🧪 E2E (${{ matrix.shard_name || 'full' }} · ${{ matrix.project }} · ${{ matrix.variant }}${{ matrix.search_engine == 'opensearch' && ' · OS' || '' }}${{ matrix.without_license && ' · no EE' || '' }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.e2e-matrix) }}
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openaev
      SPRING_DATASOURCE_USERNAME: openaev
      SPRING_DATASOURCE_PASSWORD: openaev
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 11000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_ACCESS_SECRET: minioadmin
      ENGINE_URL: http://localhost:9200
      OPENBAS_RABBITMQ_HOSTNAME: localhost
      OPENAEV_ADMIN_EMAIL: admin@openaev.io
      OPENAEV_ADMIN_PASSWORD: admin
      OPENAEV_ADMIN_TOKEN: 0d17ce9a-f3a8-4c6d-9721-c98dc3dc023f
      OPENAEV_ADMIN_ENCRYPTION_KEY: ThisIsMyUltraSecureEncryptionKey
      OPENAEV_ADMIN_ENCRYPTION_SALT: ilikesaltyfoodnomnom
      OPENAEV_RATELIMIT_ENABLED: false
      SPRING_PROFILES_ACTIVE: ci
      # A cell with without_license runs the Community Edition: the EE specs skip themselves.
      OPENAEV_APPLICATION_LICENSE: ${{ !matrix.without_license && secrets.OPENAEV_APPLICATION_LICENSE || '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e-tests
        with:
          browser: ${{ matrix.browser }}
          project: ${{ matrix.project }}
          docker-image: ${{ matrix.docker_image }}
          search-engine: ${{ matrix.search_engine }}
          includes: ${{ matrix.includes }}
          excludes: ${{ matrix.excludes }}
          artifact-suffix: ${{ matrix.artifact_suffix }}
          no-cache: ${{ inputs.no-cache }}

  # ════════════════════════════════════════════════════════════════════
  # API Types Check
  # ════════════════════════════════════════════════════════════════════

  api-types-check:
    name: "🔎 API Types Check"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/openaev
      SPRING_DATASOURCE_USERNAME: openaev
      SPRING_DATASOURCE_PASSWORD: openaev
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 11000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_ACCESS_SECRET: minioadmin
      ENGINE_URL: http://localhost:9200
      OPENBAS_RABBITMQ_HOSTNAME: localhost
      OPENAEV_ADMIN_EMAIL: admin@openaev.io
      OPENAEV_ADMIN_PASSWORD: admin
      OPENAEV_ADMIN_TOKEN: 0d17ce9a-f3a8-4c6d-9721-c98dc3dc023f
      OPENAEV_ADMIN_ENCRYPTION_KEY: ThisIsMyUltraSecureEncryptionKey
      OPENAEV_ADMIN_ENCRYPTION_SALT: ilikesaltyfoodnomnom
      SPRING_PROFILES_ACTIVE: ci
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/api-types-check
        with:
          no-cache: ${{ inputs.no-cache }}

  # ════════════════════════════════════════════════════════════════════
  # Coverage — one Codecov upload per flag, each starting as soon as its own tests finish
  # ════════════════════════════════════════════════════════════════════
  # One upload per flag with explicit files: a single upload tags every file with every flag,
  # and .codecov.yml counts uploads (after_n_builds) before it comments on the PR.
  # Codecov only reports, in its PR comment. The backend coverage rules run in
  # coverage-backend-gate, next to the backend upload and without waiting for it.

  # Only after green API tests: a failed shard leaves a partial report, which reads as a drop.
  coverage-backend:
    name: "📊 Coverage Upload (backend)"
    needs: [api-tests]
    if: ${{ !cancelled() && needs.api-tests.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/backend-coverage-report
        with:
          no-cache: ${{ inputs.no-cache }}

      # coverage-backend-gate reads this artifact on the base branch, as the base commit's
      # coverage.
      - name: Upload API coverage
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-api
          path: openaev-api/target/site/jacoco/jacoco.xml
          if-no-files-found: error

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: openaev-api/target/site/jacoco/jacoco.xml
          flags: backend
          disable_search: true
          fail_ci_if_error: false
        continue-on-error: true

  # The backend coverage rules, on pull requests: at least 80% of the backend lines the pull request
  # changes are covered, and backend line coverage does not drop by more than 0.1 point against
  # the last commit of main. It builds its own report, next to coverage-backend rather than after it.
  # A broken rule fails the job and blocks the merge through the Pipeline Gate, unless the pull
  # request description waives it with a "Coverage exempt: <why>" line.
  coverage-backend-gate:
    name: "🔎 Backend Coverage Check"
    needs: [api-tests]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.api-tests.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Depth 2: the checkout is the merge of the pull request into its base, and both rules
      # compare it with its first parent.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: ./.github/actions/backend-coverage-report
        with:
          no-cache: ${{ inputs.no-cache }}

      - uses: ./.github/actions/backend-coverage-check
        with:
          min-coverage: "80"
          max-drop: "0.1"
          client-id: ${{ vars.OPENAEV_PR_CHECKS_CLIENT_ID }}
          private-key: ${{ secrets.OPENAEV_PR_CHECKS_PRIVATE_KEY }}

  coverage-frontend:
    name: "📊 Coverage Upload (frontend)"
    needs: [frontend-quality]
    if: ${{ !cancelled() && needs.frontend-quality.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Download vitest coverage
        uses: actions/download-artifact@v8
        with:
          name: vitest-coverage
          path: coverage/frontend
        continue-on-error: true

      - name: Upload frontend coverage to Codecov
        if: ${{ hashFiles('coverage/frontend/lcov.info') != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/frontend/lcov.info
          flags: frontend
          disable_search: true
          fail_ci_if_error: false
        continue-on-error: true

  coverage-e2e:
    name: "📊 Coverage Upload (e2e)"
    needs: [e2e-tests]
    if: ${{ !cancelled() && needs.e2e-tests.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # One directory per shard: every shard writes lcov.info, so merging would keep only the last one.
      - name: Download playwright coverage
        uses: actions/download-artifact@v8
        with:
          pattern: playwright-coverage-*
          path: coverage/e2e
        continue-on-error: true

      - name: List E2E coverage files
        id: e2e-coverage
        run: echo "files=$(find coverage/e2e -name lcov.info 2>/dev/null | paste -sd, -)" >> "$GITHUB_OUTPUT"

      - name: Upload E2E coverage to Codecov
        if: ${{ steps.e2e-coverage.outputs.files != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.e2e-coverage.outputs.files }}
          flags: e2e
          disable_search: true
          fail_ci_if_error: false
        continue-on-error: true

  # ════════════════════════════════════════════════════════════════════
  # Packaging
  # ════════════════════════════════════════════════════════════════════

  backend-package:
    name: "📦 Backend Package (glibc)"
    needs: [frontend-build, backend-compile, prepare-bundled-assets]
    timeout-minutes: 15
    if: >-
      ${{
        !cancelled() &&
        needs.frontend-build.result == 'success' &&
        needs.backend-compile.result == 'success' &&
        (needs.prepare-bundled-assets.result == 'success' || needs.prepare-bundled-assets.result == 'skipped')
      }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-package
        with:
          download-release-assets: ${{ needs.prepare-bundled-assets.result == 'success' }}
          no-cache: ${{ inputs.no-cache }}

  backend-package-musl:
    name: "📦 Backend Package (musl)"
    needs: [frontend-build, backend-compile, prepare-bundled-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: maven:3.10.0-eclipse-temurin-21-alpine
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/backend-package-musl

  # ════════════════════════════════════════════════════════════════════
  # Docker
  # ════════════════════════════════════════════════════════════════════

  # Docker builds fetch bundled assets inline, avoiding a serial dependency.
  docker-build:
    name: "🐳 Docker Build (${{ matrix.variant }} ${{ matrix.arch }})"
    if: ${{ !cancelled() }}
    timeout-minutes: 25
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            dockerfile: ./Dockerfile
            artifact-name: openaev-image
            jar-path: /openaev-api.jar
            cache-scope: docker-standard
            tags: openaev:ci-${{ github.run_id }}
          - variant: standard
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: ./Dockerfile
            artifact-name: openaev-image
            jar-path: /openaev-api.jar
            cache-scope: ""
            tags: openaev:ci-${{ github.run_id }}
          - variant: ubi9
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            dockerfile: ./Dockerfile_ubi9
            artifact-name: openaev-ubi9-image
            jar-path: /opt/openaev/openaev-api.jar
            cache-scope: ""
            tags: openaev-ubi9:ci-${{ github.run_id }}
          - variant: ubi9
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: ./Dockerfile_ubi9
            artifact-name: openaev-ubi9-image
            jar-path: /opt/openaev/openaev-api.jar
            cache-scope: ""
            tags: openaev-ubi9:ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-build
        with:
          dockerfile: ${{ matrix.dockerfile }}
          artifact-name: ${{ matrix.artifact-name }}
          platform: ${{ matrix.platform }}
          jar-path: ${{ matrix.jar-path }}
          cache-scope: ${{ matrix.cache-scope }}
          tags: ${{ matrix.tags }}
          no-cache: ${{ inputs.no-cache }}

  # Consumers wait for registry markers or artifacts, not the complete build job.
  docker-merge:
    name: "🐳 Merge Platforms (${{ matrix.variant }})"
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            artifact-name: openaev-image
          - variant: ubi9
            artifact-name: openaev-ubi9-image
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-merge-platforms
        with:
          artifact-name: ${{ matrix.artifact-name }}
          build-job-names: |
            Docker Build (${{ matrix.variant }} amd64)
            Docker Build (${{ matrix.variant }} arm64)

  # Aikido scan of both amd64 images, on main and on every pull request, with Aikido's PR gate on
  # pull requests and its release gate on pushes. Issues are listed in the job summary and leave the
  # job green. A scan or a report that cannot be produced fails the job, and the gate with it, so a
  # run either has its report or fails. Details in the aikido-image-scan action. Skipped in the
  # merge queue: each queue ref is unique, so a scan there would create two new Aikido containers
  # per queued PR, and the PR and main scans already cover the same images.
  aikido-image-scan:
    name: "🔍 Aikido Image Scan"
    if: ${{ !cancelled() && github.event_name != 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/aikido-image-scan
        with:
          api-key: ${{ secrets.AIKIDO_TOKEN }}

  # ════════════════════════════════════════════════════════════════════
  # Pipeline gate
  #
  # Required branch-protection check: "<caller-job> / ✅ Pipeline Gate".
  # Coverage upload is best-effort and stays out of it; the backend coverage rules
  # (coverage-backend-gate) are in it, and block.
  # ════════════════════════════════════════════════════════════════════

  pipeline-gate:
    name: "✅ Pipeline Gate"
    needs:
      - adr-numbering
      - ocsf-parser-generation-stability
      - migrations-guard
      - backend-compile
      - frontend-build
      - prepare-bundled-assets
      - spotless-check
      - bom-override-guard
      - frontend-quality
      - fds-conformity
      - fds-mui-regression
      - api-tests
      - coverage-backend-gate
      - e2e-tests
      - api-types-check
      - backend-package
      - backend-package-musl
      - docker-build
      - docker-merge
      - aikido-image-scan
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check all upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          FAILED=0
          ADVISORY=0
          TOTAL=0

          echo "══════════════════════════════════════════════════"
          echo "  ✅ Upstream Job Results"
          echo "══════════════════════════════════════════════════"
          echo ""

          for job in $(echo "$NEEDS_JSON" | jq -r 'keys[]'); do
            result=$(echo "$NEEDS_JSON" | jq -r --arg j "$job" '.[$j].result')
            TOTAL=$((TOTAL + 1))

            # Advisory jobs are listed here because `continue-on-error` does not define
            # the value of `needs.<job>.result`.
            advisory=0
            case "$job" in
              # A new check lands here first so a false positive cannot block a merge. Take the job
              # out of this list to make it blocking.
              bom-override-guard)
                advisory=1
                ;;
            esac

            case "$result" in
              success)   icon="✅" ;;
              skipped)   icon="⏭️" ;;
              failure|cancelled)
                if [ "$advisory" -eq 1 ]; then
                  icon="⚠️"; ADVISORY=$((ADVISORY + 1))
                else
                  icon="❌"; FAILED=$((FAILED + 1))
                fi
                ;;
              *)         icon="❓" ;;
            esac

            printf "  %s  %-30s %s\n" "$icon" "$job" "$result"
          done

          echo ""
          echo "══════════════════════════════════════════════════"

          if [ "$ADVISORY" -gt 0 ]; then
            echo "⚠️ $ADVISORY advisory job(s) reported problems — not blocking"
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "❌ $FAILED/$TOTAL upstream job(s) failed"
            exit 1
          fi

          echo "✅ All $TOTAL upstream jobs passed"

      - uses: actions/checkout@v7
      - uses: ./.github/actions/sanity-check
        with:
          github-token: ${{ github.token }}
