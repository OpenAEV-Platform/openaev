name: Docs build check

on:
  push:
    paths:
      - 'docs/**'
      - '.github/workflows/ci-test-docs.yml'
      - '.github/scripts/check-docs-site.py'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/ci-test-docs.yml'
      - '.github/scripts/check-docs-site.py'

# The GITHUB_TOKEN is only used by the git-committers plugin to read commit history.
permissions:
  contents: read

jobs:
  docs-build:
    name: Build MkDocs documentation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install documentation dependencies
        working-directory: docs
        run: pip install --no-deps -r requirements.txt && pip check

      - name: Check for underscores in MkDocs URIs
        working-directory: docs
        run: |
          echo "Checking mkdocs.yml for URIs (use '-' instead of '_')"
          INVALID_PATHS=$(grep '.md' mkdocs.yml | grep '_' | grep -Ev 'pymdownx\.superfences|md_in_html' || true)
          if [ -n "$INVALID_PATHS" ]; then
            echo "Invalid MkDocs URIs detected (use '-' instead of '_'):"
            echo "$INVALID_PATHS" | sed 's/^/ - /'
            exit 1
          fi
          echo "All MkDocs URIs are clean (no underscores)."

      - name: Build documentation
        working-directory: docs
        env:
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.GITHUB_TOKEN }}
        run: mkdocs build --strict

      # A strict build is green when a plugin breaks silently (selectolax 1.0.1 dropped every
      # image, #8602), so check the built site itself. This is the full build, git plugins
      # included, so a dependency update that breaks one of them shows up here. It only runs when
      # docs change, which keeps it out of the Pipeline Gate.
      - name: Check the built site
        run: python3 .github/scripts/check-docs-site.py docs/site
