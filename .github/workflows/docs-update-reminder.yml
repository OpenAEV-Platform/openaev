name: "[OpenAEV] Docs Update Reminder"

# Points out the changes of a pull request that usually need a docs update: a new endpoint, page,
# integration, setting or preview feature. It is not a required check, so it never blocks a merge.

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-reminder:
    name: "📝 Docs update reminder"
    runs-on: ubuntu-24.04
    steps:
      - name: Look for changes that need a docs update
        uses: actions/github-script@v9
        with:
          script: |
            // Kept from the former name, so the comment already on a pull request is updated in place.
            const MARKER = '<!-- openaev-docs-gap-check -->';
            const TITLE = '📝 **Docs update reminder**';
            const SKIP_LABELS = ['No need documentation', 'docs-not-needed'];
            const SKIP_LABEL = SKIP_LABELS[0];

            // -- helpers --------------------------------------------------

            // Fork PRs get a read-only token, so the report goes to the job
            // summary instead of a PR comment. A deleted fork has no head repo.
            const headRepo = context.payload.pull_request.head.repo;
            const isFork = headRepo?.full_name !== `${context.repo.owner}/${context.repo.repo}`;

            async function publishReport(body) {
              if (isFork) {
                await core.summary.addRaw(body.replace(MARKER, '').trim()).write();
                return;
              }
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(MARKER));
              const params = { owner: context.repo.owner, repo: context.repo.repo };
              if (existing) {
                await github.rest.issues.updateComment({ ...params, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ ...params, issue_number: context.issue.number, body });
              }
            }

            // -- 1. skip label --------------------------------------------

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const normalize = name => name.trim().toLowerCase();
            const skipSet = new Set(SKIP_LABELS.map(normalize));
            const matchedLabel = pr.labels
              .map(l => l.name)
              .find(name => skipSet.has(normalize(name)));

            if (matchedLabel) {
              await publishReport([
                MARKER,
                `${TITLE} — ⏭️ Skipped`,
                '',
                `The \`${matchedLabel}\` label says this pull request needs no docs update.`,
              ].join('\n'));
              return;
            }

            // -- 2. list changed files ------------------------------------

            const allFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            // -- 3. classify files ----------------------------------------

            const EXCLUDE = [
              /Test\.java$/, /\.test\.(ts|tsx)$/, /tests_e2e\//,
              /\.github\//, /Dockerfile/, /docker-compose/,
              /pom\.xml$/, /package\.json$/, /yarn\.lock$/,
              /\.eslintrc/, /\.prettierrc/, /spotless/, /\.editorconfig/,
              /AGENTS\.md$/, /CLAUDE\.md$/, /CONTRIBUTING\.md$/,
              /CODE_OF_CONDUCT\.md$/, /SECURITY\.md$/, /README\.md$/,
              /openaev-build-services\//, /openaev-maven-plugin\//,
              /openaev-dev\//, /\.run\.xml$/,
            ];

            const FUNCTIONAL = [
              /^openaev-api\/src\/main\//,
              /^openaev-model\/src\/main\//,
              /^openaev-front\/src\//,
              /^openaev-framework\/src\/main\//,
            ];

            const docFiles  = allFiles.filter(f => f.filename.startsWith('docs/'));
            const funcFiles = allFiles.filter(f => {
              if (EXCLUDE.some(p => p.test(f.filename))) return false;
              return FUNCTIONAL.some(p => p.test(f.filename));
            });

            // -- 4. no functional changes → pass --------------------------

            if (funcFiles.length === 0) {
              await publishReport([
                MARKER,
                `${TITLE} — ✅ Nothing to document`,
                '',
                'This pull request changes no application source.',
              ].join('\n'));
              return;
            }

            // -- 5. detect gaps -------------------------------------------

            const gaps = [];

            for (const file of funcFiles) {
              const fn    = file.filename;
              const isNew = file.status === 'added';
              const isMod = file.status === 'modified';
              const patch = file.patch || '';

              // CRITICAL: new REST controller
              if (isNew && /Api\.java$/.test(fn) && /\/api\/|\/rest\//.test(fn)) {
                gaps.push({
                  severity: 'CRITICAL', emoji: '🔴',
                  title: 'New REST API controller',
                  file: fn,
                  doc: '`docs/docs/reference/apis/rest-api.md`',
                  reason: 'New API endpoints should be documented.',
                });
              }

              // CRITICAL: new integration factory
              if (isNew && /IntegrationFactory\.java$/.test(fn)) {
                gaps.push({
                  severity: 'CRITICAL', emoji: '🔴',
                  title: 'New integration type',
                  file: fn,
                  doc: '`docs/docs/integrations/`',
                  reason: 'New integrations should be documented for deployment and usage.',
                });
              }

              // CRITICAL: new frontend page / route
              if (isNew && /\.tsx$/.test(fn) && (/Layout\.tsx$|Index\.tsx$|\/pages\//.test(fn))) {
                if (/Route|path:|Navigate|useParams/.test(patch)) {
                  gaps.push({
                    severity: 'CRITICAL', emoji: '🔴',
                    title: 'New UI page or route',
                    file: fn,
                    doc: '`docs/docs/usage/build/` or `docs/docs/usage/run-and-evaluate/` (matching section)',
                    reason: 'New user-facing pages should be documented.',
                  });
                }
              }

              // HIGH: new endpoints in existing controller
              if (isMod && /Api\.java$/.test(fn) && /\/api\/|\/rest\//.test(fn)) {
                const newMappings = (patch.match(/^\+.*@(Get|Post|Put|Delete|Patch)Mapping/gm) || []);
                if (newMappings.length > 0) {
                  gaps.push({
                    severity: 'HIGH', emoji: '🟠',
                    title: `${newMappings.length} new endpoint(s) in existing controller`,
                    file: fn,
                    doc: '`docs/docs/reference/apis/rest-api.md`',
                    reason: 'New endpoints expand the API surface.',
                  });
                }
              }

              // MEDIUM: new configuration property
              if (/^\+.*@Value\("\$\{openaev\./m.test(patch)) {
                gaps.push({
                  severity: 'MEDIUM', emoji: '🟡',
                  title: 'New configuration property',
                  file: fn,
                  doc: '`docs/docs/reference/deployment/configuration.md`',
                  reason: 'Configuration options should be documented for administrators.',
                });
              }

              // MEDIUM: new preview feature flag
              if (isMod && /PreviewFeature\.java$/.test(fn) && /^\+\s+[A-Z_]+/m.test(patch)) {
                gaps.push({
                  severity: 'MEDIUM', emoji: '🟡',
                  title: 'New preview feature flag',
                  file: fn,
                  doc: '`docs/docs/reference/deployment/configuration.md`',
                  reason: 'Administrators need to know about available feature flags.',
                });
              }
            }

            // -- 6. no gaps → pass ----------------------------------------

            if (gaps.length === 0) {
              await publishReport([
                MARKER,
                `${TITLE} — ✅ Nothing to document`,
                '',
                `**${funcFiles.length}** application file(s) changed. None of them adds an endpoint, a page, an integration, a setting or a preview feature.`,
              ].join('\n'));
              return;
            }

            // -- 7. gaps found but docs also changed → pass ---------------

            if (docFiles.length > 0) {
              await publishReport([
                MARKER,
                `${TITLE} — ✅ Docs updated`,
                '',
                `**${funcFiles.length}** application file(s) and **${docFiles.length}** docs file(s) changed. Thanks for keeping the docs in step 👏`,
                '',
                '<details>',
                '<summary>Changes that usually need a docs update</summary>',
                '',
                ...gaps.map(g => `- ${g.emoji} **${g.title}** — \`${g.file}\``),
                '',
                '</details>',
              ].join('\n'));
              return;
            }

            // -- 8. gaps found, no doc changes → report -------------------

            const expected  = gaps.filter(g => g.severity === 'CRITICAL' || g.severity === 'HIGH');
            const suggested = gaps.filter(g => g.severity !== 'CRITICAL' && g.severity !== 'HIGH');
            const failed    = expected.length > 0;

            const lines = [
              MARKER,
              failed
                ? `${TITLE} — ❌ Docs update expected`
                : `${TITLE} — ⚠️ Docs update suggested`,
              '',
              `**${funcFiles.length}** application file(s) changed and no docs file. This is a reminder, not a required check: it never blocks the merge.`,
              '',
            ];

            if (expected.length > 0) {
              lines.push('### Expected docs updates', '');
              lines.push('These changes are usually documented in the same pull request.', '');
              for (const g of expected) {
                lines.push(`#### ${g.emoji} ${g.title}`);
                lines.push(`- **File**: \`${g.file}\``);
                lines.push(`- **Docs page**: ${g.doc}`);
                lines.push(`- **Why**: ${g.reason}`);
                lines.push('');
              }
            }

            if (suggested.length > 0) {
              lines.push('### Suggested docs updates', '');
              for (const g of suggested) {
                lines.push(`- ${g.emoji} **${g.title}** — \`${g.file}\` → ${g.doc}`);
              }
              lines.push('');
            }

            lines.push('---');
            lines.push(failed
              ? `> Nothing to document? Add the \`${SKIP_LABEL}\` label and this check turns green.`
              : `> Nothing to document? Add the \`${SKIP_LABEL}\` label to close this reminder.`);

            await publishReport(lines.join('\n'));

            if (failed) {
              core.setFailed(
                `${expected.length} change(s) usually need a docs update. `
                + `Update docs/ or add the '${SKIP_LABEL}' label. This does not block the merge.`
              );
            }
