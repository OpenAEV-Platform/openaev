name: Deploy documentation

# Publishes MkDocs documentation to GitHub Pages via mike.

on:
  workflow_call:
    inputs:
      version:
        description: 'Documentation version label (e.g. "2.260717.0")'
        required: true
        type: string
    secrets:
      RELEASE_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Documentation version label (e.g. "2.260717.0")'
        required: true
        type: string

concurrency:
  group: docs-deploy
  cancel-in-progress: false

permissions:
  contents: write # mike pushes to the gh-pages branch

jobs:
  deploy-docs:
    name: Deploy documentation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version }}
          fetch-depth: 0 # full history required by mike and git-based plugins
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # The Python of docs/.python-version, as the Docs Check uses. A tag from before that file
      # existed gets 3.11, the oldest Python the docs support.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ${{ hashFiles('docs/.python-version') != '' && 'docs/.python-version' || '' }}
          python-version: ${{ hashFiles('docs/.python-version') == '' && '3.11' || '' }}

      # The pinned docs/requirements.txt, installed as docs/run.py installs it for the Docs Check, so
      # the deployed site is built with what CI tested. Older tags have a plain list of packages
      # instead of a lock, which pip must resolve. mike builds with ProperDocs when it is installed
      # (mkdocs-redirects pulls it in), as the Docs Check does, otherwise with MkDocs, and runs either
      # by name from the PATH: the venv goes first.
      - name: Install documentation dependencies
        working-directory: docs
        run: |
          python -m venv "$RUNNER_TEMP/docs-venv"
          . "$RUNNER_TEMP/docs-venv/bin/activate"
          if grep -q '^# This file was autogenerated by uv' requirements.txt; then
            pip install --disable-pip-version-check --no-deps -r requirements.txt
            pip check
          else
            pip install --disable-pip-version-check -r requirements.txt
          fi
          echo "$RUNNER_TEMP/docs-venv/bin" >> "$GITHUB_PATH"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Validate version tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! git tag --list "$VERSION" | grep -q .; then
            echo "::error::Tag '${VERSION}' does not exist. The version must match an existing git tag."
            exit 1
          fi

      - name: Find latest tag
        uses: ./.github/actions/find-latest-tag
        id: find-latest-tag

      - name: Resolve latest tag
        id: latest-tag
        env:
          VERSION: ${{ inputs.version }}
          LATEST_TAG: ${{ steps.find-latest-tag.outputs.latest-tag }}
        run: |
          IS_LATEST=$( [ "$VERSION" = "$LATEST_TAG" ] && echo "true" || echo "false" )
          echo "is_latest=${IS_LATEST}" >> "$GITHUB_OUTPUT"
          echo "Resolved latest tag: ${LATEST_TAG}, input version is latest: ${IS_LATEST}"

      - name: Deploy with mike
        working-directory: docs
        env:
          MKDOCS_GIT_COMMITTERS_APIKEY: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          IS_LATEST: ${{ steps.latest-tag.outputs.is_latest }}
        run: |
          if [ "$IS_LATEST" = "true" ]; then
            mike deploy --push --update-aliases "$VERSION" latest
          else
            mike deploy --push "$VERSION"
          fi
          echo "Documentation deployed: version=${VERSION}, latest=${IS_LATEST}"
