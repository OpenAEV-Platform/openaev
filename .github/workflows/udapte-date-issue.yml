name: Update Project Dates on Status Change

on:
  project:
    types: [edited]

permissions:
  contents: read
  repository-projects: write

jobs:
  update_project_dates:
    runs-on: ubuntu-latest
    steps:
      - name: Update dates based on Status
        uses: actions/github-script@v8
        env:
          PROJECT_ID: ${{ secrets.TEST_PROJECT_ID }}
          STATUS_FIELD_ID: ${{ secrets.TEST_STATUS_FIELD_ID }}
          START_DATE_FIELD_ID: ${{ secrets.TEST_START_DATE_FIELD_ID }}
          EFFECTIVE_END_DATE_FIELD_ID: ${{ secrets.TEST_EFFECTIVE_END_DATE_FIELD_ID }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const event = context.payload;

            // Vérifier que c'est un item d'issue
            if (event.content_type !== "Issue") return;

            const START_DATE_STATUS = ["Dev Brainstorm", "Dev In Progress"];
            const END_DATE_STATUS = ["In review"];


            const PROJECT_ID = process.env.PROJECT_ID;
            const STATUS_FIELD_ID = process.env.STATUS_FIELD_ID;
            const START_DATE_FIELD_ID = process.env.START_DATE_FIELD_ID;
            const EFFECTIVE_END_DATE_FIELD_ID = process.env.EFFECTIVE_END_DATE_FIELD_ID;

            if (event.project_node_id !== PROJECT_ID) return;

            if (!event.changes?.field_value || event.changes.field_value.field_node_id !== STATUS_FIELD_ID) return;

            const newStatus = event.changes.field_value.new_value?.name;
            if (!newStatus) return;

            const itemId = event.projects_v2_item_node_id;
            const today = new Date().toISOString().split("T")[0];

            const itemData = await github.graphql(`
              query ($item:ID!) {
                node(id:$item) {
                  ... on ProjectV2Item {
                    fieldValues(first:20) {
                      nodes {
                        ... on ProjectV2ItemFieldDateValue {
                          field { ... on ProjectV2FieldCommon { id } }
                          date
                        }
                      }
                    }
                  }
                }
              }
            `, { item: itemId });

            const fieldNodes = itemData.node.fieldValues.nodes;

            async function updateDate(fieldId) {
              await github.graphql(`
                mutation ($project:ID!, $item:ID!, $field:ID!, $date:Date!) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $project
                      itemId: $item
                      fieldId: $field
                      value: { date: $date }
                    }
                  ) { projectV2Item { id } }
                }
              `, { project: PROJECT_ID, item: itemId, field: fieldId, date: today });
            }

            if (START_DATE_STATUS.includes(newStatus)) {
              const startField = fieldNodes.find(f => f.field.id === START_DATE_FIELD_ID);
              if (!startField || !startField.date) {
                await updateDate(START_DATE_FIELD_ID);
              }
            }

            if (END_DATE_STATUS.includes(newStatus)) {
              const endField = fieldNodes.find(f => f.field.id === EFFECTIVE_END_DATE_FIELD_ID);
              if (!endField || !endField.date) {
                await updateDate(EFFECTIVE_END_DATE_FIELD_ID);
              }
            }
