    .material-symbols-outlined {
      font-size: 20px;
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
    }
    /* Pulse animation — signature subtle motion */
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .pulse-dot {
      position: relative;
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .pulse-dot::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: inherit;
      animation: pulse-ring 2s ease-out infinite;
    }
  </style>

        {navGroups.map((group, gi) => (
          <React.Fragment key={gi}>
            {gi > 0 && <div style={{ height: 1, background: 'var(--border-default)', margin: '6px 8px' }}/>}
            {group.items.map(item => (
              <SidebarItem key={item.id} icon={item.icon} label={item.label} active={item.id === activeId} />
            ))}
          </React.Fragment>
        ))}
        <div style={{ marginTop: 'auto', padding: '8px 12px' }}>
          <div style={{
            display: 'flex', alignItems: 'center', gap: 8,
            height: 'var(--nav-item-height)', padding: '0 12px',
            color: 'var(--text-secondary)', fontSize: '0.8125rem', cursor: 'pointer',
          }}>
            <Icon name="rocket_launch" size={18} style={{ opacity: 0.85 }} />
            <span>Getting started</span>
          </div>
          <div style={{ marginTop: 8, fontSize: '0.625rem', color: 'var(--text-tertiary)', fontFamily: 'var(--font-mono)', letterSpacing: '0.04em' }}>
            by Filigran
          </div>
        </div>
      </nav>
    );

    const Breadcrumbs = ({ items }) => (
      <nav style={{
        display: 'flex', alignItems: 'center', gap: 6,
        marginBottom: 'var(--spacing-l)', fontSize: '0.8125rem',
      }}>
        {items.map((item, i) => (
          <React.Fragment key={i}>
            {i > 0 && <span style={{ color: 'var(--text-tertiary)' }}>/</span>}
            <span style={{
              color: i === items.length - 1 ? 'var(--text-primary)' : 'var(--primary)',
              cursor: i < items.length - 1 ? 'pointer' : 'default',
            }}>{item}</span>
          </React.Fragment>
        ))}
      </nav>
    );

    const AppShell = ({ activeNav, breadcrumbs, children }) => (
      <div style={{ minHeight: '100vh', minWidth: 1400 }}>
        <TopBar />
        <Sidebar activeId={activeNav} />
        <main style={{
          marginLeft: 'var(--nav-width-expanded)',
          paddingTop: 'calc(var(--topbar-height) + 16px)',
          padding: 'calc(var(--topbar-height) + 16px) 20px 24px 20px',
        }}>
          {breadcrumbs && <Breadcrumbs items={breadcrumbs} />}
          {children}
        </main>
      </div>
    );

    // ─── Common components ──────────────────────────────────────────────────────

    const Eyebrow = ({ children, style }) => (
      <span style={{
        fontSize: '0.6875rem', fontWeight: 500,
        letterSpacing: '0.08em', textTransform: 'uppercase',
        fontFamily: 'var(--font-mono)', color: 'var(--text-tertiary)',
        ...style,
      }}>{children}</span>
    );

    const Num = ({ children, severity, style }) => (
      <span style={{
        fontFamily: 'var(--font-mono)',
        fontVariantNumeric: 'tabular-nums',
        color: severity ? `var(--severity-${severity})` : 'inherit',
        ...style,
      }}>{children}</span>
    );

    // ─── Mock data (realistic, never lorem ipsum) ───────────────────────────────

    // const data = [];

    // ─── Page content ───────────────────────────────────────────────────────────

    function App() {
      return (
        <AppShell activeNav="simulations" breadcrumbs={['Simulations', 'Feature name']}>
          <h1 className="txt-title" style={{ marginBottom: 'var(--spacing-l)' }}>
            Page title
          </h1>
          {/* Build your prototype here */}
        </AppShell>
      );
    }

    // ─── Render ─────────────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
