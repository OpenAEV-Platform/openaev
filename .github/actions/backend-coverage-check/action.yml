name: Backend Coverage Check
description: >
  Check the backend coverage rules of a pull request on the JaCoCo report the coverage-backend job
  builds: at least min-coverage percent of the backend lines it changes are covered
  (check-patch-coverage.py), and backend line coverage does not drop by more than max-drop points
  against the latest report of the last commit of main (check-coverage-drop.py). Both count
  lines the way Codecov does, so a line where only some branches ran is not covered, and the
  results match Codecov's once the branch is up to date with main. Both rules run to the end. When
  one fails, a "Backend Coverage" check explains why, posted with the PR checks app like the PR
  title check (pull requests from forks get no app token, so only the job log explains it), and
  the last step fails, which blocks the merge through the Pipeline Gate. A pull request waives the
  rules with a "Coverage exempt: <why>" line in its description (coverage-exemption.py): the
  check then shows the failed rules as neutral, with the reason, and the step stays green.
  Expects a checkout of the pull request's merge commit with at least its first parent, and the
  report at openaev-api/target/site/jacoco/jacoco.xml. Requires the job to set GH_TOKEN, which
  reads the reports of main.

inputs:
  min-coverage:
    description: "Smallest share of the changed backend lines that must be covered, in percent"
    required: true
  max-drop:
    description: "Largest drop of backend line coverage allowed, in points"
    required: true
  client-id:
    description: "PR checks app client id; empty on pull requests from forks, which then get no explanation check"
    required: false
    default: ""
  private-key:
    description: "PR checks app private key"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Generate a token
      id: generate-token
      if: ${{ inputs.client-id != '' && inputs.private-key != '' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}

    - name: Check backend patch coverage
      id: patch
      continue-on-error: true
      shell: bash
      env:
        MIN_COVERAGE: ${{ inputs.min-coverage }}
      run: |
        python3 "$GITHUB_WORKSPACE/.github/scripts/check-patch-coverage.py" \
          --report openaev-api/target/site/jacoco/jacoco.xml \
          --base HEAD^1 \
          --fail-under "$MIN_COVERAGE" | tee "$RUNNER_TEMP/patch-coverage.txt"

    - name: Check backend project coverage
      id: project
      continue-on-error: true
      shell: bash
      env:
        MAX_DROP: ${{ inputs.max-drop }}
      run: |
        python3 "$GITHUB_WORKSPACE/.github/scripts/check-coverage-drop.py" \
          --report openaev-api/target/site/jacoco/jacoco.xml \
          --target-sha "$(git rev-parse HEAD^1)" \
          --max-drop "$MAX_DROP" | tee "$RUNNER_TEMP/project-coverage.txt"

    # Read only when a rule failed, through the API rather than from the event, so that a re-run
    # sees a line added to the description since the first run.
    - name: Look for a coverage exemption
      id: exempt
      if: ${{ steps.patch.outcome != 'success' || steps.project.outcome != 'success' }}
      shell: bash
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        reason=$(python3 "$GITHUB_WORKSPACE/.github/scripts/coverage-exemption.py" --pr "$PR_NUMBER")
        echo "reason=$reason" >> "$GITHUB_OUTPUT"

    # A passing pull request gets no extra check, unless an earlier run on the same commit posted a
    # failure: the script then replaces it with a passing one.
    - name: Explain the failure in a check
      id: explain
      if: ${{ steps.generate-token.outputs.token != '' }}
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MIN_COVERAGE: ${{ inputs.min-coverage }}
        MAX_DROP: ${{ inputs.max-drop }}
        PATCH_OUTCOME: ${{ steps.patch.outcome }}
        PROJECT_OUTCOME: ${{ steps.project.outcome }}
        EXEMPT_REASON: ${{ steps.exempt.outputs.reason }}
      run: |
        python3 "$GITHUB_WORKSPACE/.github/scripts/post-coverage-check.py" \
          --sha "$HEAD_SHA" \
          --min-coverage "$MIN_COVERAGE" \
          --max-drop "$MAX_DROP" \
          --patch-outcome "$PATCH_OUTCOME" \
          --patch-log "$RUNNER_TEMP/patch-coverage.txt" \
          --project-outcome "$PROJECT_OUTCOME" \
          --project-log "$RUNNER_TEMP/project-coverage.txt" \
          --exempt-reason="$EXEMPT_REASON"

    # The rules block the merge through the Pipeline Gate, unless the pull request waives them.
    - name: Fail on a broken coverage rule
      if: ${{ steps.patch.outcome != 'success' || steps.project.outcome != 'success' }}
      shell: bash
      env:
        PATCH_OUTCOME: ${{ steps.patch.outcome }}
        PROJECT_OUTCOME: ${{ steps.project.outcome }}
        EXEMPT_REASON: ${{ steps.exempt.outputs.reason }}
      run: |
        echo "Backend coverage rules: changed lines $PATCH_OUTCOME, whole backend $PROJECT_OUTCOME."
        if [ -n "$EXEMPT_REASON" ]; then
          echo "Waived by the pull request description: $EXEMPT_REASON"
          exit 0
        fi
        echo "The steps above list the lines to cover. A change that cannot be tested can waive the"
        echo "rules: write 'Coverage exempt: <why>' in the pull request description, then re-run the"
        echo "failed jobs."
        exit 1
