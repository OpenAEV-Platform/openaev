name: API Types Check
description: >
  Start service containers (PostgreSQL, Elasticsearch, RabbitMQ, MinIO),
  download and run the backend Docker image, and verify that generated API types
  are up to date.  The Docker image is built in parallel by the docker-build job;
  this action polls for the image artifact and loads it once available.
  Requires job-level env vars: SPRING_DATASOURCE_URL,
  SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
  MINIO_ENDPOINT, MINIO_PORT, MINIO_ACCESS_KEY, MINIO_ACCESS_SECRET,
  ENGINE_URL, OPENBAS_RABBITMQ_HOSTNAME, OPENAEV_ADMIN_EMAIL,
  OPENAEV_ADMIN_PASSWORD, OPENAEV_ADMIN_TOKEN,
  OPENAEV_ADMIN_ENCRYPTION_KEY, OPENAEV_ADMIN_ENCRYPTION_SALT,
  SPRING_PROFILES_ACTIVE, GH_TOKEN.

runs:
  using: composite
  steps:
    - name: Start all services (non-blocking)
      shell: bash
      run: |
        docker run -d --name pgsql \
          -p 5432:5432 \
          -e POSTGRES_USER=openaev \
          -e POSTGRES_PASSWORD=openaev \
          -e POSTGRES_DB=openaev \
          postgres:17-alpine \
          -c max_connections=1000
        docker run -d --name elasticsearch \
          -p 9200:9200 \
          -e discovery.type=single-node \
          -e xpack.security.enabled=false \
          -e "ES_JAVA_OPTS=-Xms2g -Xmx2g" \
          docker.elastic.co/elasticsearch/elasticsearch:8.18.3
        docker run -d --name rabbitmq \
          -p 5672:5672 \
          -p 15672:15672 \
          -e RABBITMQ_DEFAULT_USER=guest \
          -e RABBITMQ_DEFAULT_PASS=guest \
          rabbitmq:4.1-management
        docker run -d --name minio \
          -p 11000:9000 \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          minio/minio:RELEASE.2025-06-13T11-33-47Z server /data

        echo "🔍 Verifying containers started..."
        for name in pgsql elasticsearch rabbitmq minio; do
          if ! docker inspect --format='{{.State.Running}}' "$name" 2>/dev/null | grep -q true; then
            echo "❌ Container '$name' failed to start"
            docker logs "$name" 2>/dev/null || true
            exit 1
          fi
        done
        echo "✅ All containers started"

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: "22.23.0"

    - name: Install corepack
      run: npm install -g corepack
      shell: bash

    - name: Get Yarn cache directory
      id: yarn-cache-dir
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: openaev-front

    - name: Cache Yarn dependencies
      uses: actions/cache@v5
      with:
        path: ${{ steps.yarn-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('openaev-front/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Install frontend dependencies
      run: yarn install --immutable
      shell: bash
      working-directory: openaev-front

    - name: Wait for Docker image artifact
      shell: bash
      run: |
        echo "⏳ Waiting for Docker image artifact (services booting in parallel)..."
        for i in $(seq 1 180); do
          # Check if docker-build has failed — abort immediately
          BUILD_CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[] | select(.name | test("Docker Build")) | .conclusion] | first' 2>/dev/null || echo "")
          if [ "$BUILD_CONCLUSION" = "failure" ] || [ "$BUILD_CONCLUSION" = "cancelled" ]; then
            echo "❌ Docker Build job $BUILD_CONCLUSION — aborting"
            exit 1
          fi
          NAMES=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '[.artifacts[].name]' 2>/dev/null || echo "[]")
          if echo "$NAMES" | grep -q '"openaev-image"'; then
            echo "✅ Artifact available (after ~$((i * 5))s)"
            break
          fi
          if [ "$i" -eq 180 ]; then
            echo "❌ Timed out waiting for artifact (15 min)"
            exit 1
          fi
          echo "  Attempt $i/180 — not ready, retrying in 5s..."
          sleep 5
        done

    - name: Download Docker image artifact
      uses: actions/download-artifact@v8
      with:
        name: openaev-image
        path: /tmp/openaev-image

    - name: Load Docker image
      shell: bash
      run: |
        cd /tmp/openaev-image
        gunzip openaev-image.tar.gz
        ARCH=$(dpkg --print-architecture)
        echo "🐳 Loading Docker image (platform: linux/$ARCH)..."
        skopeo copy --override-os linux --override-arch "$ARCH" \
          oci-archive:openaev-image.tar \
          docker-daemon:openaev:ci
        rm -f openaev-image.tar
        IMAGE_ID=$(docker images openaev:ci --format '{{.ID}}')
        if [ -z "$IMAGE_ID" ]; then
          echo "❌ Failed to load Docker image"
          exit 1
        fi
        echo "✅ Docker image loaded (ID: $IMAGE_ID)"

    - name: Wait for services
      shell: bash
      run: |
        echo "⏳ Waiting for PostgreSQL..."
        for i in $(seq 1 30); do
          docker exec pgsql pg_isready -U openaev && break
          sleep 1
        done
        docker exec pgsql pg_isready -U openaev || { echo "❌ PostgreSQL failed to start"; exit 1; }

        echo "⏳ Waiting for Elasticsearch..."
        for i in $(seq 1 30); do
          curl -sf http://localhost:9200/_cluster/health && break
          sleep 2
        done
        curl -sf http://localhost:9200/_cluster/health || { echo "❌ Elasticsearch failed to start"; exit 1; }

        echo "⏳ Waiting for RabbitMQ..."
        for i in $(seq 1 30); do
          docker exec rabbitmq rabbitmq-diagnostics -q check_running 2>/dev/null && break
          sleep 2
        done
        docker exec rabbitmq rabbitmq-diagnostics -q check_running || { echo "❌ RabbitMQ failed to start"; exit 1; }

        echo "⏳ Waiting for MinIO..."
        for i in $(seq 1 30); do
          curl -sf http://localhost:11000/minio/health/live && break
          sleep 1
        done
        curl -sf http://localhost:11000/minio/health/live || { echo "❌ MinIO failed to start"; exit 1; }

        echo "✅ All services ready"

    - name: Start application
      shell: bash
      run: |
        echo "🚀 Starting OpenAEV from Docker image..."
        docker run -d --name openaev-app --network host \
          -e SPRING_DATASOURCE_URL \
          -e SPRING_DATASOURCE_USERNAME \
          -e SPRING_DATASOURCE_PASSWORD \
          -e MINIO_ENDPOINT \
          -e MINIO_PORT \
          -e MINIO_ACCESS_KEY \
          -e MINIO_ACCESS_SECRET \
          -e ENGINE_URL \
          -e OPENBAS_RABBITMQ_HOSTNAME \
          -e OPENAEV_ADMIN_EMAIL \
          -e OPENAEV_ADMIN_PASSWORD \
          -e OPENAEV_ADMIN_TOKEN \
          -e OPENAEV_ADMIN_ENCRYPTION_KEY \
          -e OPENAEV_ADMIN_ENCRYPTION_SALT \
          -e SPRING_PROFILES_ACTIVE \
          openaev:ci
        echo "✅ Container started"

    - name: Wait for application to be ready
      shell: bash
      run: |
        echo "Waiting for application on port 8080..."
        for i in $(seq 1 90); do
          # Check container is still running
          if ! docker inspect --format='{{.State.Running}}' openaev-app 2>/dev/null | grep -q true; then
            echo "❌ Container openaev-app stopped unexpectedly"
            echo "  Last 40 lines of container log:"
            docker logs --tail 40 openaev-app 2>&1 || true
            exit 1
          fi
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:8080 2>/dev/null || echo "000")
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Application is ready (HTTP 200 after ~$((i * 2))s)"
            break
          fi
          if [ "$i" -eq 90 ]; then
            echo "❌ Application failed to become ready within 180s"
            echo "  Last HTTP response: HTTP $HTTP_CODE"
            echo "  Last 40 lines of container log:"
            docker logs --tail 40 openaev-app 2>&1 || true
            exit 1
          fi
          sleep 2
        done

    - name: Verify API types are up to date
      shell: bash
      working-directory: openaev-front
      run: |
        API_URL=http://localhost:8080 yarn generate-types-from-api
        if git diff --name-only | grep -q 'src/utils/api-types.d.ts'; then
          echo "Detected changes in src/utils/api-types.d.ts:";
          git diff -- src/utils/api-types.d.ts || git diff -- openaev-front/src/utils/api-types.d.ts;
          echo "⚠️ Forgot to generate types! Please run 'yarn run generate-types-from-api' before committing."; exit 1;
        fi
