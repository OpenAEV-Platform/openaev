name: Migrations Guard
description: Runs sanity checks on migrations to avoid common problems

inputs:
  last-release-number:
    description: The last OpenAEV release number
    required: true

env:
  MIGRATIONS_IN_LAST_RELEASE_CMD="git ls-tree ${{ inputs.last-release-number }} --name-only -- openaev-api/src/main/java/io/openaev/migration/"
  MIGRATIONS_IN_BRANCH_CMD="find openaev-api/src/main/java/io/openaev/migration/* | sort"

runs:
  using: composite
  steps:
    - name: Check new migrations block is strictly appended to the end since the last release
      run: |
        DIFF_FILES=$(diff --side-by-side <(eval "${MIGRATIONS_IN_LAST_RELEASE_CMD}") <(eval "${MIGRATIONS_IN_BRANCH_CMD}") | tac)
        echo "Comparing migration files from the last release with the current branch... (reverse chronological order)"
        
        echo "Diff between release ${{ inputs.last-release-number }} and current branch (a chevron means a difference)"
        echo "${DIFF_FILES}"
        
        NO_DIFF_ALLOWED=false
        
        while IFS= read -r line
        do
          case "$line" in
            *\>*)
              if [ "true" = "${NO_DIFF_ALLOWED}" ]; then
                echo "ERROR: the block of previously released migrations was changed (check diff above). Exiting."
                exit 1
              fi;
              ;;
            *)
              NO_DIFF_ALLOWED=true;
              ;;
          esac
        done <<< "$DIFF_FILES"
        
        echo "All good: no change in the previously released migrations block."
      shell: bash
