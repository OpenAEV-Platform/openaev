name: Resolve CI Registry
description: >
  Decide whether this run can hand Docker images over via GHCR instead of
  artifacts. Fork pull requests receive a read-only GITHUB_TOKEN with no
  packages:write, so they fall back to the artifact path. Images are uploaded as
  artifacts either way; the registry only changes how jobs consume them.

outputs:
  available:
    description: '"true" when the registry handoff can be used'
    value: ${{ steps.resolve.outputs.available }}
  repository:
    description: Lowercased GHCR repository, e.g. ghcr.io/owner/repo-ci
    value: ${{ steps.resolve.outputs.repository }}
  tag-prefix:
    description: Tag prefix unique to this run attempt
    value: ${{ steps.resolve.outputs.tag_prefix }}

runs:
  using: composite
  steps:
    - name: Resolve CI registry
      id: resolve
      shell: bash
      env:
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -euo pipefail
        REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
        echo "repository=ghcr.io/${REPO_LC}-ci" >> "$GITHUB_OUTPUT"
        # Attempt is part of the prefix so a re-run never pulls the previous attempt's image
        echo "tag_prefix=run-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

        if [ "${{ github.event_name }}" = "pull_request" ] && \
           [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "${{ github.repository }}" ]; then
          echo "available=false" >> "$GITHUB_OUTPUT"
          echo "🔒 Fork PR ($HEAD_REPO) — GITHUB_TOKEN is read-only, using artifact handoff"
        else
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "📦 Registry handoff: ghcr.io/${REPO_LC}-ci"
        fi
