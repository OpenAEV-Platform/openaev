name: Wait for Workflow Artifacts
description: >
  Wait for required artifacts while monitoring their producer jobs. Aborts as
  soon as a producer reaches any terminal non-success conclusion.

inputs:
  artifact-names:
    description: "Newline-separated required workflow artifact names"
    required: true
  producer-job-names:
    description: "Newline-separated producer job-name substrings"
    required: true
  wait-seconds:
    description: "Maximum time to wait for all artifacts"
    required: false
    default: "900"
  initial-delay-seconds:
    description: >
      Quiet period before the first poll. Producers have never delivered in under 50s on this
      pipeline, so polling earlier only burns API quota.
    required: false
    default: "45"
  poll-min-seconds:
    description: "Lower bound of the randomised interval between polls"
    required: false
    default: "10"
  poll-max-seconds:
    description: "Upper bound of the randomised interval between polls"
    required: false
    default: "20"

runs:
  using: composite
  steps:
    - name: Wait for artifacts and producers
      shell: bash
      env:
        ARTIFACT_NAMES: ${{ inputs.artifact-names }}
        PRODUCER_JOB_NAMES: ${{ inputs.producer-job-names }}
        WAIT_SECONDS: ${{ inputs.wait-seconds }}
        INITIAL_DELAY_SECONDS: ${{ inputs.initial-delay-seconds }}
        POLL_MIN_SECONDS: ${{ inputs.poll-min-seconds }}
        POLL_MAX_SECONDS: ${{ inputs.poll-max-seconds }}
      run: |
        set -euo pipefail

        mapfile -t ARTIFACTS < <(printf '%s\n' "$ARTIFACT_NAMES" \
          | sed -e 's/\r$//' -e '/^[[:space:]]*$/d')
        mapfile -t PRODUCERS < <(printf '%s\n' "$PRODUCER_JOB_NAMES" \
          | sed -e 's/\r$//' -e '/^[[:space:]]*$/d')

        if [ "${#ARTIFACTS[@]}" -eq 0 ] || [ "${#PRODUCERS[@]}" -eq 0 ]; then
          echo "artifact-names and producer-job-names must not be empty" >&2
          exit 1
        fi
        for value_name in WAIT_SECONDS POLL_MIN_SECONDS POLL_MAX_SECONDS; do
          value="${!value_name}"
          if ! [[ "$value" =~ ^[0-9]+$ ]] || [ "$value" -eq 0 ]; then
            input_name=$(printf '%s' "${value_name,,}" | tr '_' '-')
            echo "${input_name} must be a positive integer" >&2
            exit 1
          fi
        done
        if ! [[ "$INITIAL_DELAY_SECONDS" =~ ^[0-9]+$ ]]; then
          echo "initial-delay-seconds must be a non-negative integer" >&2
          exit 1
        fi
        if [ "$POLL_MAX_SECONDS" -lt "$POLL_MIN_SECONDS" ]; then
          echo "poll-max-seconds must not be lower than poll-min-seconds" >&2
          exit 1
        fi
        JITTER_SPAN=$((POLL_MAX_SECONDS - POLL_MIN_SECONDS + 1))

        required_artifacts_ready() {
          local artifact names="$1"
          for artifact in "${ARTIFACTS[@]}"; do
            grep -qxF "$artifact" <<< "$names" || return 1
          done
        }

        check_producers() {
          local conclusion expected job_name rows="$1"
          for expected in "${PRODUCERS[@]}"; do
            while IFS=$'\t' read -r job_name conclusion; do
              [[ "$job_name" == *"$expected"* ]] || continue
              case "$conclusion" in
                ""|success) ;;
                *)
                  echo "Required producer did not succeed: ${job_name} (${conclusion})" >&2
                  return 0
                  ;;
              esac
            done <<< "$rows"
          done
          return 1
        }

        START_TIME=$SECONDS
        DEADLINE=$((SECONDS + WAIT_SECONDS))
        echo "Waiting for workflow artifacts: ${ARTIFACTS[*]}"

        # Every consumer job polls the same run, so an immediate synchronised poll storm is what
        # pushed the artifact endpoints into 403s. Hold past the point where an artifact could
        # plausibly exist, then stagger the first request.
        if [ "$INITIAL_DELAY_SECONDS" -gt 0 ]; then
          FIRST_POLL=$((INITIAL_DELAY_SECONDS + RANDOM % JITTER_SPAN))
          REMAINING=$((DEADLINE - SECONDS))
          if [ "$FIRST_POLL" -gt "$REMAINING" ]; then
            FIRST_POLL=$REMAINING
          fi
          if [ "$FIRST_POLL" -gt 0 ]; then
            echo "Holding ${FIRST_POLL}s before the first poll"
            sleep "$FIRST_POLL"
          fi
        fi

        while true; do
          REMAINING=$((DEADLINE - SECONDS))
          if [ "$REMAINING" -le 0 ]; then
            echo "Timed out after ${WAIT_SECONDS}s waiting for artifacts: ${ARTIFACTS[*]}" >&2
            exit 1
          fi
          API_TIMEOUT=$((REMAINING < 15 ? REMAINING : 15))

          ARTIFACT_ROWS=$(timeout --kill-after=5s "${API_TIMEOUT}s" gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?per_page=100" \
            --jq '.artifacts[].name' 2>/dev/null || true)
          JOB_ROWS=$(timeout --kill-after=5s "${API_TIMEOUT}s" gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            --jq '.jobs[] | [.name, (.conclusion // "")] | @tsv' 2>/dev/null || true)
          if check_producers "$JOB_ROWS"; then
            exit 1
          fi

          if required_artifacts_ready "$ARTIFACT_ROWS"; then
            echo "Artifacts ready after $((SECONDS - START_TIME))s"
            exit 0
          fi

          REMAINING=$((DEADLINE - SECONDS))
          if [ "$REMAINING" -le 0 ]; then
            echo "Timed out after ${WAIT_SECONDS}s waiting for artifacts: ${ARTIFACTS[*]}" >&2
            exit 1
          fi
          SLEEP_SECONDS=$((POLL_MIN_SECONDS + RANDOM % JITTER_SPAN))
          if [ "$REMAINING" -lt "$SLEEP_SECONDS" ]; then
            SLEEP_SECONDS=$REMAINING
          fi
          sleep "$SLEEP_SECONDS"
        done
