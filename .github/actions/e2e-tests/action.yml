name: E2E Tests
description: >
  Start service containers (PostgreSQL, Elasticsearch, RabbitMQ, MinIO),
  download and run the backend Docker image, and run Playwright E2E tests.
  The Docker image is built in parallel by the docker-build job; this action
  waits for a registry marker or image artifact and loads the first usable source.
  Requires job-level env vars: SPRING_DATASOURCE_URL,
  SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
  MINIO_ENDPOINT, MINIO_PORT, MINIO_ACCESS_KEY, MINIO_ACCESS_SECRET,
  ENGINE_URL, OPENBAS_RABBITMQ_HOSTNAME, OPENAEV_ADMIN_EMAIL,
  OPENAEV_ADMIN_PASSWORD, OPENAEV_ADMIN_TOKEN,
  OPENAEV_ADMIN_ENCRYPTION_KEY, OPENAEV_ADMIN_ENCRYPTION_SALT,
  SPRING_PROFILES_ACTIVE, GH_TOKEN.

inputs:
  browser:
    description: "Browser name (chrome, chromium, webkit, firefox, or edge) — used for project selection, artifact naming, and browser install."
    required: true
  playwright-config:
    description: "Playwright config file to use (relative to openaev-front/). Defaults to playwright.config.ts."
    required: false
    default: "playwright.config.ts"
  docker-image:
    description: "Docker image artifact name to download and test against."
    required: false
    default: "openaev-image-amd64"
  search-engine:
    description: "Search engine type: elasticsearch or opensearch"
    required: false
    default: "elasticsearch"
  search-engine-image:
    description: "Docker image for the search engine (default from openaev-dev/docker-compose.yml)"
    required: false
    default: ""
  project:
    description: "Playwright project name to run (defaults to the browser input value)."
    required: false
    default: ""
  includes:
    description: >
      Newline-separated path filters (regex, matched against the spec path) selecting
      which specs this shard runs. Use "catchall" to run every spec not claimed by
      another shard (see excludes). Empty runs the project's whole set.
    required: false
    default: ""
  excludes:
    description: "Newline-separated path filters owned by explicit shards. Only read when includes is 'catchall'."
    required: false
    default: ""
  artifact-suffix:
    description: "Suffix appended to artifact names to avoid conflicts (e.g. '-opensearch')"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Start service containers
      uses: ./.github/actions/start-dev-services
      with:
        search-engine: ${{ inputs.search-engine }}
        search-engine-image: ${{ inputs.search-engine-image }}

    - name: Set up Node.js 22.11
      uses: actions/setup-node@v7
      with:
        node-version: "22.23.2"
    - name: Install corepack
      run: npm install -g corepack
      shell: bash
    - name: Get Yarn cache directory
      id: yarn-cache-dir
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: openaev-front
    - name: Cache Yarn dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.yarn-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('openaev-front/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
    - name: Install frontend dependencies
      run: yarn install --immutable
      shell: bash
      working-directory: openaev-front
    - name: Resolve Playwright version
      id: pw-version
      run: |
        VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test']")
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Playwright $VERSION"
      shell: bash
      working-directory: openaev-front
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        # Browser builds track the Playwright version, not the whole lockfile, so an
        # unrelated dependency bump no longer forces a re-download.
        key: playwright-${{ inputs.browser }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw-version.outputs.version }}
        restore-keys: |
          playwright-${{ inputs.browser }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Install Playwright browsers (${{ inputs.browser }} + chromium for setup)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: |
        BROWSER="${{ inputs.browser }}"
        [[ "$BROWSER" == "edge" ]] && BROWSER="msedge"
        yarn playwright install --with-deps chromium $BROWSER
      shell: bash
      working-directory: openaev-front
    - name: Install Playwright system dependencies (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: |
        BROWSER="${{ inputs.browser }}"
        [[ "$BROWSER" == "edge" ]] && BROWSER="msedge"
        yarn playwright install-deps chromium $BROWSER
      shell: bash
      working-directory: openaev-front

    - name: Obtain Docker image
      id: image-source
      uses: ./.github/actions/ci-image-handoff
      with:
        artifact-names: ${{ inputs.docker-image }}
        artifact-pattern: ${{ inputs.docker-image }}
        artifact-path: /tmp/openaev-image
        merge-artifacts: "true"
        registry-mode: pull
        local-tags: openaev:ci
        build-job-names: "Docker Build (${{ startsWith(inputs.docker-image, 'openaev-ubi9-') && 'ubi9' || 'standard' }} ${{ endsWith(inputs.docker-image, '-arm64') && 'arm64' || 'amd64' }})"

    - name: Load Docker image
      if: ${{ steps.image-source.outputs.source == 'artifact' }}
      shell: bash
      run: |
        cd /tmp/openaev-image
        echo "🐳 Loading Docker image (${{ inputs.docker-image }})..."
        gunzip -k ${{ inputs.docker-image }}.tar.gz
        # Convert OCI archive → docker-archive (file-based, avoids pipe issues with docker-daemon)
        skopeo copy \
          oci-archive:${{ inputs.docker-image }}.tar \
          docker-archive:docker-image.tar:openaev:ci
        rm -f ${{ inputs.docker-image }}.tar ${{ inputs.docker-image }}.tar.gz
        # Load into Docker daemon from file (reliable)
        docker load -i docker-image.tar
        rm -f docker-image.tar
        IMAGE_ID=$(docker images openaev:ci --format '{{.ID}}')
        if [ -z "$IMAGE_ID" ]; then
          echo "❌ Failed to load Docker image"
          exit 1
        fi
        echo "✅ Docker image loaded (ID: $IMAGE_ID)"

    - name: Wait for services
      shell: bash
      run: |
        echo "⏳ Waiting for PostgreSQL..."
        for i in $(seq 1 30); do
          docker exec pgsql pg_isready -U openaev && break
          sleep 1
        done
        docker exec pgsql pg_isready -U openaev || { echo "❌ PostgreSQL failed to start"; exit 1; }

        echo "⏳ Waiting for ${{ inputs.search-engine }}..."
        for i in $(seq 1 30); do
          curl -sf http://localhost:9200/_cluster/health && break
          sleep 2
        done
        curl -sf http://localhost:9200/_cluster/health || { echo "❌ ${{ inputs.search-engine }} failed to start"; exit 1; }

        echo "⏳ Waiting for RabbitMQ..."
        for i in $(seq 1 30); do
          docker exec rabbitmq rabbitmq-diagnostics -q check_running 2>/dev/null && break
          sleep 2
        done
        docker exec rabbitmq rabbitmq-diagnostics -q check_running || { echo "❌ RabbitMQ failed to start"; exit 1; }

        echo "⏳ Waiting for MinIO..."
        for i in $(seq 1 30); do
          curl -sf http://localhost:11000/minio/health/live && break
          sleep 1
        done
        curl -sf http://localhost:11000/minio/health/live || { echo "❌ MinIO failed to start"; exit 1; }

        echo "✅ All services ready"

    - name: Start application
      shell: bash
      run: |
        echo "🚀 Starting OpenAEV from Docker image..."
        docker run -d --name openaev-app --network host \
          -e SPRING_DATASOURCE_URL \
          -e SPRING_DATASOURCE_USERNAME \
          -e SPRING_DATASOURCE_PASSWORD \
          -e MINIO_ENDPOINT \
          -e MINIO_PORT \
          -e MINIO_ACCESS_KEY \
          -e MINIO_ACCESS_SECRET \
          -e ENGINE_URL \
          -e ENGINE_ENGINESELECTOR \
          -e OPENBAS_RABBITMQ_HOSTNAME \
          -e OPENAEV_ADMIN_EMAIL \
          -e OPENAEV_ADMIN_PASSWORD \
          -e OPENAEV_ADMIN_TOKEN \
          -e OPENAEV_ADMIN_ENCRYPTION_KEY \
          -e OPENAEV_ADMIN_ENCRYPTION_SALT \
          -e SPRING_PROFILES_ACTIVE \
          -e OPENAEV_APPLICATION_LICENSE \
          openaev:ci
        echo "✅ Container started"
    - name: Wait for application to be ready
      shell: bash
      run: |
        ADMIN_TOKEN="${OPENAEV_ADMIN_TOKEN}"

        echo "⏳ Waiting for API to be fully initialized (GET /api/me)..."
        APP_UP=false
        for i in $(seq 1 150); do
          # Check container is still running
          if ! docker inspect --format='{{.State.Running}}' openaev-app 2>/dev/null | grep -q true; then
            echo "❌ Container openaev-app stopped unexpectedly"
            echo "  Last 80 lines of container log:"
            docker logs --tail 80 openaev-app 2>&1 || true
            exit 1
          fi

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            http://localhost:8080/api/me \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" 2>/dev/null || echo -e "\n000")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ API fully ready (HTTP 200 on /api/me after ~$((i * 2))s)"
            break
          fi

          # Track when the app first starts responding
          if [ "$APP_UP" = false ] && [ "$HTTP_CODE" -ne 000 ]; then
            APP_UP=true
            echo "  Application responding (HTTP ${HTTP_CODE} after ~$((i * 2))s), waiting for full init..."
          fi

          if [ $((i % 15)) -eq 0 ]; then
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "  Attempt $i/150 — HTTP ${HTTP_CODE} — ${BODY}"
            echo "  Last 10 lines of container log:"
            docker logs --tail 10 openaev-app 2>&1 || echo "  (no container log)"
          fi

          if [ "$i" -eq 150 ]; then
            echo "❌ API /api/me not returning 200 after 300s (last HTTP ${HTTP_CODE})"
            echo "  Last 80 lines of container log:"
            docker logs --tail 80 openaev-app 2>&1 || echo "  (no container log)"
            exit 1
          fi
          sleep 2
        done

    - name: Start XTM Composer
      uses: ./.github/actions/start-xtm-composer
      with:
        openaev-url: http://localhost:8080

    - name: Run E2E tests (${{ inputs.project || inputs.browser }})
      run: |
        set -euo pipefail
        CONFIG="${{ inputs.playwright-config }}"
        PROJECT="${{ inputs.project || inputs.browser }}"
        ARGS="--config $CONFIG --project=setup --project=$PROJECT"

        FILTERS=""
        if [ "$SHARD_INCLUDES" = "catchall" ]; then
          SPECS=$(find tests_e2e -name '*.spec.ts' | sed 's|^\./||' | sort)
          if [ -n "$SHARD_EXCLUDES" ]; then
            EXCL_RE=$(printf '%s\n' "$SHARD_EXCLUDES" | grep -v '^[[:space:]]*$' | paste -sd'|' -)
            SPECS=$(printf '%s\n' "$SPECS" | grep -Ev "$EXCL_RE" || true)
          fi
          if [ -z "$SPECS" ]; then
            echo "⏭️ Catch-all shard: every spec is claimed by another shard — nothing to run"
            exit 0
          fi
          echo "🔄 Catch-all shard running:"
          printf '  %s\n' $SPECS
          FILTERS=$(printf '%s\n' "$SPECS" | paste -sd' ' -)
        elif [ -n "$SHARD_INCLUDES" ]; then
          FILTERS=$(printf '%s\n' "$SHARD_INCLUDES" | grep -v '^[[:space:]]*$' | paste -sd' ' -)
          echo "📋 Shard filters: $FILTERS"
        fi

        # auth.setup.ts must stay in scope or the setup project matches nothing
        # and every dependent project starts without a storageState.
        if [ -n "$FILTERS" ]; then
          ARGS="$ARGS tests_e2e/auth\.setup\.ts $FILTERS"
        fi

        yarn playwright test $ARGS
      shell: bash
      working-directory: openaev-front
      env:
        APP_URL: http://localhost:8080
        E2E_COVERAGE: "true"
        SHARD_INCLUDES: ${{ inputs.includes }}
        SHARD_EXCLUDES: ${{ inputs.excludes }}
    - name: Upload Playwright report (${{ inputs.browser }})
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report-${{ inputs.browser }}${{ inputs.artifact-suffix }}
        path: openaev-front/test-results/
    - name: Upload E2E coverage report (${{ inputs.browser }})
      if: ${{ !cancelled() && inputs.browser == 'chrome' }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-coverage-${{ inputs.browser }}${{ inputs.artifact-suffix }}
        path: openaev-front/test-results/coverage/
