name: E2E Tests
description: >
  Start service containers (PostgreSQL, Elasticsearch, RabbitMQ, MinIO),
  download and run the backend JAR, and run Playwright E2E tests.
  Requires job-level env vars: SPRING_DATASOURCE_URL,
  SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD,
  MINIO_ENDPOINT, MINIO_PORT, MINIO_ACCESS_KEY, MINIO_ACCESS_SECRET,
  ENGINE_URL, OPENBAS_RABBITMQ_HOSTNAME, OPENAEV_ADMIN_EMAIL,
  OPENAEV_ADMIN_PASSWORD, OPENAEV_ADMIN_TOKEN,
  OPENAEV_ADMIN_ENCRYPTION_KEY, OPENAEV_ADMIN_ENCRYPTION_SALT,
  SPRING_PROFILES_ACTIVE, GH_TOKEN.

inputs:
  playwright-config:
    description: "Playwright config file to use (relative to openaev-front/)."
    required: true
  browser:
    description: "Browser name (chrome, chromium, webkit, or firefox) — used for artifact naming and browser install."
    required: true
  artifact-name-prefix:
    description: >
      Base name for the uploaded Playwright report artifact. Override
      per caller when the matrix does NOT vary on `browser` (e.g.
      e2e-infra-tests varies on `arch` instead, with `browser` fixed to
      `chromium`), so the two callers' artifacts stay visually distinct
      in the Actions UI.
    required: false
    default: "playwright-report"
  artifact-suffix:
    description: >
      Suffix appended to the report artifact name to keep it unique per
      matrix leg when `browser` alone doesn't vary across the matrix
      (e.g. matrix.arch for e2e-infra-tests). Leave empty when `browser`
      already uniquely identifies the leg (e.g. e2e-tests).
    required: false
    default: ""
  fds-git-token:
    description: "PAT with read access to XTM-Foundation/filigran-design-system (secrets.FDS_GIT_TOKEN)."
    required: true

runs:
  using: composite
  steps:
    - name: Start all services (non-blocking)
      shell: bash
      run: |
        docker run -d --name pgsql \
          -p 5432:5432 \
          -e POSTGRES_USER=openaev \
          -e POSTGRES_PASSWORD=openaev \
          -e POSTGRES_DB=openaev \
          postgres:17-alpine \
          -c max_connections=1000
        docker run -d --name elasticsearch \
          -p 9200:9200 \
          -e discovery.type=single-node \
          -e xpack.security.enabled=false \
          -e "ES_JAVA_OPTS=-Xms2g -Xmx2g" \
          docker.elastic.co/elasticsearch/elasticsearch:8.18.3
        docker run -d --name rabbitmq \
          -p 5672:5672 \
          -p 15672:15672 \
          -e RABBITMQ_DEFAULT_USER=guest \
          -e RABBITMQ_DEFAULT_PASS=guest \
          rabbitmq:4.1-management
        docker run -d --name minio \
          -p 11000:9000 \
          -e MINIO_ROOT_USER=minioadmin \
          -e MINIO_ROOT_PASSWORD=minioadmin \
          minio/minio:RELEASE.2025-06-13T11-33-47Z server /data

        echo "🔍 Verifying containers started..."
        for name in pgsql elasticsearch rabbitmq minio; do
          if ! docker inspect --format='{{.State.Running}}' "$name" 2>/dev/null | grep -q true; then
            echo "❌ Container '$name' failed to start"
            docker logs "$name" 2>/dev/null || true
            exit 1
          fi
        done
        echo "✅ All containers started"

    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        java-version: "21"
        distribution: temurin
    - name: Set up Node.js 22.11
      uses: actions/setup-node@v7
      with:
        node-version: "22.23.1"
    - name: Install corepack
      run: npm install -g corepack
      shell: bash
    - name: Get Yarn cache directory
      id: yarn-cache-dir
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: openaev-front
    - name: Cache Yarn dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.yarn-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('openaev-front/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
    - uses: ./.github/actions/setup-fds-auth
      with:
        token: ${{ inputs.fds-git-token }}
    - name: Install frontend dependencies
      run: yarn install --immutable
      shell: bash
      working-directory: openaev-front
    - name: Cache Playwright browsers
      id: playwright-cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ inputs.browser }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('openaev-front/yarn.lock') }}
    - name: Install Playwright browser (${{ inputs.browser }})
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: yarn playwright install --with-deps ${{ inputs.browser }}
      shell: bash
      working-directory: openaev-front
    - name: Install Playwright system dependencies (cache hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: yarn playwright install-deps ${{ inputs.browser }}
      shell: bash
      working-directory: openaev-front

    - name: Wait for backend JAR artifact
      shell: bash
      run: |
        echo "⏳ Waiting for backend-package artifact (services booting in parallel)..."
        for i in $(seq 1 180); do
          # Check if backend-compile has failed — abort immediately
          COMPILE_CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
            --jq '[.jobs[] | select(.name | test("Backend Compile")) | .conclusion] | first' 2>/dev/null || echo "")
          if [ "$COMPILE_CONCLUSION" = "failure" ] || [ "$COMPILE_CONCLUSION" = "cancelled" ]; then
            echo "❌ Backend Compile job $COMPILE_CONCLUSION — aborting"
            exit 1
          fi
          NAMES=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '[.artifacts[].name]' 2>/dev/null || echo "[]")
          if echo "$NAMES" | grep -q '"openaev-api-jar"'; then
            echo "✅ Artifact available (after ~$((i * 5))s)"
            break
          fi
          if [ "$i" -eq 180 ]; then
            echo "❌ Timed out waiting for artifact (15 min)"
            exit 1
          fi
          echo "  Attempt $i/180 — not ready, retrying in 5s..."
          sleep 5
        done

    - name: Download backend JAR artifact
      uses: actions/download-artifact@v8
      with:
        name: openaev-api-jar
        path: openaev-api/target

    - name: Verify backend JAR
      shell: bash
      run: |
        if [ ! -f "openaev-api/target/openaev-api.jar" ]; then
          echo "❌ openaev-api.jar not found after download"
          ls -la openaev-api/target/ 2>/dev/null || echo "  target/ directory does not exist"
          exit 1
        fi
        JAR_SIZE=$(stat --format=%s openaev-api/target/openaev-api.jar 2>/dev/null || stat -f%z openaev-api/target/openaev-api.jar 2>/dev/null)
        if [ "$JAR_SIZE" -lt 1000 ] 2>/dev/null; then
          echo "❌ openaev-api.jar is suspiciously small ($JAR_SIZE bytes)"
          exit 1
        fi
        echo "✅ openaev-api.jar present ($JAR_SIZE bytes)"

    - name: Wait for services
      shell: bash
      run: |
        echo "⏳ Waiting for PostgreSQL..."
        for i in $(seq 1 30); do
          docker exec pgsql pg_isready -U openaev && break
          sleep 1
        done
        docker exec pgsql pg_isready -U openaev || { echo "❌ PostgreSQL failed to start"; exit 1; }

        echo "⏳ Waiting for Elasticsearch..."
        for i in $(seq 1 30); do
          curl -sf http://localhost:9200/_cluster/health && break
          sleep 2
        done
        curl -sf http://localhost:9200/_cluster/health || { echo "❌ Elasticsearch failed to start"; exit 1; }

        echo "⏳ Waiting for RabbitMQ..."
        for i in $(seq 1 30); do
          docker exec rabbitmq rabbitmq-diagnostics -q check_running 2>/dev/null && break
          sleep 2
        done
        docker exec rabbitmq rabbitmq-diagnostics -q check_running || { echo "❌ RabbitMQ failed to start"; exit 1; }

        echo "⏳ Waiting for MinIO..."
        for i in $(seq 1 30); do
          curl -sf http://localhost:11000/minio/health/live && break
          sleep 1
        done
        curl -sf http://localhost:11000/minio/health/live || { echo "❌ MinIO failed to start"; exit 1; }

        echo "✅ All services ready"

    - name: Start application
      run: java -jar openaev-api/target/openaev-api.jar > /tmp/openaev-app.log 2>&1 &
      shell: bash
    - name: Wait for application to be ready
      shell: bash
      run: |
        ADMIN_TOKEN="${OPENAEV_ADMIN_TOKEN}"

        echo "⏳ Waiting for API to be fully initialized (GET /api/me)..."
        APP_UP=false
        for i in $(seq 1 150); do
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            http://localhost:8080/api/me \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" 2>/dev/null || echo -e "\n000")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ API fully ready (HTTP 200 on /api/me after ~$((i * 2))s)"
            break
          fi

          # Track when the app first starts responding
          if [ "$APP_UP" = false ] && [ "$HTTP_CODE" -ne 000 ]; then
            APP_UP=true
            echo "  Application responding (HTTP ${HTTP_CODE} after ~$((i * 2))s), waiting for full init..."
          fi

          if [ $((i % 15)) -eq 0 ]; then
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "  Attempt $i/150 — HTTP ${HTTP_CODE} — ${BODY}"
            echo "  Last 10 lines of app log:"
            tail -10 /tmp/openaev-app.log 2>/dev/null || echo "  (no app log)"
          fi

          if [ "$i" -eq 150 ]; then
            echo "❌ API /api/me not returning 200 after 300s (last HTTP ${HTTP_CODE})"
            echo "  Last 80 lines of app log:"
            tail -80 /tmp/openaev-app.log 2>/dev/null || echo "  (no app log)"
            exit 1
          fi
          sleep 2
        done

    - name: Start XTM Composer
      uses: ./.github/actions/start-xtm-composer
      with:
        openaev-url: http://localhost:8080

    - name: Run E2E tests (${{ inputs.browser }})
      run: yarn playwright test --config ${{ inputs.playwright-config }}
      shell: bash
      working-directory: openaev-front
      env:
        APP_URL: http://localhost:8080
        E2E_COVERAGE: "true"
    - name: Upload Playwright report (${{ inputs.browser }})
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name-prefix }}-${{ inputs.browser }}${{ inputs.artifact-suffix != '' && format('-{0}', inputs.artifact-suffix) || '' }}
        path: openaev-front/test-results/
    - name: Upload E2E coverage report (${{ inputs.browser }})
      if: ${{ !cancelled() && inputs.browser == 'chrome' }}
      uses: actions/upload-artifact@v7
      with:
        name: playwright-coverage-${{ inputs.browser }}
        path: openaev-front/test-results/coverage/
