name: Spotless Check
description: Check Java code formatting with Spotless (Google Java Format)

inputs:
  no-cache:
    description: "true bypasses every cache in this action, to measure cold-cache CI cost"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v6
      with:
        java-version: "21"
        distribution: temurin
        cache: ${{ inputs.no-cache != 'true' && 'maven' || '' }}
    - name: Check formatting
      run: mvn -B -ntp spotless:check
      shell: bash
