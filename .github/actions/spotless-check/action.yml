name: Spotless Check
description: Check Java code formatting with Spotless (Google Java Format)

inputs:
  no-cache:
    description: "true bypasses every cache in this action; set by Nightly, which must not consume the shared cache quota"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v6
      with:
        java-version: "21"
        distribution: temurin

    # Read-only: backend-compile is the sole writer of maven-v1.
    - name: Restore Maven dependencies
      if: ${{ inputs.no-cache != 'true' }}
      uses: actions/cache/restore@v6
      with:
        path: ~/.m2/repository
        key: maven-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-v1-${{ runner.os }}-${{ runner.arch }}-

    - name: Check formatting
      run: mvn -B -ntp spotless:check
      shell: bash
