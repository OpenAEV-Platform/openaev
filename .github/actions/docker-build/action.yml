name: Docker Build & Validate (single platform)
description: >
  Build a single-platform Docker image using a multi-stage Dockerfile that
  builds frontend and backend from source.  Runs natively on the job runner
  (no QEMU emulation).  Validates the image locally and uploads the OCI
  archive as an artifact.  A separate merge step combines per-platform
  archives into the final multi-arch image.
  The calling job MUST run actions/checkout before this action.

inputs:
  tags:
    description: >
      Local image reference (single `name:tag`) recorded inside the OCI archive.
      It is never pushed, so it must stay unqualified.
    required: true
  labels:
    description: Docker image labels (from docker/metadata-action)
    required: false
    default: ""
  dockerfile:
    description: Path to the Dockerfile to build
    required: false
    default: "./Dockerfile"
  artifact-name:
    description: Name for the uploaded artifact (platform suffix is appended automatically)
    required: false
    default: "openaev-image"
  platform:
    description: "Target platform (e.g. linux/amd64 or linux/arm64)"
    required: false
    default: "linux/amd64"
  jar-path:
    description: Path to openaev-api.jar inside the image (for validation)
    required: false
    default: "/openaev-api.jar"
  cache-scope:
    description: GHA cache scope name for buildx layer caching
    required: false
    default: "docker-standard"
  download-release-assets:
    description: >
      Prepare the agent/implant binaries and catalog on this runner. Done inline
      rather than by downloading the release-assets artifact, so the build does
      not have to wait for the prepare-bundled-assets job to finish.
      Requires the calling job to check out with fetch-depth: 0.
    required: false
    default: "true"
  allow-registry:
    description: >
      Set to "false" when the calling workflow has no packages:write; the image
      is then handed to downstream jobs as an artifact only.
    required: false
    default: "true"
  fds-git-token:
    description: >
      PAT with read access to XTM-Foundation/filigran-design-system
      (secrets.FDS_GIT_TOKEN). openaev-front consumes that private repository as
      a direct git dependency, and the Dockerfiles built here run `yarn install`
      inside the image, so the credential must cross the image boundary as a
      BuildKit build secret — the runner's own git configuration does not.
      A composite action cannot read the `secrets` context, so every caller
      must pass this explicitly.
    required: true

outputs:
  digest:
    description: Docker image digest
    value: ${{ steps.docker-build.outputs.digest }}
  artifact-name:
    description: Full artifact name including platform suffix
    value: ${{ steps.names.outputs.artifact_name }}
  image_size_mb:
    description: Docker image size in MB
    value: ${{ steps.docker-validate.outputs.image_size_mb }}
  image_warning:
    description: Whether image size is suspiciously small
    value: ${{ steps.docker-validate.outputs.image_warning }}
  jar_in_image:
    description: Whether openaev-api.jar was found inside the image
    value: ${{ steps.docker-validate.outputs.jar_in_image }}
  java_version:
    description: Java version inside the image
    value: ${{ steps.docker-validate.outputs.java_version }}
  layer_count:
    description: Number of image layers
    value: ${{ steps.docker-validate.outputs.layer_count }}

runs:
  using: composite
  steps:
    - name: Compute artifact names
      id: names
      run: |
        PLATFORM="${{ inputs.platform }}"
        ARCH="${PLATFORM#*/}"
        echo "arch=${ARCH}" >> "$GITHUB_OUTPUT"
        echo "artifact_name=${{ inputs.artifact-name }}-${ARCH}" >> "$GITHUB_OUTPUT"
        echo "cache_scope=${{ inputs.cache-scope }}-${ARCH}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Prepare release assets (agents, implants, catalog)
      if: ${{ inputs.download-release-assets == 'true' }}
      uses: ./.github/actions/prepare-bundled-assets
      with:
        upload-artifact: "false"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Resolve CI registry
      id: registry
      uses: ./.github/actions/ci-registry
      with:
        allow-registry: ${{ inputs.allow-registry }}

    - name: Log in to GHCR
      id: registry-login
      if: ${{ steps.registry.outputs.available == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        GHCR_TOKEN: ${{ github.token }}
        GHCR_USERNAME: ${{ github.actor }}
      run: |
        set -o pipefail
        printf '%s' "$GHCR_TOKEN" \
          | timeout --kill-after=5s 15s \
              docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin

    - name: Record build start time
      id: build-timer
      run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      shell: bash

    # Only main writes the layer cache: a mode=max export costs ~6 min and blocks every
    # E2E job, while a PR-scoped cache is unreadable from any other PR. PRs read main's
    # cache through cache-from for free.
    #
    # Build the required artifact first. The optional registry handoff is a separate
    # best-effort copy so a GHCR outage cannot discard an otherwise valid OCI archive.
    - name: Build image (single-platform OCI archive)
      id: docker-build
      uses: docker/build-push-action@v7
      env:
        BUILDKIT_PROGRESS: plain
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platform }}
        push: false
        pull: true
        # Mounted for the single `RUN` that installs openaev-front's dependencies
        # and stored in no layer. See .github/actions/setup-fds-auth for the
        # runner-side equivalent.
        secrets: |
          fds_git_token=${{ inputs.fds-git-token }}
        outputs: |
          type=oci,dest=${{ steps.names.outputs.artifact_name }}.tar,name=${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        cache-from: type=gha,scope=${{ steps.names.outputs.cache_scope }}
        cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope={0}', steps.names.outputs.cache_scope) || '' }}

    - name: Push image to CI registry
      id: registry-push
      if: ${{ steps.registry.outputs.available == 'true' && steps.registry-login.outcome == 'success' }}
      shell: bash
      env:
        ARCHIVE: ${{ steps.names.outputs.artifact_name }}.tar
        IMAGE_REF: ${{ steps.registry.outputs.repository }}:${{ steps.registry.outputs.tag-prefix }}-${{ steps.names.outputs.artifact_name }}
      run: |
        echo "Publishing optional CI handoff image ${IMAGE_REF}..."
        if timeout --kill-after=5s 1m \
             skopeo copy "oci-archive:${ARCHIVE}" "docker://${IMAGE_REF}"; then
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "✅ CI handoff image published"
        else
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=CI registry unavailable::GHCR push failed; downstream jobs will use the workflow artifact."
        fi

    - name: Create CI registry marker
      id: registry-marker-file
      if: ${{ steps.registry-push.outputs.published == 'true' }}
      continue-on-error: true
      shell: bash
      env:
        ARTIFACT: ${{ steps.names.outputs.artifact_name }}
        ATTEMPT: ${{ github.run_attempt }}
      run: |
        mkdir -p ci-registry-marker
        printf '%s\n' "$ARTIFACT" > "ci-registry-marker/${ATTEMPT}-${ARTIFACT}"

    - name: Publish CI registry marker
      if: ${{ steps.registry-marker-file.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: ci-registry-${{ github.run_attempt }}-${{ steps.names.outputs.artifact_name }}
        path: ci-registry-marker/${{ github.run_attempt }}-${{ steps.names.outputs.artifact_name }}
        retention-days: 1
        compression-level: 0

    - name: Print build timing summary
      run: |
        END=$(date +%s)
        START=${{ steps.build-timer.outputs.start }}
        TOTAL=$((END - START))
        MINS=$((TOTAL / 60))
        SECS=$((TOTAL % 60))
        echo "══════════════════════════════════════════"
        echo "  ⏱️  Docker Build (${{ inputs.platform }}): ${MINS}m ${SECS}s"
        echo "══════════════════════════════════════════"
      shell: bash

    - name: Compress OCI archive
      run: |
        gzip ${{ steps.names.outputs.artifact_name }}.tar
        TAR_SIZE=$(stat --format=%s ${{ steps.names.outputs.artifact_name }}.tar.gz 2>/dev/null || stat -f%z ${{ steps.names.outputs.artifact_name }}.tar.gz 2>/dev/null)
        TAR_SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $TAR_SIZE / 1048576}")
        echo "${{ inputs.platform }} OCI archive (${TAR_SIZE_MB} MB compressed)"
      shell: bash

    - name: Validate Docker image
      id: docker-validate
      run: |
        ARTIFACT="${{ steps.names.outputs.artifact_name }}"
        JAR_PATH="${{ inputs.jar-path }}"
        VALIDATION_FAILED=0

        # Load the single-platform image into the local daemon for validation
        gunzip -k "${ARTIFACT}.tar.gz"
        skopeo copy \
          "oci-archive:${ARTIFACT}.tar" \
          "docker-daemon:${ARTIFACT}-validate:latest"
        rm -f "${ARTIFACT}.tar"
        IMAGE="${ARTIFACT}-validate:latest"

        echo "── Validating ${{ inputs.platform }} image ──"

        # Check image size
        IMAGE_SIZE=$(docker image inspect "$IMAGE" --format='{{.Size}}')
        IMAGE_SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $IMAGE_SIZE / 1048576}")
        echo "image_size=$IMAGE_SIZE"       >> "$GITHUB_OUTPUT"
        echo "image_size_mb=$IMAGE_SIZE_MB" >> "$GITHUB_OUTPUT"
        echo "  Image size: ${IMAGE_SIZE_MB} MB"

        if [ "$IMAGE_SIZE" -lt 209715200 ]; then
          echo "Docker image is only ${IMAGE_SIZE_MB} MB -- suspiciously small"
          echo "image_warning=true" >> "$GITHUB_OUTPUT"
        else
          echo "Docker image size looks healthy"
          echo "image_warning=false" >> "$GITHUB_OUTPUT"
        fi

        # Verify JAR is inside the image
        JAR_CHECK_ERR=$(mktemp)
        JAR_IN_IMAGE=$(docker run --rm --entrypoint ls "$IMAGE" -la "$JAR_PATH" 2>"$JAR_CHECK_ERR") || true
        if [ -z "$JAR_IN_IMAGE" ]; then
          echo "openaev-api.jar NOT found at $JAR_PATH"
          if [ -s "$JAR_CHECK_ERR" ]; then
            echo "  Error: $(cat "$JAR_CHECK_ERR")"
          fi
          JAR_DIR=$(dirname "$JAR_PATH")
          echo "  Listing $JAR_DIR contents for diagnostics:"
          docker run --rm --entrypoint ls "$IMAGE" -la "$JAR_DIR" 2>/dev/null \
            | sed 's/^/    /' || echo "    (could not list $JAR_DIR)"
          echo "jar_in_image=false" >> "$GITHUB_OUTPUT"
          VALIDATION_FAILED=1
        else
          echo "openaev-api.jar found inside Docker image"
          echo "  $JAR_IN_IMAGE"
          echo "jar_in_image=true" >> "$GITHUB_OUTPUT"
        fi
        rm -f "$JAR_CHECK_ERR"

        # Verify Java is available
        JAVA_VERSION=$(docker run --rm --entrypoint java "$IMAGE" -version 2>&1 | head -1) || true
        if [ -z "$JAVA_VERSION" ]; then
          echo "Java runtime not found inside Docker image"
          echo "java_version=NOT_FOUND" >> "$GITHUB_OUTPUT"
          VALIDATION_FAILED=1
        else
          echo "  Java: $JAVA_VERSION"
          echo "java_version=$JAVA_VERSION" >> "$GITHUB_OUTPUT"
        fi

        # Count layers
        LAYER_COUNT=$(docker image inspect "$IMAGE" --format='{{len .RootFS.Layers}}')
        echo "  Layers: $LAYER_COUNT"
        echo "layer_count=$LAYER_COUNT" >> "$GITHUB_OUTPUT"

        if [ "$VALIDATION_FAILED" -ne 0 ]; then
          echo "Docker image validation failed"
          exit 1
        fi
      shell: bash

    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.names.outputs.artifact_name }}
        path: ${{ steps.names.outputs.artifact_name }}.tar.gz
        retention-days: 1
        # Already gzipped — re-zipping costs CPU on both upload and download for ~0% gain
        compression-level: 0
