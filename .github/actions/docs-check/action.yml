name: Docs Check
description: >
  Builds the MkDocs site with the pinned dependencies, strict, then checks the result: every page
  and image made it into the site and the search index, every docs.openaev.io link in the API,
  model and front sources resolves to a page and anchor of the site, and so does every link of a
  docs page to another page of the docs. A docs move that breaks an in-app link or a link between
  pages fails here instead of on the site.
  The git-committers and git-revision-date-localized plugins only fill in contributors and dates,
  and git-committers calls the GitHub API for every page, so they stay off unless git-plugins is
  'true'. They need the full git history and a token.
  Reported through the Pipeline Gate as advisory, never blocking.

inputs:
  git-plugins:
    description: "'true' builds with the git plugins, as the deployed site does"
    required: false
    default: 'false'
  github-token:
    description: Token git-committers reads the commit authors with, when git-plugins is 'true'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.15'

    - name: Install documentation dependencies
      shell: bash
      working-directory: docs
      run: pip install --quiet --no-deps -r requirements.txt && pip check

    - name: Check for underscores in MkDocs URIs
      shell: bash
      working-directory: docs
      run: |
        echo "Checking mkdocs.yml for URIs (use '-' instead of '_')"
        INVALID_PATHS=$(grep '.md' mkdocs.yml | grep '_' | grep -Ev 'pymdownx\.superfences|md_in_html' || true)
        if [ -n "$INVALID_PATHS" ]; then
          echo "Invalid MkDocs URIs detected (use '-' instead of '_'):"
          echo "$INVALID_PATHS" | sed 's/^/ - /'
          exit 1
        fi
        echo "All MkDocs URIs are clean (no underscores)."

    - name: Build documentation
      shell: bash
      working-directory: docs
      env:
        DOCS_GIT_PLUGINS: ${{ inputs.git-plugins }}
        MKDOCS_GIT_COMMITTERS_APIKEY: ${{ inputs.github-token }}
      run: mkdocs build --strict --quiet

    # A strict build is green when a plugin breaks silently (selectolax 1.0.1 dropped every
    # image, #8602), so check the built site itself.
    - name: Check the built site
      shell: bash
      run: python3 .github/scripts/check-docs-site.py docs/site

    - name: Check in-app and docs page links
      shell: bash
      run: python3 .github/scripts/check-docs-links.py
