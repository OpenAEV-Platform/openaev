name: Prepare Bundled Assets
description: >
  Download agent/implant binaries from JFrog and patch the catalog version.
  The local file names carry the project version from `pom.xml`, which is the
  version the backend looks them up with.
  Callers that only need the assets on their own runner should set
  upload-artifact: false; exactly one job must upload for the artifact to exist.

inputs:
  upload-artifact:
    description: Upload the prepared assets as the shared `release-assets` artifact.
    required: false
    default: "true"
  working-directory:
    description: >
      Checkout to prepare the assets in. Scripts always come from this action's
      own checkout and the checkout must not hold symlinks, so the directory may
      hold untrusted code.
    required: false
    default: "."

runs:
  using: composite
  steps:
    # The steps below write into the checkout on the runner; a tracked symlink
    # would redirect those writes to any file outside it, such as an action.yml.
    - name: Reject symlinks
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        LINKS=$(git ls-files -s | awk '$1 == "120000"')
        if [ -n "$LINKS" ]; then
          echo "❌ Symlinks are not supported in the checkout:"
          echo "$LINKS"
          exit 1
        fi

    - name: Compute versions
      id: versions
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          TAG="${GITHUB_REF#refs/tags/}"
          echo "binary_version=${TAG}"   >> "$GITHUB_OUTPUT"
          echo "catalog_version=${TAG}"  >> "$GITHUB_OUTPUT"
        else
          echo "binary_version=latest"   >> "$GITHUB_OUTPUT"
          echo "catalog_version=rolling"  >> "$GITHUB_OUTPUT"
        fi

        # The backend resolves the bundled files with its own version
        # (info.app.version = project.version). The latest git tag is not a safe
        # source: it falls back to an older release when a release tag is removed.
        # Parsed without Maven because the checkout may hold untrusted code.
        LOCAL_VERSION="$(yq -p xml -oy '.project.version // ""' pom.xml)"
        # The version ends up in file paths, so reject anything but a plain version
        if [[ ! "$LOCAL_VERSION" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
          echo "❌ Could not read a valid project version from pom.xml: '${LOCAL_VERSION}'"
          exit 1
        fi
        echo "local_version=${LOCAL_VERSION}" >> "$GITHUB_OUTPUT"

    - name: Download agent & implant binaries
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        BINARY_VERSION="${{ steps.versions.outputs.binary_version }}"
        LOCAL_VERSION="${{ steps.versions.outputs.local_version }}"

        if ! bash "$GITHUB_ACTION_PATH/../../../scripts/download-binaries.sh" "$BINARY_VERSION" "$LOCAL_VERSION"; then
          echo "❌ download-binaries.sh failed"
          exit 1
        fi

        AGENT_COUNT=$(find openaev-api/src/main/resources/agents/ -type f 2>/dev/null | wc -l)
        IMPLANT_COUNT=$(find openaev-api/src/main/resources/implants/ -type f 2>/dev/null | wc -l)
        echo "📦 Downloaded $AGENT_COUNT agent(s) and $IMPLANT_COUNT implant(s)"
        if [ "$AGENT_COUNT" -eq 0 ] && [ "$IMPLANT_COUNT" -eq 0 ]; then
          echo "⚠️ Warning: No agent or implant binaries were downloaded"
        fi

    - name: Patch catalog version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        CATALOG_FILE=openaev-api/src/main/resources/catalog/catalog-integrators.json
        CATALOG_VERSION="${{ steps.versions.outputs.catalog_version }}"

        if [ ! -f "$CATALOG_FILE" ]; then
          echo "❌ Catalog file not found: $CATALOG_FILE"
          ls -la openaev-api/src/main/resources/catalog/ 2>/dev/null || echo "  catalog/ directory does not exist"
          exit 1
        fi

        if ! jq --arg ver "$CATALOG_VERSION" \
          '.contracts[].container_version = $ver | .version = $ver' \
          "$CATALOG_FILE" > catalog.tmp; then
          echo "❌ jq failed to patch catalog file (invalid JSON?)"
          exit 1
        fi

        if [ ! -s "catalog.tmp" ]; then
          echo "❌ jq produced empty output"
          exit 1
        fi

        if ! jq empty catalog.tmp 2>/dev/null; then
          echo "❌ Patched catalog file is not valid JSON"
          exit 1
        fi

        mv catalog.tmp "$CATALOG_FILE"
        echo "✅ Catalog version patched to '$CATALOG_VERSION'"

    - name: Upload release assets
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v7
      with:
        name: release-assets
        path: |
          ${{ inputs.working-directory }}/openaev-api/src/main/resources/agents/
          ${{ inputs.working-directory }}/openaev-api/src/main/resources/implants/
          ${{ inputs.working-directory }}/openaev-api/src/main/resources/catalog/
