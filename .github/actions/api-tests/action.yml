name: API Tests
description: >
  Start service containers (PostgreSQL, Elasticsearch, RabbitMQ, Silo),
  download pre-compiled artifacts, and run API tests for a single shard.
  Requires job-level env vars:
  SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME,
  SPRING_DATASOURCE_PASSWORD, MINIO_ENDPOINT, MINIO_PORT, ENGINE_URL,
  OPENBAS_RABBITMQ_HOSTNAME, GH_TOKEN.

inputs:
  includes:
    description: >
      "shardfile" to read .github/shards/api-<shard>.txt, "catchall" to run
      everything no shard file claims, or literal multi-line Surefire patterns.
    required: true
  excludes:
    description: "Surefire test exclude patterns (multi-line, optional)"
    required: false
    default: ""
  shard:
    description: Shard number (selects the shard file and names artifacts)
    required: true
  shard-name:
    description: Shard display name
    required: true
  search-engine:
    description: "Search engine type: elasticsearch or opensearch"
    required: false
    default: "elasticsearch"
  search-engine-image:
    description: "Docker image for the search engine (default from openaev-dev/docker-compose.yml)"
    required: false
    default: ""
  artifact-suffix:
    description: "Suffix appended to artifact names to avoid conflicts (e.g. '-opensearch')"
    required: false
    default: ""
  tenant-mode:
    description: >
      Multi-tenancy v2 shadow mode. Empty (default) leaves the run exactly as it was: the test
      profile declares no active tables, so the statement inspector never fires. "production" runs
      the suite under the active-tables list main ships, which catches a regression on a table that
      is already live. "all" runs it with every strict tenant table active except the self-isolated
      ones, which surfaces what activating the rest would break. Both turn the fail-closed
      detector on, so an unscoped production read fails its test instead of silently returning zero
      rows.
      A shadow shard reports a true pass or fail, and cannot fail the workflow: the matrix entry
      carries continue_on_error. What those runs currently fail on is written down in
      .github/tenant-shadow-distance.md.
      Scope, exactly: the list is a JVM system property, and a class carrying
      @TestPropertySource(properties = "openaev.tenant.active-tables=...") keeps its own narrower
      list, because inlined test properties win over system properties. Those classes are the
      isolation suites, which already run with their table active; the shadow's new information
      comes from every other class, which has never run under activation. Making the shadow win over
      per-class activation needs a context customizer and is tracked separately.
    required: false
    default: ""
  no-cache:
    description: "true bypasses every cache in this action; set by Nightly, which must not consume the shared cache quota"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Start service containers
      uses: ./.github/actions/start-dev-services
      with:
        search-engine: ${{ inputs.search-engine }}
        search-engine-image: ${{ inputs.search-engine-image }}

    - name: Set up Java 21
      uses: actions/setup-java@v6
      with:
        java-version: "21"
        distribution: temurin

    - name: Restore API test Maven dependencies
      id: maven-cache
      if: ${{ inputs.no-cache != 'true' }}
      uses: actions/cache/restore@v6
      with:
        path: ~/.m2/repository
        key: maven-api-tests-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-api-tests-v2-${{ runner.os }}-${{ runner.arch }}-

    - name: Wait for compiled artifacts
      uses: ./.github/actions/wait-for-artifacts
      with:
        artifact-names: |
          backend-compiled
          api-build-output
        producer-job-names: Backend Compile
        wait-seconds: "600"

    - name: Clear cached OpenAEV artifacts
      shell: bash
      run: |
        # Remove cached artifacts before extracting this run's compiled output.
        rm -rf ~/.m2/repository/io/openaev/

    - name: Download backend-compiled artifact
      uses: ./.github/actions/download-artifact-retry
      with:
        name: backend-compiled
        path: ~/.m2/repository/io/openaev/

    - name: Download api-build-output artifact
      uses: ./.github/actions/download-artifact-retry
      with:
        name: api-build-output
        path: openaev-api/target

    - name: Verify downloaded artifacts
      shell: bash
      run: |
        echo "🔍 Listing openaev-api/target/ (top 5 levels):"
        find openaev-api/target/ -maxdepth 5 -type d 2>/dev/null | head -40 || echo "  openaev-api/target/ does not exist"
        echo "---"

        # Artifact extraction can nest openaev-api/target; flatten it.
        if [ -d "openaev-api/target/openaev-api/target" ]; then
          echo "⚠️ Detected double-nested artifact path, flattening..."
          cp -rn openaev-api/target/openaev-api/target/* openaev-api/target/ 2>/dev/null || true
          rm -rf openaev-api/target/openaev-api
          echo "✅ Flattened double-nested paths"
        fi

        # `head` can return SIGPIPE under bash -eo pipefail.
        MVN_JARS=$(find ~/.m2/repository/io/openaev/ -name '*.jar' 2>/dev/null | head -5 || true)
        if [ -z "$MVN_JARS" ]; then
          echo "❌ No Maven JARs found in ~/.m2/repository/io/openaev/"
          echo "🔍 Listing ~/.m2/repository/io/openaev/ (top 4 levels):"
          find ~/.m2/repository/io/openaev/ -maxdepth 4 2>/dev/null | head -30 || true
          exit 1
        fi
        MVN_JAR_COUNT=$(find ~/.m2/repository/io/openaev/ -name '*.jar' 2>/dev/null | wc -l || true)
        echo "✅ Maven artifacts found ($MVN_JAR_COUNT JARs)"

        if [ ! -d "openaev-api/target/classes" ]; then
          echo "❌ openaev-api/target/classes/ directory does not exist"
          echo "🔍 Actual contents of openaev-api/target/:"
          ls -la openaev-api/target/ 2>/dev/null || echo "  target/ directory does not exist"
          exit 1
        fi
        echo "✅ Compiled classes present"

        TEST_CLASS_COUNT=$(find openaev-api/target/test-classes -name '*Test.class' 2>/dev/null | wc -l || true)
        echo "  🔍 Found $TEST_CLASS_COUNT *Test.class file(s) in test-classes/"
        if [ "$TEST_CLASS_COUNT" -eq 0 ]; then
          echo "❌ No test classes found in openaev-api/target/test-classes/"
          echo "🔍 Actual contents of openaev-api/target/test-classes/ (top 6 levels):"
          find openaev-api/target/test-classes -maxdepth 6 2>/dev/null | head -40 || echo "  test-classes/ does not exist"
          echo "🔍 Sample .class files (any name):"
          find openaev-api/target/test-classes -name '*.class' 2>/dev/null | head -10 || echo "  none"
          exit 1
        fi
        echo "✅ Test classes found ($TEST_CLASS_COUNT *Test.class files)"

    - name: Wait for services
      shell: bash
      run: |
        echo "⏳ Waiting for PostgreSQL..."
        for i in $(seq 1 30); do
          docker exec pgsql pg_isready -U openaev && break
          sleep 1
        done
        docker exec pgsql pg_isready -U openaev || { echo "❌ PostgreSQL failed to start"; exit 1; }

        echo "⏳ Waiting for ${{ inputs.search-engine }}..."
        for i in $(seq 1 30); do
          curl -sf http://localhost:9200/_cluster/health && break
          sleep 2
        done
        curl -sf http://localhost:9200/_cluster/health || { echo "❌ ${{ inputs.search-engine }} failed to start"; exit 1; }

        echo "⏳ Waiting for RabbitMQ..."
        for i in $(seq 1 30); do
          docker exec rabbitmq rabbitmq-diagnostics -q check_running 2>/dev/null && break
          sleep 2
        done
        docker exec rabbitmq rabbitmq-diagnostics -q check_running || { echo "❌ RabbitMQ failed to start"; exit 1; }

        echo "⏳ Waiting for Silo..."
        for i in $(seq 1 30); do
          curl -sf http://localhost:11000/minio/health/live && break
          sleep 1
        done
        curl -sf http://localhost:11000/minio/health/live || { echo "❌ Silo failed to start"; exit 1; }

        echo "✅ All services ready"

    - name: Prepare test suite
      id: suite
      shell: bash
      env:
        SHARD_INCLUDES: ${{ inputs.includes }}
        SHARD_EXCLUDES: ${{ inputs.excludes }}
        SHARD: ${{ inputs.shard }}
      run: |
        set -euo pipefail
        SHARD_DIR=.github/shards

        if [ "$SHARD_INCLUDES" = "catchall" ]; then
          # Derive catch-all exclusions from shard files to avoid gaps.
          cat "$SHARD_DIR"/api-*.txt > /tmp/surefire-excludes.txt
          printf '%s\n' '**/*$*' >> /tmp/surefire-excludes.txt
          echo "surefire_arg=-Dsurefire.excludesFile=/tmp/surefire-excludes.txt" >> "$GITHUB_OUTPUT"
          echo "🔄 Catch-all shard: everything not claimed by $SHARD_DIR/api-*.txt"
          cat /tmp/surefire-excludes.txt
        elif [ "$SHARD_INCLUDES" = "shardfile" ]; then
          SHARD_FILE="$SHARD_DIR/api-${SHARD}.txt"
          if [ ! -f "$SHARD_FILE" ]; then
            echo "❌ Shard file not found: $SHARD_FILE"
            ls -la "$SHARD_DIR" 2>/dev/null || echo "  $SHARD_DIR does not exist"
            exit 1
          fi
          cp "$SHARD_FILE" /tmp/surefire-includes.txt
          echo "surefire_arg=-Dsurefire.includesFile=/tmp/surefire-includes.txt" >> "$GITHUB_OUTPUT"
          echo "📋 Shard $SHARD include patterns (from $SHARD_FILE):"
          cat /tmp/surefire-includes.txt
        else
          echo "$SHARD_INCLUDES" > /tmp/surefire-includes.txt
          ARGS="-Dsurefire.includesFile=/tmp/surefire-includes.txt"
          if [ -n "$SHARD_EXCLUDES" ]; then
            echo "$SHARD_EXCLUDES" > /tmp/surefire-excludes.txt
            printf '%s\n' '**/*$*' >> /tmp/surefire-excludes.txt
            ARGS="$ARGS -Dsurefire.excludesFile=/tmp/surefire-excludes.txt"
            echo "📋 Include patterns:"
            cat /tmp/surefire-includes.txt
            echo "🚫 Exclude patterns:"
            cat /tmp/surefire-excludes.txt
          else
            echo "📋 Include patterns:"
            cat /tmp/surefire-includes.txt
          fi
          echo "surefire_arg=$ARGS" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve multi-tenancy shadow mode
      id: tenant
      shell: bash
      env:
        MODE: ${{ inputs.tenant-mode }}
      run: |
        if [ -z "$MODE" ]; then
          echo "args=" >> "$GITHUB_OUTPUT"
          echo "ℹ️ tenant shadow: off (test profile, inspector inert)"
          exit 0
        fi
        case "$MODE" in
          production)
            # Read the list main ships rather than restating it here, so the two can never drift.
            PROPS=openaev-api/src/main/resources/application.properties
            # Exactly one definition, or fail: sed prints every match, so a second definition would
            # make LIST multi-line and silently corrupt the -D below.
            COUNT=$(grep -c '^openaev\.tenant\.active-tables=' "$PROPS" || true)
            if [ "$COUNT" != "1" ]; then
              echo "❌ expected exactly one openaev.tenant.active-tables in $PROPS, found $COUNT"; exit 1
            fi
            LIST=$(sed -n 's/^openaev\.tenant\.active-tables=//p' "$PROPS")
            if [ -z "$LIST" ]; then
              echo "❌ openaev.tenant.active-tables is empty in $PROPS"; exit 1
            fi
            ;;
          all)
            # TenantTables.ALL_STRICT: every strict tenant table, no dual-scope one.
            LIST='*'
            ;;
          *) echo "❌ unknown tenant-mode: $MODE (expected '', 'production' or 'all')"; exit 1 ;;
        esac
        echo "🔐 tenant shadow: mode=$MODE"
        echo "   active-tables=$LIST"
        # No maven.test.failure.ignore here, on purpose. A shadow shard must report a true pass or
        # fail, and it already cannot fail the workflow: the matrix entry carries continue_on_error,
        # which keeps a red job out of the run conclusion. Measured, not assumed: the runs of 13 and
        # 14 September had every shadow shard red, the Pipeline Gate green and the run green. Ignoring
        # the failures instead made the job green whatever happened, which is the one state nobody can
        # read. Every later step in this action is guarded by !cancelled() or failure(), so they all
        # still run when the test step is red.
        # Single-quoted so '*' reaches the JVM instead of being glob-expanded by the shell below.
        # The write-attribution detector rides the same shadow run as the fail-closed one.
        echo "args=-Dopenaev.tenant.active-tables='$LIST' -Dopenaev.failclosed.detector=on -Dopenaev.writeattr.detector=on" >> "$GITHUB_OUTPUT"

    - name: Run API tests (shard ${{ inputs.shard }} — ${{ inputs.shard-name }})
      id: run-tests
      shell: bash
      # Run test goals directly to avoid recompiling downloaded classes.
      run: |
        mvn -B -ntp -pl openaev-api \
          initialize surefire:test@default-test jacoco:report@report \
          ${{ steps.suite.outputs.surefire_arg }} \
          ${{ steps.tenant.outputs.args }}

    - name: Remove compiled OpenAEV artifacts before caching
      if: ${{ !cancelled() && inputs.no-cache != 'true' && github.ref == 'refs/heads/main' && inputs.shard == '1' && steps.maven-cache.outputs.cache-hit != 'true' }}
      run: rm -rf ~/.m2/repository/io/openaev/
      shell: bash

    # A single main-branch shard writes the shared dependency cache.
    # Resolved dependencies are still saved after test failures.
    - name: Save API test Maven dependencies
      if: ${{ !cancelled() && inputs.no-cache != 'true' && github.ref == 'refs/heads/main' && inputs.shard == '1' && steps.maven-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: ~/.m2/repository
        key: maven-api-tests-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}

    - name: Diagnose surefire dump files (shard ${{ inputs.shard }} — ${{ inputs.shard-name }})
      if: ${{ failure() && steps.run-tests.outcome == 'failure' }}
      shell: bash
      run: |
        REPORTS_DIR=openaev-api/target/surefire-reports
        shopt -s nullglob
        DUMPS=("$REPORTS_DIR"/*.dump "$REPORTS_DIR"/*.dumpstream)
        if [ ${#DUMPS[@]} -eq 0 ]; then
          echo "ℹ️ No surefire dump files found in $REPORTS_DIR"
        else
          for f in "${DUMPS[@]}"; do
            echo "::group::📄 $f"
            cat "$f"
            echo "::endgroup::"
          done
        fi

    - name: Summarise the multi-tenancy shadow run
      if: ${{ !cancelled() && inputs.tenant-mode != '' }}
      shell: bash
      env:
        MODE: ${{ inputs.tenant-mode }}
        SHARD: ${{ inputs.shard-name }}
        RUN_OUTCOME: ${{ steps.run-tests.outcome }}
      run: |
        REPORTS=openaev-api/target/surefire-reports
        S="$GITHUB_STEP_SUMMARY"
        # One tab-separated line per shard, collected by the tenant shadow verdict job into a single
        # table on the run page. Fields: mode, shard, verdict, tests, failures, errors, skipped, note.
        VERDICT_FILE=openaev-api/target/tenant-shadow-verdict.tsv
        {
          echo "## Tenant shadow \`$MODE\`, shard $SHARD"
          echo
          echo "_Classes carrying their own \`@TestPropertySource\` activation keep it: inlined test"
          echo "properties win over the system property this mode sets. Those are the isolation suites,"
          echo "already running with their table active._"
          echo
        } >> "$S"
        # Two shapes of broken instrument would otherwise read as a pass: no surefire report at all
        # (the suite never ran), and a Spring context that fails to load. Both are reported as
        # NO RESULT, which is neither a pass nor a plain test failure, and both raise a warning
        # annotation. This step never exits non-zero: the shard's own verdict is the Maven step's
        # result, and the collected verdict is the tenant shadow verdict job's.
        if [ ! -d "$REPORTS" ] || [ -z "$(find "$REPORTS" -maxdepth 1 -name '*.txt' -print -quit 2>/dev/null)" ]; then
          echo "::warning title=Tenant shadow $MODE (shard $SHARD)::No surefire report: the shadow suite did not run. This is not a pass."
          echo "**NO RESULT**: no surefire report, the suite did not start." >> "$S"
          printf '%s\t%s\tNO RESULT\t0\t0\t0\t0\t%s\n' "$MODE" "$SHARD" "no surefire report, the suite did not start" > "$VERDICT_FILE"
          exit 0
        fi

        # Count the context-load failures across the shard's reports; each is a test that errored
        # because the Spring context never came up. || true: grep exits 1 on no match under pipefail.
        CTX=$(grep -ho 'Failed to load ApplicationContext' "$REPORTS"/*.txt 2>/dev/null | wc -l | tr -d ' ' || true)
        if [ "${CTX:-0}" -gt 0 ]; then
          echo "::warning title=Tenant shadow $MODE (shard $SHARD)::Spring context failed to load ($CTX x 'Failed to load ApplicationContext'). Every affected test errored."
        fi

        # Totals, summed over the shard's classes. Read from the reports, never from a grep of the
        # build log: Maven writes ANSI colour codes inside its counters, so a grep there is vacuous.
        read -r TESTS FAILURES ERRORS SKIPPED <<< "$(awk -F'[:,]' '/^Tests run:/ {t+=$2; f+=$4; e+=$6; s+=$8}
          END {printf "%d %d %d %d\n", t, f, e, s}' "$REPORTS"/*.txt 2>/dev/null)" || true
        TESTS=${TESTS:-0}; FAILURES=${FAILURES:-0}; ERRORS=${ERRORS:-0}; SKIPPED=${SKIPPED:-0}

        # The verdict. A shard passes only when surefire ran, reported tests, and none of them went
        # red. The Maven step's own outcome is part of it: a build that died before surefire finished
        # leaves partial reports that would otherwise read as a clean run.
        NOTE=""
        if [ "$FAILURES" -gt 0 ] || [ "$ERRORS" -gt 0 ]; then
          RESULT=FAIL
        elif [ "$TESTS" -eq 0 ]; then
          RESULT="NO RESULT"; NOTE="surefire reported zero tests"
        elif [ "$RUN_OUTCOME" != "success" ]; then
          RESULT="NO RESULT"; NOTE="the Maven step did not succeed ($RUN_OUTCOME) although no test is red"
        else
          RESULT=PASS
        fi
        if [ "${CTX:-0}" -gt 0 ]; then
          NOTE="${NOTE:+$NOTE; }$CTX Spring context load failures"
        fi
        printf '%s\t%s\t%s\t%d\t%d\t%d\t%d\t%s\n' \
          "$MODE" "$SHARD" "$RESULT" "$TESTS" "$FAILURES" "$ERRORS" "$SKIPPED" "$NOTE" > "$VERDICT_FILE"

        {
          echo "### Verdict: $RESULT"
          echo
          echo "| Tests | Failures | Errors | Skipped |"
          echo "|---|---|---|---|"
          echo "| $TESTS | $FAILURES | $ERRORS | $SKIPPED |"
          echo
        } >> "$S"
        if [ "$RESULT" != "PASS" ]; then
          echo "::warning title=Tenant shadow $MODE (shard $SHARD)::$RESULT: $FAILURES failures and $ERRORS errors over $TESTS tests.${NOTE:+ $NOTE.}"
        fi

        # Unscoped production reads the fail-closed gate refused. Each is a path that would return
        # zero rows in production once its table is active.
        SIGS=$(awk '
            /Fail-closed: production code read/ { inblock = 1; next }
            inblock && /^Scope the path/ { inblock = 0; next }
            inblock && /io\.openaev\./ {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "")
              if ($0 ~ /^io\.openaev\.[A-Za-z0-9_.$]+$/) print
            }
          ' "$REPORTS"/*.txt 2>/dev/null | sort -u)
        if [ -n "$SIGS" ]; then
          {
            echo "### Unscoped production reads ($(echo "$SIGS" | wc -l))"
            echo
            echo "Scope each one, or waive it in \`failclosed-baseline.txt\` with a reason."
            echo
            echo '```'
            echo "$SIGS"
            echo '```'
            echo
          } >> "$S"
        else
          echo "No unscoped production read." >> "$S"
          echo >> "$S"
        fi

        # Wrong-tenant production writes the write-attribution gate refused: a tenant_id written
        # outside the request or job scope, or a null one on a strict table. Same extraction shape as
        # the block above; a signature is "<table> <DEFAULT|OTHER|NULL> <entry frame>".
        WSIGS=$(awk '
            /Write-attribution: production code wrote/ { inblock = 1; next }
            inblock && /^Attribute the write/ { inblock = 0; next }
            inblock {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "")
              if ($0 ~ /^[a-z_]+ (DEFAULT|OTHER|NULL) [A-Za-z0-9_.$()]+$/) print
            }
          ' "$REPORTS"/*.txt 2>/dev/null | sort -u)
        if [ -n "$WSIGS" ]; then
          {
            echo "### Wrong-tenant production writes ($(echo "$WSIGS" | wc -l))"
            echo
            echo "Attribute each one from the request's write scope, or waive it in \`writeattr-baseline.txt\` with a reason."
            echo
            echo '```'
            echo "$WSIGS"
            echo '```'
            echo
          } >> "$S"
        else
          echo "No wrong-tenant production write." >> "$S"
          echo >> "$S"
        fi

        # The write-attribution gate writes its per-JVM waiver report next to the surefire reports.
        # A shard sees only its own classes, so it can only say what it did not produce; a waiver
        # is stale only when no shard produced it.
        WAIVERS="$REPORTS/writeattr-waivers.txt"
        if [ -f "$WAIVERS" ]; then
          NOTPRODUCED=$(grep -c '^not-produced ' "$WAIVERS" || true)
          {
            echo "$(head -n1 "$WAIVERS" | sed 's/^# //'); $NOTPRODUCED not produced by this shard (stale only if no shard produces it)."
            echo
          } >> "$S"
        fi

        # Writes made under a deny-all scope (no v2 scope set at all): reported by the gate, never
        # gated, since sweeping the current flood of test-driven signatures is its own follow-up.
        # This file's name is WriteAttrGateExtension.EMPTY_SCOPE_REPORT_FILE verbatim, pinned by
        # WriteAttrSummaryMarkerTest; the header text itself is read back from the file, not
        # hardcoded here, so it needs no matching pin.
        EMPTYSCOPE="$REPORTS/writeattr-emptyscope.txt"
        if [ -f "$EMPTYSCOPE" ]; then
          {
            echo "### Empty-scope writes ($(head -n1 "$EMPTYSCOPE" | sed 's/^# //'))"
            echo
            echo "Writes made under a deny-all scope (no v2 scope set): reported, never gated, expected"
            echo "to be numerous today because tests drive production services directly, tracked by its"
            echo "own sweep."
            echo
            echo '```'
            tail -n +2 "$EMPTYSCOPE"
            echo '```'
            echo
          } >> "$S"
        fi

        # Statements whose JDBC warning chain could not be read: the trigger may have raised a
        # [WRITEATTR] warning on any of them and the listener never saw it. This file's name is
        # WriteAttrGateExtension.INSTRUMENTATION_FAILURE_REPORT_FILE verbatim; the header text is
        # read back from the file, not hardcoded here.
        INSTRFAIL="$REPORTS/writeattr-instrumentation-failures.txt"
        if [ -f "$INSTRFAIL" ] && [ "$(grep -c '^' "$INSTRFAIL")" -gt 1 ]; then
          echo "::warning title=Tenant shadow $MODE (shard $SHARD)::$(head -n1 "$INSTRFAIL" | sed 's/^# //'). The detector may have missed a wrong-tenant write on each of those statements."
          {
            echo "### $(head -n1 "$INSTRFAIL" | sed 's/^# //')"
            echo
            echo "A broken bridge from the trigger to the listener, not a pass."
            echo
            echo '```'
            tail -n +2 "$INSTRFAIL"
            echo '```'
            echo
          } >> "$S"
        fi

        # A shard whose trigger could not be installed ran with no write-attribution signal at all:
        # its Spring contexts failed to refresh on the install and every later context retried.
        # Loud, never a job failure (same rule as the context-load warning above).
        if grep -q 'cannot install the write-attribution trigger' "$REPORTS"/* 2>/dev/null; then
          echo "::warning title=Tenant shadow $MODE (shard $SHARD)::The write-attribution trigger could not be installed: this shard reports no wrong-tenant write, which is not a pass."
          echo "The write-attribution trigger could not be installed in this shard: no write signal." >> "$S"
          echo >> "$S"
        fi

        # Everything else that went red: the exception type is what tells a refused query shape from
        # a GROUP BY error from a plain assertion.
        # || true: a clean run has no failure line, grep exits 1, and the composite action's shell
        # is `bash -e -o pipefail`, so without this a green shadow run would fail its own summary.
        OTHER=$(grep -h '<<< \(FAILURE\|ERROR\)!' -A1 "$REPORTS"/*.txt 2>/dev/null \
          | grep -oE '^[a-z][a-zA-Z0-9.]*\.[A-Za-z0-9_]*(Exception|Error)' | sort | uniq -c | sort -rn || true)
        if [ -n "$OTHER" ]; then
          {
            echo "### Failures by exception type"
            echo
            echo '```'
            echo "$OTHER"
            echo '```'
          } >> "$S"
        fi

    - name: Upload the tenant shadow verdict
      # One line per shadow shard, read by the tenant shadow verdict job, which turns the whole set
      # into a single table on the run page. if-no-files-found: error, because a missing verdict is
      # exactly the silence this instrument exists to remove.
      if: ${{ !cancelled() && inputs.tenant-mode != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: tenant-shadow-verdict-${{ inputs.tenant-mode }}-${{ inputs.shard-name }}
        path: openaev-api/target/tenant-shadow-verdict.tsv
        if-no-files-found: error

    - name: Verify JaCoCo exec data
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        EXEC_FILE="openaev-api/target/jacoco.exec"
        if [ -f "$EXEC_FILE" ]; then
          SIZE=$(stat --format=%s "$EXEC_FILE" 2>/dev/null || stat -f%z "$EXEC_FILE" 2>/dev/null)
          echo "✅ $EXEC_FILE exists ($SIZE bytes)"
        else
          echo "❌ $EXEC_FILE not found after test run"
          echo "   Test step outcome: ${{ steps.run-tests.outcome }}"
          echo "   Contents of openaev-api/target/:"
          ls -la openaev-api/target/ 2>/dev/null || echo "   directory does not exist"
          echo "   Surefire reports:"
          ls -la openaev-api/target/surefire-reports/ 2>/dev/null || echo "   no surefire-reports/"
          exit 1
        fi
    - name: Upload JaCoCo exec data
      # A shadow run re-executes tests the normal shards already covered, so its exec data would be
      # merged twice into the project's coverage. It is an instrument, not a coverage contributor.
      if: ${{ !cancelled() && inputs.tenant-mode == '' }}
      uses: actions/upload-artifact@v7
      with:
        name: jacoco-exec-shard-${{ inputs.shard }}${{ inputs.artifact-suffix }}
        path: openaev-api/target/jacoco.exec
        if-no-files-found: error
