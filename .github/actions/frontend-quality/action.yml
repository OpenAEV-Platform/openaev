name: Frontend Quality & Unit Tests
description: >
  Run TypeScript checks, ESLint, i18n validation, and Vitest unit tests.
  Uploads coverage report as an artifact.

inputs:
  no-cache:
    description: "true bypasses every cache in this action; set by Nightly, which must not consume the shared cache quota"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install dependencies
      uses: ./.github/actions/yarn-install
      with:
        no-cache: ${{ inputs.no-cache }}
    - name: TypeScript check
      run: yarn check-ts
      shell: bash
      working-directory: openaev-front
    - name: Check licenses
      run: yarn check-licenses
      shell: bash
      working-directory: openaev-front
    - name: Run ESLint
      run: yarn lint
      shell: bash
      working-directory: openaev-front
    - name: Check i18n translations
      run: yarn i18n-checker
      shell: bash
      working-directory: openaev-front
    - name: Run unit tests
      run: yarn test -- --coverage
      shell: bash
      working-directory: openaev-front
      env:
        NODE_OPTIONS: --max_old_space_size=8192
    - name: Upload frontend coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: vitest-coverage
        path: openaev-front/coverage/
