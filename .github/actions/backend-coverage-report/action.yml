name: Backend Coverage Report
description: >
  Merge the JaCoCo exec files of every API test shard and build the backend coverage report at
  openaev-api/target/site/jacoco/jacoco.xml. Reuses the API build output from Backend Compile
  rather than building again. Used by both the Codecov upload and the backend coverage check, so
  that neither waits for a shared report job. Its callers start next to the API shards: the setup
  runs while the tests do, and the report waits for every shard to pass. Expects a checkout of the
  repository and GH_TOKEN in the environment.

inputs:
  api-matrix:
    description: "The API test matrix of the pipeline, as JSON: the shards whose exec files are merged"
    required: true
  no-cache:
    description: "true bypasses the shared Maven dependency cache"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@v6
      with:
        java-version: "21"
        distribution: temurin

    # Read-only: backend-compile is the sole writer of maven-v2.
    - name: Restore Maven dependencies
      if: ${{ inputs.no-cache != 'true' }}
      uses: actions/cache/restore@v6
      with:
        path: ~/.m2/repository
        key: maven-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          maven-v2-${{ runner.os }}-${{ runner.arch }}-

    # jacoco:report resolves no project dependency, so it does not need the 500 MB backend-compiled
    # artifact: the API classes in the build output are all the report reads.
    - name: Download API build output
      uses: actions/download-artifact@v8
      with:
        name: api-build-output
        path: openaev-api/target

    # Shadow shards (tenant_mode) upload no exec file, and may fail without failing the run.
    - name: List the shards that upload coverage
      id: shards
      shell: bash
      env:
        API_MATRIX: ${{ inputs.api-matrix }}
      run: |
        set -euo pipefail
        {
          echo 'artifacts<<SHARDS_EOF'
          jq -r '.[] | select(.tenant_mode == null)
            | "jacoco-exec-shard-\(.shard)\(.artifact_suffix // "")"' <<< "$API_MATRIX"
          echo 'SHARDS_EOF'
          echo 'jobs<<SHARDS_EOF'
          jq -r '.[] | select(.tenant_mode == null) | "API Tests (\(.shard_name))"' <<< "$API_MATRIX"
          echo 'SHARDS_EOF'
        } >> "$GITHUB_OUTPUT"

    # Fails as soon as a shard does, so that re-running the failed jobs runs this one again: it
    # does not `needs:` the shards, and a partial report would read as a drop. The slowest shard
    # runs for more than five minutes, so the first poll waits for four.
    - name: Wait for every shard to pass
      uses: ./.github/actions/wait-for-artifacts
      with:
        artifact-names: ${{ steps.shards.outputs.artifacts }}
        producer-job-names: ${{ steps.shards.outputs.jobs }}
        require-producer-success: "true"
        wait-seconds: "2400"
        initial-delay-seconds: "240"
        poll-min-seconds: "5"
        poll-max-seconds: "10"

    - name: Download all JaCoCo exec shards
      uses: actions/download-artifact@v8
      with:
        pattern: jacoco-exec-shard-*
        path: jacoco-exec

    # Every shard has passed, so every shard has uploaded its exec file.
    - name: Merge JaCoCo exec files
      shell: bash
      run: |
        SHARD_COUNT=$(find jacoco-exec -name 'jacoco.exec' | wc -l)
        if [ "$SHARD_COUNT" -eq 0 ]; then
          echo "❌ No JaCoCo exec file found, although the API tests passed"
          exit 1
        fi
        cat jacoco-exec/jacoco-exec-shard-*/jacoco.exec > openaev-api/target/jacoco.exec
        echo "✅ Merged $SHARD_COUNT shard(s)"

    - name: Coverage report
      shell: bash
      run: mvn -B -ntp -pl openaev-api jacoco:report
