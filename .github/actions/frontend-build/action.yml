name: Frontend Build
description: Install frontend dependencies, build production bundle, and upload artifact

inputs:
  fds-git-token:
    description: "PAT with read access to XTM-Foundation/filigran-design-system (secrets.FDS_GIT_TOKEN)."
    required: true
  no-cache:
    description: "true bypasses every cache in this action; set by Nightly, which must not consume the shared cache quota"
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-fds-auth
      with:
        token: ${{ inputs.fds-git-token }}

    - name: Install dependencies
      uses: ./.github/actions/yarn-install
      with:
        no-cache: ${{ inputs.no-cache }}
    - name: Build frontend
      run: yarn build
      shell: bash
      working-directory: openaev-front
    - name: Upload frontend build artifact
      uses: actions/upload-artifact@v7
      with:
        name: frontend-build
        path: openaev-front/builder/prod/build/
