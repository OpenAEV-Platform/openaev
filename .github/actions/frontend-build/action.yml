name: Frontend Build
description: Install frontend dependencies, build production bundle, and upload artifact

inputs:
  fds-git-token:
    description: "PAT with read access to XTM-Foundation/filigran-design-system (secrets.FDS_GIT_TOKEN)."
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js 22.11
      uses: actions/setup-node@v7
      with:
        node-version: "22.23.2"
    - name: Install corepack
      run: npm install -g corepack
      shell: bash
    - name: Get Yarn cache directory
      id: yarn-cache-dir
      run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: openaev-front
    - name: Cache Yarn dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.yarn-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-yarn-${{ hashFiles('openaev-front/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-
    - uses: ./.github/actions/setup-fds-auth
      with:
        token: ${{ inputs.fds-git-token }}
    - name: Install dependencies
      run: |
        for attempt in 1 2; do
          echo "::group::Attempt $attempt of 2"
          if yarn install --immutable; then
            echo "::endgroup::"
            echo "✅ Install succeeded on attempt $attempt"
            exit 0
          fi
          echo "::endgroup::"
          if [ "$attempt" -lt 2 ]; then
            echo "⚠️ Attempt $attempt failed, retrying…"
          fi
        done
        echo "❌ Install failed after 2 attempts"
        exit 1
      shell: bash
      working-directory: openaev-front
    - name: Build frontend
      run: |
        for attempt in 1 2; do
          echo "::group::Attempt $attempt of 2"
          if yarn build; then
            echo "::endgroup::"
            echo "✅ Build succeeded on attempt $attempt"
            exit 0
          fi
          echo "::endgroup::"
          if [ "$attempt" -lt 2 ]; then
            echo "⚠️ Attempt $attempt failed, retrying…"
          fi
        done
        echo "❌ Build failed after 2 attempts"
        exit 1
      shell: bash
      working-directory: openaev-front
    - name: Upload frontend build artifact
      uses: actions/upload-artifact@v7
      with:
        name: frontend-build
        path: openaev-front/builder/prod/build/
