name: Snyk Container Scan
description: >
  Download Docker image artifacts (standard + UBI9 amd64 builds), load them
  into the local daemon, run Snyk vulnerability scanning, and upload reports.
  Core CI uses advisory mode; Nightly CI enables enforcement and fails on any
  high/critical finding or scan execution error.

inputs:
  snyk-token:
    description: Snyk API token
    required: true
  standard-artifact:
    description: Name of the standard Docker image artifact (amd64)
    required: false
    default: "openaev-image-amd64"
  ubi9-artifact:
    description: Name of the UBI9 Docker image artifact (amd64)
    required: false
    default: "openaev-ubi9-image-amd64"
  severity-threshold:
    description: Minimum severity to report (low, medium, high, critical)
    required: false
    default: "high"
  fail-on-error:
    description: "Enforce the scan result: true fails on findings/errors (Nightly); false reports only (Core CI)"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Download standard Docker image
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.standard-artifact }}
        path: /tmp/docker-images

    - name: Download UBI9 Docker image
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.ubi9-artifact }}
        path: /tmp/docker-images

    - name: Load Docker images
      run: |
        cd /tmp/docker-images
        gunzip ${{ inputs.standard-artifact }}.tar.gz
        skopeo copy \
          oci-archive:${{ inputs.standard-artifact }}.tar \
          docker-daemon:openaev:ci
        rm -f ${{ inputs.standard-artifact }}.tar

        gunzip ${{ inputs.ubi9-artifact }}.tar.gz
        skopeo copy \
          oci-archive:${{ inputs.ubi9-artifact }}.tar \
          docker-daemon:openaev-ubi9:ci
        rm -f ${{ inputs.ubi9-artifact }}.tar
      shell: bash

    - name: Install Snyk CLI
      run: |
        SNYK_VERSION="1.1306.1"
        SNYK_SHA256="3b25e6067e3d2f63a25213b44ca8f0eccc43133c76b9eb188155f80aa451f506"
        SNYK_BIN="${RUNNER_TEMP}/snyk"

        curl -fsSL --retry 3 \
          "https://static.snyk.io/cli/v${SNYK_VERSION}/snyk-linux" \
          -o "$SNYK_BIN"
        echo "${SNYK_SHA256}  ${SNYK_BIN}" | sha256sum -c -
        chmod +x "$SNYK_BIN"
        "$SNYK_BIN" --version
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      shell: bash

    - name: Run Snyk on standard image
      id: snyk-standard
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        if snyk container test openaev:ci \
          --severity-threshold=${{ inputs.severity-threshold }} \
          --json-file-output=snyk-standard.json; then
          echo "result=success" >> "$GITHUB_OUTPUT"
        else
          echo "result=failure" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Upload Snyk report (standard)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: snyk-report-standard
        path: snyk-standard.json
        if-no-files-found: ignore

    - name: Run Snyk on UBI9 image
      id: snyk-ubi9
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        if snyk container test openaev-ubi9:ci \
          --severity-threshold=${{ inputs.severity-threshold }} \
          --json-file-output=snyk-ubi9.json; then
          echo "result=success" >> "$GITHUB_OUTPUT"
        else
          echo "result=failure" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Upload Snyk report (UBI9)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: snyk-report-ubi9
        path: snyk-ubi9.json
        if-no-files-found: ignore

    - name: Summarize Snyk results
      if: ${{ always() }}
      run: |
        echo "══════════════════════════════════════════"
        echo "  🔒 Snyk Container Scan Summary"
        echo "══════════════════════════════════════════"
        echo "  Standard image: ${{ steps.snyk-standard.outputs.result }}"
        echo "  UBI9 image:     ${{ steps.snyk-ubi9.outputs.result }}"
        if [ "${{ steps.snyk-standard.outputs.result }}" != "success" ] || [ "${{ steps.snyk-ubi9.outputs.result }}" != "success" ]; then
          echo ""
          echo "  ⚠️  Findings at the configured threshold or a scan error occurred."
          echo "     See snyk-report-* artifacts for details."
        fi
        echo "══════════════════════════════════════════"
      shell: bash

    - name: Enforce scan result when requested
      if: ${{ always() && inputs.fail-on-error == 'true' }}
      run: |
        if [ "${{ steps.snyk-standard.outputs.result }}" != "success" ] || [ "${{ steps.snyk-ubi9.outputs.result }}" != "success" ]; then
          echo "❌ Snyk reported findings at or above threshold, or a scan execution error."
          exit 1
        fi
        echo "✅ No vulnerabilities at or above threshold were detected."
      shell: bash
