name: Snyk Container Scan
description: >
  Obtain the standard + UBI9 amd64 images (from GHCR when available, otherwise
  from the workflow artifacts), run Snyk vulnerability scanning, and upload
  reports. Core CI uses advisory mode; Nightly CI enables enforcement and fails
  on any high/critical finding or scan execution error.

inputs:
  snyk-token:
    description: Snyk API token
    required: true
  standard-artifact:
    description: Name of the standard Docker image artifact (amd64)
    required: false
    default: "openaev-image-amd64"
  ubi9-artifact:
    description: Name of the UBI9 Docker image artifact (amd64)
    required: false
    default: "openaev-ubi9-image-amd64"
  severity-threshold:
    description: Minimum severity to report (low, medium, high, critical)
    required: false
    default: "high"
  fail-on-error:
    description: "Enforce the scan result: true fails on findings/errors (Nightly); false reports only (Core CI)"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Resolve CI registry
      id: registry
      uses: ./.github/actions/ci-registry

    - name: Log in to GHCR
      if: ${{ steps.registry.outputs.available == 'true' }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Pull images from registry
      if: ${{ steps.registry.outputs.available == 'true' }}
      shell: bash
      env:
        REPO: ${{ steps.registry.outputs.repository }}
        PREFIX: ${{ steps.registry.outputs.tag-prefix }}
        STANDARD: ${{ inputs.standard-artifact }}
        UBI9: ${{ inputs.ubi9-artifact }}
      run: |
        set -euo pipefail

        build_failed() {
          local n
          n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
                --jq '[.jobs[] | select(.name | test("Docker Build")) | .conclusion]
                      | map(select(. == "failure" or . == "cancelled")) | length' 2>/dev/null) || n=""
          echo "${n:-0}"
        }

        await_and_pull() {
          local ref="$1" local_tag="$2"
          echo "⏳ Waiting for ${ref}..."
          for i in $(seq 1 180); do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "  ✅ published (after ~$((i * 5))s)"
              break
            fi
            if [ "$(build_failed)" -gt 0 ]; then
              echo "❌ A Docker Build job failed or was cancelled — aborting"
              exit 1
            fi
            if [ "$i" -eq 180 ]; then
              echo "❌ Timed out waiting for ${ref} (15 min)"
              exit 1
            fi
            sleep 5
          done
          docker pull "$ref"
          docker tag "$ref" "$local_tag"
          echo "  ✅ tagged as ${local_tag}"
        }

        await_and_pull "${REPO}:${PREFIX}-${STANDARD}" "openaev:ci"
        await_and_pull "${REPO}:${PREFIX}-${UBI9}" "openaev-ubi9:ci"

    - name: Wait for image artifacts
      if: ${{ steps.registry.outputs.available != 'true' }}
      shell: bash
      env:
        STANDARD: ${{ inputs.standard-artifact }}
        UBI9: ${{ inputs.ubi9-artifact }}
      run: |
        set -euo pipefail
        for name in "$STANDARD" "$UBI9"; do
          echo "⏳ Waiting for artifact ${name}..."
          for i in $(seq 1 180); do
            if gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
                 --jq '[.artifacts[].name]' 2>/dev/null | grep -qF "\"$name\""; then
              echo "  ✅ ${name} available (after ~$((i * 5))s)"
              break
            fi
            FAILED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs" \
              --jq '[.jobs[] | select(.name | test("Docker Build")) | .conclusion]
                    | map(select(. == "failure" or . == "cancelled")) | length' 2>/dev/null) || FAILED=""
            if [ "${FAILED:-0}" -gt 0 ]; then
              echo "❌ A Docker Build job failed or was cancelled — aborting"
              exit 1
            fi
            if [ "$i" -eq 180 ]; then
              echo "❌ Timed out waiting for artifact ${name} (15 min)"
              exit 1
            fi
            sleep 5
          done
        done

    - name: Download standard Docker image
      if: ${{ steps.registry.outputs.available != 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.standard-artifact }}
        path: /tmp/docker-images

    - name: Download UBI9 Docker image
      if: ${{ steps.registry.outputs.available != 'true' }}
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.ubi9-artifact }}
        path: /tmp/docker-images

    - name: Load Docker images
      if: ${{ steps.registry.outputs.available != 'true' }}
      run: |
        cd /tmp/docker-images
        gunzip ${{ inputs.standard-artifact }}.tar.gz
        skopeo copy \
          oci-archive:${{ inputs.standard-artifact }}.tar \
          docker-daemon:openaev:ci
        rm -f ${{ inputs.standard-artifact }}.tar

        gunzip ${{ inputs.ubi9-artifact }}.tar.gz
        skopeo copy \
          oci-archive:${{ inputs.ubi9-artifact }}.tar \
          docker-daemon:openaev-ubi9:ci
        rm -f ${{ inputs.ubi9-artifact }}.tar
      shell: bash

    - name: Install Snyk CLI
      run: |
        SNYK_VERSION="1.1306.1"
        SNYK_SHA256="3b25e6067e3d2f63a25213b44ca8f0eccc43133c76b9eb188155f80aa451f506"
        SNYK_BIN="${RUNNER_TEMP}/snyk"

        curl -fsSL --retry 3 \
          "https://static.snyk.io/cli/v${SNYK_VERSION}/snyk-linux" \
          -o "$SNYK_BIN"
        echo "${SNYK_SHA256}  ${SNYK_BIN}" | sha256sum -c -
        chmod +x "$SNYK_BIN"
        "$SNYK_BIN" --version
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      shell: bash

    - name: Run Snyk on standard image
      id: snyk-standard
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        if snyk container test openaev:ci \
          --severity-threshold=${{ inputs.severity-threshold }} \
          --json-file-output=snyk-standard.json; then
          echo "result=success" >> "$GITHUB_OUTPUT"
        else
          echo "result=failure" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Upload Snyk report (standard)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: snyk-report-standard
        path: snyk-standard.json
        if-no-files-found: ignore

    - name: Run Snyk on UBI9 image
      id: snyk-ubi9
      env:
        SNYK_TOKEN: ${{ inputs.snyk-token }}
      run: |
        if snyk container test openaev-ubi9:ci \
          --severity-threshold=${{ inputs.severity-threshold }} \
          --json-file-output=snyk-ubi9.json; then
          echo "result=success" >> "$GITHUB_OUTPUT"
        else
          echo "result=failure" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Upload Snyk report (UBI9)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: snyk-report-ubi9
        path: snyk-ubi9.json
        if-no-files-found: ignore

    - name: Summarize Snyk results
      if: ${{ always() }}
      run: |
        echo "══════════════════════════════════════════"
        echo "  🔒 Snyk Container Scan Summary"
        echo "══════════════════════════════════════════"
        echo "  Standard image: ${{ steps.snyk-standard.outputs.result }}"
        echo "  UBI9 image:     ${{ steps.snyk-ubi9.outputs.result }}"
        if [ "${{ steps.snyk-standard.outputs.result }}" != "success" ] || [ "${{ steps.snyk-ubi9.outputs.result }}" != "success" ]; then
          echo ""
          echo "  ⚠️  Findings at the configured threshold or a scan error occurred."
          echo "     See snyk-report-* artifacts for details."
        fi
        echo "══════════════════════════════════════════"
      shell: bash

    - name: Enforce scan result when requested
      if: ${{ always() && inputs.fail-on-error == 'true' }}
      run: |
        if [ "${{ steps.snyk-standard.outputs.result }}" != "success" ] || [ "${{ steps.snyk-ubi9.outputs.result }}" != "success" ]; then
          echo "❌ Snyk reported findings at or above threshold, or a scan execution error."
          exit 1
        fi
        echo "✅ No vulnerabilities at or above threshold were detected."
      shell: bash
