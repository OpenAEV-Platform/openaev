# use pinned version
defaultSemverRangePrefix: ""

# ensure the best compatibility
nodeLinker: node-modules

# security: scripts are not enabled by default and required individual activations in package.json
enableScripts: false

# security: NPM package younger than 3 days won't be considered for installation
npmMinimalAgeGate: 4320

# first-party Filigran packages are trusted and exempt from the age gate
npmPreapprovedPackages:
  - '@filigran/*'
# the design system is consumed as a pinned git dependency (private repo)
approvedGitRepositories:
  - 'https://github.com/XTM-Foundation/filigran-design-system.git'
