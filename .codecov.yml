coverage:
  status:
    project:
      default:
        target: 50%
        threshold: 0
        informational: false
    patch:
      default:
        target: 50%
        threshold: 0
        informational: false

comments:
  layout: "reach, diff, flags, files"
  require_changes: false
  behavior: default
  after_n_builds: 1

  before:
    - "### 🚨 Coverage Threshold"
    - "This project requires **50%** minimum coverage."