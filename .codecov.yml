codecov:
  notify:
    # Comment once the three flags are in: backend and frontend upload after green tests, E2E
    # when every shard passes.
    after_n_builds: 3

coverage:
  # Every status only reports and stays green: the backend coverage rules that pass or fail run in
  # the coverage-backend-gate CI job. A backend status that Codecov counts as failed still adds a
  # ":x:" line to the PR comment. `default: false` turns off the statuses the org Global YAML adds.
  status:
    project:
      default: false
      # `removed_code_behavior: adjust_base` is Codecov's default, but only when it is written here
      # does a failed project status add its line to the comment.
      backend:
        target: auto
        threshold: 0.1%
        informational: true
        removed_code_behavior: adjust_base
        flags:
          - backend
      frontend:
        target: auto
        threshold: 0.1%
        informational: true
        flags:
          - frontend
      e2e:
        target: auto
        threshold: 0.1%
        informational: true
        flags:
          - e2e
    patch:
      default: false
      backend:
        target: 80%
        flags:
          - backend

flag_management:
  individual_flags:
    - name: backend
      paths:
        - openaev-api/src/main/java/
    - name: frontend
      paths:
        - openaev-front/src/
    - name: e2e
      paths:
        - openaev-front/src/

comment:
  layout: "condensed_header, flags, condensed_files"
  hide_project_coverage: true
  # Comment only when the pull request changes lines that no test runs. `coverage_drop` reads its
  # threshold at the top level of `project`, which holds only named statuses here, so it would fire
  # on every 0.01 point of noise.
  require_changes: "uncovered_patch"
