codecov:
  notify:
    after_n_builds: 2

coverage:
  status:
    # No fixed target on the whole project: a status only reports a drop of more than half
    # a point against the base commit. The patch rule lives in the coverage-backend job.
    project:
      backend:
        target: auto
        threshold: 0.5%
        informational: true
        flags:
          - backend
      frontend:
        target: auto
        threshold: 0.5%
        informational: true
        flags:
          - frontend
      e2e:
        target: auto
        informational: true
        flags:
          - e2e
    patch:
      backend:
        target: 80%
        informational: true
        flags:
          - backend
      frontend:
        target: 80%
        informational: true
        flags:
          - frontend
      e2e:
        target: auto
        informational: true
        flags:
          - e2e

flags:
  backend:
    paths:
      - openaev-api/src/main/java/
  frontend:
    paths:
      - openaev-front/src/
  e2e:
    paths:
      - openaev-front/src/
