codecov:
  notify:
    # Comment once the three flags are in: backend and frontend upload after green tests, E2E
    # when every shard passes.
    after_n_builds: 3

coverage:
  # The backend coverage rules run in the coverage-backend-gate CI job, so Codecov posts no
  # backend status. Frontend and E2E get a project status that only reports: its description
  # shows the change against the base commit, and it never turns red. `default: false` and
  # `patch: false` turn off the `default` statuses that the org Global YAML adds.
  status:
    project:
      default: false
      frontend:
        target: auto
        informational: true
        flags:
          - frontend
      e2e:
        target: auto
        informational: true
        flags:
          - e2e
    patch: false

flag_management:
  individual_flags:
    - name: backend
      paths:
        - openaev-api/src/main/java/
    - name: frontend
      paths:
        - openaev-front/src/
    - name: e2e
      paths:
        - openaev-front/src/

comment:
  layout: "condensed_header, flags, condensed_files"
  hide_project_coverage: true
  # Comment only when the pull request changes lines that no test runs. With no project status
  # there is no threshold, so `coverage_drop` would fire on every 0.01 point of noise.
  require_changes: "uncovered_patch"
