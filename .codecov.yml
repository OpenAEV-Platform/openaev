coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 0
    patch:
      default:
        target: 90%
        threshold: 0

comment:
  layout: "reach, diff, flags, files"
  require_changes: false
  behavior: default
  after_n_builds: 1
  before:
    - "### 🚨 Coverage Threshold"
    - "This project requires **50%** minimum coverage."