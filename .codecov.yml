codecov:
  notify:
    # Backend and frontend always upload on green tests; E2E only when every shard passes.
    after_n_builds: 2

coverage:
  status:
    # The org Global YAML adds a `default` status to project and patch, merged into this file.
    # It reads every flag at once, Java and TypeScript together, so it is turned off here.
    # The backend project status turns red when backend coverage drops by more than 0.2 point
    # against the base commit. Frontend and E2E only report: their drop shows in the description,
    # and they stay green.
    # The backend statuses wait for a backend upload: without one, Codecov posts none instead of
    # reporting on the frontend or E2E upload alone.
    project:
      default: false
      backend:
        target: auto
        threshold: 0.2%
        flag_coverage_not_uploaded_behavior: exclude
        flags:
          - backend
      frontend:
        target: auto
        threshold: 0.5%
        informational: true
        flags:
          - frontend
      e2e:
        target: auto
        threshold: 0.5%
        informational: true
        flags:
          - e2e
    # The backend patch status is the coverage rule: it turns red under 80% of the backend lines
    # a pull request changes, partly covered lines counting as missing. Frontend and E2E only
    # report until the front end has a test strategy.
    patch:
      default: false
      backend:
        target: 80%
        flag_coverage_not_uploaded_behavior: exclude
        flags:
          - backend
      frontend:
        target: 80%
        informational: true
        flags:
          - frontend
      e2e:
        target: auto
        informational: true
        flags:
          - e2e

flag_management:
  individual_flags:
    - name: backend
      paths:
        - openaev-api/src/main/java/
    - name: frontend
      paths:
        - openaev-front/src/
    - name: e2e
      paths:
        - openaev-front/src/

comment:
  layout: "condensed_header, flags, condensed_files, condensed_footer"
  hide_project_coverage: true
  # No comment on a PR that leaves coverage as it was.
  require_changes: "coverage_drop OR uncovered_patch"
