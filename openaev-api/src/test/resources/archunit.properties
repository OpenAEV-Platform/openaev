# Freeze store for the background-transaction guards (TenantBackgroundTransactionArchTest).
# The committed store IS the baseline: existing violations are the conversion work list (#6398),
# only NEW violations break the build. Locked: a test run can neither create nor rewrite it.
# To refresh the baseline deliberately, run once with:
#   -Darchunit.freeze.store.default.allowStoreCreation=true \
#   -Darchunit.freeze.store.default.allowStoreUpdate=true
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
