# Spring Framework internal properties — read via SpringProperties.getProperty(),
# NOT via Spring Boot's application.properties (which uses the Spring Environment abstraction).
#
# This file controls Spring Data JPA's native SQL query parser mode.
#
# Problem: Spring Data JPA 3.5+ detects JSQLParser on the classpath (AUTO mode) and validates
# ALL @Query(nativeQuery=true) methods at startup using JSQLParser. This fails on:
#   - PostgreSQL-specific syntax: json_agg(DISTINCT table.*), array_union_agg, etc.
#   - Spring EL expressions: :#{#tenantContext.currentTenant}
#   - INSERT statements in @Modifying native queries
#
# Solution: Force REGEX mode — Spring Data JPA uses its internal regex-based parser for
# native query enhancement (count queries, pagination) without JSQLParser validation.
# Our TenantStatementInspector still uses JSQLParser at runtime (via Hibernate StatementInspector)
# for tenant_id injection, independently and safely.
#
# Values: AUTO (default), REGEX, JSQLPARSER
spring.data.jpa.query.native.parser=REGEX
