logging.level.io.openaev.debug=INFO

###############
# DEBUG MODE  #
###############
# Global, instance-wide debug mode. OFF by default. When off there is no datasource proxy on the
# query hot path, no parameter capture and no extra per-request allocation.
# Activate (ideally via env var OPENAEV_DEBUG_ENABLED=true) ONLY for diagnostics, never in steady
# production: a loud warning is logged repeatedly while it is on.
# See docs/docs/administration/debug-mode.md for the full reference and the writable volume needed
# in containers.
openaev.debug.enabled=false
# Production barrier: in production (no dev/test/ci profile) the mode refuses to start unless this
# separate override is also set. Turning openaev.debug.enabled on is not enough in production.
openaev.debug.allow-in-production=false
# Auto-disable the verbose tracing after this duration (0 = never). A full removal of the datasource
# proxy still needs a restart.
openaev.debug.auto-disable-after=0
# Writable directory for debug artifacts: JFR recordings and the rotated SQL log file.
# On a read-only container, point this at a mounted writable volume.
openaev.debug.output-dir=./logs/debug
# SQL statement logging (timing + masked parameters), written to a rotated file
# (openaev-debug-sql.log) in output-dir, off the console. Active only when debug mode is on.
openaev.debug.sql.enabled=true
# 0 logs every statement; set e.g. 50ms to only log slow ones.
openaev.debug.sql.slow-query-threshold=0ms
# JFR recording (bounded in size and time, written to output-dir).
openaev.debug.jfr.enabled=true
openaev.debug.jfr.max-size=100MB
openaev.debug.jfr.max-age=1h
openaev.debug.jfr.duration=10m
openaev.debug.jfr.settings=profile
# Masking of secrets and personal data. Keep enabled.
openaev.debug.masking.enabled=true
# Deny-by-default: mask every parameter value (keep only column name + type). Opt-in to reveal less.
openaev.debug.masking.mask-all-parameters=false
# Correlation ids: DebugTracingContextInitializer excludes the tracing auto-configuration unless debug
# mode is active, so no Tracer is created and no span/traceId is produced on any request, message or
# job path when off (management.tracing.enabled only gates export, not span creation). This sampling
# probability applies once tracing is active under debug mode.
management.tracing.sampling.probability=1.0
logging.file.name=./logs/openaev.log
logging.logback.rollingpolicy.file-name-pattern=${LOG_FILE}.-%d{yyyy-MM-dd}.%i
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7

