# RUNTIME DEPENDENCIES #
########################
# PostgreSQL, MinIO and RabbitMQ must be configured (and running) for OpenAEV to work properly

### POSTGRESQL Configuration
### see also: https://docs.openaev.io/latest/deployment/configuration/#postgresql
# connection URL to the PostgreSQL server
# example: jdbc:postgresql://localhost:5432
spring.datasource.url=jdbc:postgresql://localhost:5432/openaev
# Username: should be identical to the username set on the database instance
#spring.datasource.username=copilot
# Password: the password for the username set above
#spring.datasource.password=copilot_dev
spring.datasource.username=openaev
spring.datasource.password=openaev
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
# Batch lazy/eager association loading (IN (?, ?, ...) instead of one SELECT per entity).
# The model has many EAGER collections without @Fetch(SUBSELECT); this caps the N+1 cost.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.datasource.hikari.maximum-pool-size=20
# Log the acquisition stack trace of any thread holding a connection for more than 30s ("Apparent
# connection leak detected", WARN on com.zaxxer.hikari — visible with production log levels).
# Together with io.openaev.diagnostics.PoolExhaustionWatchdog (ERROR + thread dump on sustained
# saturation), this names the code paths pinning connections whenever the pool gets exhausted.
# The connection is NOT killed: legit long holders (bulk indexing, migrations) just log evidence.
spring.datasource.hikari.leak-detection-threshold=30000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true

### ENGINE Configuration
# selector can be elk or opensearch
engine.engine-aws-mode=no
engine.engine-selector=elk
engine.index-prefix=openaev
engine.index-suffix=-000001
engine.url=http://localhost:9200
# How many models may run their indexing sync concurrently (default 3). Each sync pass holds a
# database connection for its whole fetch query; during a full reindex those queries are heavy,
# so a higher value trades platform responsiveness for reindexing throughput.
#engine.indexing-max-concurrent-models=3
# Threshold in milliseconds after which a model synchronisation is declared misfired and is
# rescheduled (default 120000). Avoids stacking repeated sync jobs for the same model when the
# engine sync thread pool is temporarily exhausted.
#engine.indexing-misfire-threshold-ms=120000
# Engine client timeouts and connection cap (defaults: 5s connect, 60s socket, 40 connections).
#engine.connect-timeout-ms=5000
#engine.socket-timeout-ms=60000
#engine.max-connections=40
# Indexing cursor grace window in seconds (default 60). The persisted cursor never gets closer to
# wall-clock than this window, so rows committed late by long transactions (whose updated_at was
# assigned at flush time) are still picked up. Must exceed the longest expected write transaction.
#engine.indexing-grace-window-seconds=60

