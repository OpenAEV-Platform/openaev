# Reporting module: server-side rendering (Playwright + in-container headless Chromium)
## Hard cap on a single render (navigation + readiness wait + capture), in seconds
openaev.reporting.render-timeout-seconds=90
## Maximum simultaneous headless browser contexts (bounds Chromium memory usage)
openaev.reporting.max-concurrent-renders=2
## Base URL the headless browser uses to reach the platform itself. Empty (default) uses
## loopback - http(s)://localhost:{server.port}{context-path} - which avoids any dependency
## on external DNS, reverse proxies or TLS termination. Override only when loopback does not
## serve the SPA.
openaev.reporting.render-base-url=

# Web server configuration
server.address=0.0.0.0
server.port=8080
server.servlet.context-path=/

# Session management
## Sessions are persisted in PostgreSQL (Spring Session JDBC) and survive platform restarts.
## Rolling idle timeout: every authenticated request extends the session by this duration.
server.servlet.session.timeout=1440m
spring.session.timeout=${server.servlet.session.timeout}
## Session tables are created by a Flyway migration, never by Spring Session itself.
spring.session.jdbc.initialize-schema=never
## Built-in cleanup is disabled: the SessionManager audit-aware cleanup job replaces it.
spring.session.jdbc.cleanup-cron=-
## Idle timeout surfaced to the frontend lock screen (0 = disabled). Must be lower than the
## session timeout to be useful. Supports duration syntax (e.g. 30m).
openaev.session-idle-timeout=0
## When true, the session cookie has no Expires attribute and dies when the browser closes
## (server-side timeout still applies). When false, the cookie persists for the session timeout
## and is re-issued on every request (rolling), so browser-side expiration slides with activity:
## a user navigating within the timeout window is never logged out.
openaev.session-cookie=false
## SameSite attribute of the session cookie. Blank (default) OMITS the attribute, which keeps the
## cookie flowing on the cross-site SSO callback (SAML ACS POST / OIDC form_post) - an explicit
## "Lax" would drop it and break SSO (redirect to /login?error). HTTPS SSO deployments may set this
## to "None" (which forces Secure) for a stricter, spec-compliant cross-site session cookie.
## Accepted values: None, Lax, Strict, or blank to omit.
openaev.session-cookie-same-site=
