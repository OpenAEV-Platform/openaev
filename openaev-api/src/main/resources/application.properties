openaev.expectation.human.expiration-time=86400
#openaev.expectation.challenge.expiration-time=3600
#openaev.expectation.article.expiration-time=3600
#openaev.expectation.manual.expiration-time=3600

# Min value: 1
# Max value: 100
# Default value: 50
openaev.expectation.manual.default-score-value=50


#Health check
# a unique random string used when calling the health endpoint
# Example of a call : /api/health?health_access_key=ChangeMe
openaev.healthcheck.key=ChangeMe

# Pyroscope properties
pyroscope.agent.enabled=false
pyroscope.agent.instance=OpenAEV
pyroscope.profiler.event=itimer
pyroscope.profiler.alloc=512k
pyroscope.profiler.lock=10ms
pyroscope.server.address=<pyroscope.url>
pyroscope.profile.export.timeout=300s

## remediation detection AI Webservice
#remediation.detection.webservice=
#remediation.detection.webservice.retry=
#remediation.detection.webservice.retry.waiting.milliseconds=


# Enable actuator -> disabled by default
# once activated the api is by default open without authentication
management.endpoints.web.exposure.include=
#management.endpoints.web.exposure.include=metrics,prometheus
management.endpoint.health.show-details=always
management.server.port=8080

# URL Access Token configuration
openaev.url.access.token.expiry-margin-days=7
openaev.url.access.token.retention-days=30

# Execution trace retention (high-growth table: one row per agent execution message).
# Number of days to keep execution traces; 0 (default) disables the purge job.
openaev.retention.execution-traces.retention-days=0

# Credential status validation: re-checks stored credentials against their provider and records
# ACTIVE/INACTIVE on the secret reference. An inconclusive check (timeout, throttling, provider
# outage) never overwrites the previous status.
openaev.credentials.status-validation.enabled=true
# Every 6 hours (by default) a run makes one outbound call per stale credential, keep it off-peak.
openaev.credentials.status-validation.cron=0 */6 * * * ?
# How long a status stays fresh before the credential is re-checked.
# If the value is negative, the value is set to default (1 day).
openaev.credentials.status-validation.revalidate-after-days=1
# Upper bound of credentials checked per tenant and per run.
openaev.credentials.status-validation.max-per-run=500
# Per-call budget for a single provider probe.
openaev.credentials.status-validation.timeout-seconds=10

#############################
# FEATURE UNDER DEVELOPMENT #
#############################
openaev.enabled-dev-features=

# Maximum number of records fetched per indexing batch from the database
# engine.indexing-batch-size=500

#############################
# Multi-tenancy v2
#############################
# Tables fully switched to v2 tenant isolation (statement inspector + can_access_tenant).
# import_mappers is the pilot: its v1 @Filter has been removed, so it MUST stay activated here,
# otherwise the table would have no tenant isolation at all.
# attackpath_execution / attackpath_finding are v2-native (no v1 @Filter), so they MUST stay
# activated here for the POC to have tenant isolation (attackpath_execution_finding is a join
# table, filtered through the finding it is joined to).
# autonomous_runs / autonomous_events / autonomous_directives are v2-native (TenantBase, no
# @Filter; TenantBaseListener removed on activation) so they MUST stay here (#7396).
openaev.tenant.active-tables=import_mappers,lessons_templates,mitigations,cwes,collectors,executors,injectors,attackpath_execution,attackpath_finding,secret_references,secrets,connector_instances,autonomous_runs,autonomous_events,autonomous_directives,security_coverages

#############################
# Attack path
#############################
# Above this many executions a simulation's graph is served collapsed by default. The bound is the
# front's render ceiling, not backend latency: a full graph larger than this is not renderable.
openaev.attackpath.collapse-threshold=20000
# Beyond this many changed rows, a delta poll is answered with a resync instead: past that size
# assembling the delta costs more than a reload, which the client would do anyway to re-lay out.
openaev.attackpath.delta-max-rows=5000

#############################
# Chaining engine
#############################
openaev.chaining.max-retry-count=5
