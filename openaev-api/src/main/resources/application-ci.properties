# Spring profile activated in CI (SPRING_PROFILES_ACTIVE=ci).
# Applied for E2E tests and the api-types check ? NOT for unit/integration tests
# (those use src/test/resources/application.properties instead).

# Enable feature flags required by the E2E test suite.
openaev.enabled-dev-features=*

# Enterprise Edition license required for EE-gated endpoints (e.g. tenant management).
# Injected at runtime from the OPENAEV_APPLICATION_LICENSE GitHub Actions secret.
# Spring Boot's relaxed binding maps OPENAEV_APPLICATION_LICENSE ? openaev.application-license.
openaev.application-license=${OPENAEV_APPLICATION_LICENSE:}

# E2E CI audit assertions rely on the actuator logfile endpoint reading the dedicated audit file.
openaev.audit-logs.transports=file
management.endpoints.web.exposure.include=logfile
management.server.port=8080
management.endpoint.logfile.access=read_only
management.endpoint.logfile.external-file=./logs/audit.log

