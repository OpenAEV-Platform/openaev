      font-size: 20px;
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;

    @keyframes particle-flow {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .pulse-dot {
      position: relative;
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .pulse-dot::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: inherit;
      animation: pulse-ring 2s ease-out infinite;
    }
  </style>

    // ─── Layout Computation ─────────────────────────────────────────────────────

    function computeLayout(nodes, edges) {
      const assets = nodes.filter(n => n.type === 'ASSET');
      const actions = nodes.filter(n => n.type === 'ACTION');
      const positions = {};

      const assetSpacing = 450;
      const startX = 200;
      const assetY = 180;
      const actionStartY = 370;
      const actionSpacingY = 120;

      assets.forEach((asset, i) => {
        positions[asset.id] = { x: startX + i * assetSpacing, y: assetY };
      });

      // Group actions by asset
      const actionsByAsset = {};
      actions.forEach(action => {
        const assetLink = edges.find(e => e.type === 'asset_link' && e.targetNodeId === action.id);
        const assetId = assetLink ? assetLink.sourceNodeId : null;
        if (!actionsByAsset[assetId]) actionsByAsset[assetId] = [];
        actionsByAsset[assetId].push(action);
      });

      Object.entries(actionsByAsset).forEach(([assetId, assetActions]) => {
        const assetPos = positions[assetId];
        if (!assetPos) return;
        const totalHeight = (assetActions.length - 1) * actionSpacingY;
        assetActions.forEach((action, i) => {
          positions[action.id] = {
            x: assetPos.x,
            y: actionStartY + i * actionSpacingY,
          };
        });
      });

      return positions;
    }

    function getConnectedNodes(nodeId, edges, nodes) {
      const upstream = new Set();
      const downstream = new Set();

      function findUpstream(id) {
        edges.filter(e => e.type === 'chain_flow' && e.targetNodeId === id).forEach(e => {
          upstream.add(e.sourceNodeId);
          findUpstream(e.sourceNodeId);
        });
      }

      function findDownstream(id) {
        edges.filter(e => e.type === 'chain_flow' && e.sourceNodeId === id).forEach(e => {
          downstream.add(e.targetNodeId);
          findDownstream(e.targetNodeId);
        });
      }

      findUpstream(nodeId);
      findDownstream(nodeId);

      // Also include related asset
      const node = nodes.find(n => n.id === nodeId);
      if (node && node.type === 'ACTION') {
        const assetEdge = edges.find(e => e.type === 'asset_link' && e.targetNodeId === nodeId);
        if (assetEdge) upstream.add(assetEdge.sourceNodeId);
      }
      if (node && node.type === 'ASSET') {
        edges.filter(e => e.type === 'asset_link' && e.sourceNodeId === nodeId).forEach(e => {
          downstream.add(e.targetNodeId);
        });
      }

      return { upstream: [...upstream], downstream: [...downstream] };
    }

                <line key={edge.id}
                  x1={from.x} y1={from.y + 50} x2={to.x} y2={to.y - 24}
                  stroke="hsl(var(--gray-700))" strokeWidth="1" strokeDasharray="4 3"
                  opacity={highlighted ? 0.5 : 0.1}
                  style={{ transition: 'opacity 0.3s' }}
                />
              );
            })}

            {/* Chain flow edges */}
            {edges.filter(e => e.type === 'chain_flow').map(edge => {
              const from = positions[edge.sourceNodeId];
              const to = positions[edge.targetNodeId];
              if (!from || !to) return null;
              const highlighted = isEdgeHighlighted(edge);
              const hasEvent = edge.eventIds.length > 0;

              const dx = to.x - from.x;
              const dy = to.y - from.y;
              const curveX = Math.abs(dx) > 100 ? dx * 0.3 : 0;
              const curveY = Math.abs(dx) > 100 ? -50 : dy * 0.3;

              const path = `M ${from.x} ${from.y + 20} C ${from.x + curveX} ${from.y + 20 + curveY}, ${to.x - curveX} ${to.y - 24 + curveY}, ${to.x} ${to.y - 24}`;
              const mx = (from.x + to.x) / 2;
              const my = (from.y + 20 + to.y - 24) / 2 + curveY / 2;

              return (
                <g key={edge.id} opacity={highlighted ? 1 : 0.12} style={{ transition: 'opacity 0.3s' }}>
                  {/* Glow */}
                  {hasEvent && highlighted && (
                    <path d={path} fill="none" stroke="hsl(195 100% 45%)" strokeWidth="4" opacity="0.12" />
                  )}
                  {/* Main path */}
                  <path d={path} fill="none"
                    stroke={hasEvent ? 'hsl(195 100% 45%)' : 'hsl(var(--gray-500))'}
                    strokeWidth={hasEvent ? 1.5 : 1}
                    markerEnd={hasEvent ? 'url(#arrow-chain)' : 'url(#arrow)'}
                    opacity={0.8}
                  />
                  {/* Animated particles */}
                  {highlighted && (
                    <>
                      <circle r="2.5" fill={hasEvent ? 'hsl(195 100% 65%)' : 'hsl(var(--gray-300))'} opacity="0.9">
                        <animateMotion dur="2.5s" repeatCount="indefinite" path={path} />
                      </circle>
                      {hasEvent && (
                        <circle r="2" fill="hsl(195 100% 65%)" opacity="0.5">
                          <animateMotion dur="2.5s" repeatCount="indefinite" path={path} begin="1.25s" />
                        </circle>
                      )}
                    </>
                  )}
                  {/* Event label (text only, no circle marker) */}
                  {hasEvent && (
                    <g>
                      <text x={mx} y={my - 6}
                        textAnchor="middle" fontSize="8.5" fontFamily="var(--font-mono)"
                        fill="hsl(195 100% 60%)" letterSpacing="0.02em" fontWeight="500"
                      >
                        {EVENTS[edge.eventIds[0]]?.label || 'Event'}
                      </text>
                      <text x={mx} y={my + 6}
                        textAnchor="middle" fontSize="7.5" fontFamily="var(--font-mono)"
                        fill="hsl(195 100% 45%)" letterSpacing="0.02em" opacity="0.8"
                      >
                        {EVENTS[edge.eventIds[0]]?.detail || ''}
                      </text>
                    </g>
                  )}
                </g>
              );
            })}

            {/* Asset nodes */}
            {nodes.filter(n => n.type === 'ASSET').map(node => {
              const pos = positions[node.id];
              if (!pos) return null;
              const highlighted = isHighlighted(node.id);
              const isSelected = selectedNodeId === node.id;
              const assetActions = edges.filter(e => e.type === 'asset_link' && e.sourceNodeId === node.id)
                .map(e => nodes.find(n => n.id === e.targetNodeId)).filter(Boolean);
              const statusPriority = ['undetected', 'detected', 'pending', 'prevented'];
              const worstStatus = statusPriority.find(s => assetActions.some(a => a.status === s)) || 'pending';
              const borderColor = STATUS_COLORS[worstStatus];

              return (
                <g key={node.id}
                  onClick={(e) => { e.stopPropagation(); onSelectNode(node.id); }}
                  style={{ cursor: 'pointer', transition: 'opacity 0.3s' }}
                  opacity={highlighted ? 1 : 0.2}
                >
                  {/* Selection ring */}
                  {isSelected && (
                    <rect x={pos.x - 96} y={pos.y - 50} width={192} height={100} rx={8}
                      fill="none" stroke={borderColor} strokeWidth="2" opacity="0.4" strokeDasharray="4 2"
                    />
                  )}
                  {/* Background */}
                  <rect x={pos.x - 90} y={pos.y - 44} width={180} height={88} rx={6}
                    fill="hsl(218 50% 9%)" stroke={borderColor} strokeWidth={isSelected ? 2 : 1.2}
                    filter="url(#node-shadow)"
                  />
                  {/* Header bar */}
                  <rect x={pos.x - 84} y={pos.y - 38} width={168} height={22} rx={3}
                    fill="hsla(0,0%,100%,0.03)"
                  />
                  {/* Hostname */}
                  <text x={pos.x} y={pos.y - 22}
                    textAnchor="middle" fontSize="11" fontFamily="var(--font-mono)"
                    fontWeight="600" fill="hsl(var(--gray-100))" letterSpacing="0.02em"
                  >
                    {node.assetHostname}
                  </text>
                  {/* OS + IP */}
                  <text x={pos.x} y={pos.y + 2}
                    textAnchor="middle" fontSize="9" fontFamily="var(--font-mono)"
                    fill="hsl(var(--gray-400))" letterSpacing="0.01em"
                  >
                    {node.assetOs} · {node.assetIp}
                  </text>
                  {/* Role badge */}
                  <rect x={pos.x - 38} y={pos.y + 14} width={76} height={18} rx={3}
                    fill="hsla(0,0%,100%,0.04)" stroke="hsl(var(--gray-700))" strokeWidth="0.5"
                  />
                  <text x={pos.x} y={pos.y + 26}
                    textAnchor="middle" fontSize="8" fontFamily="var(--font-mono)"
                    fill="hsl(var(--gray-300))" letterSpacing="0.06em"
                  >
                    {node.assetRole?.toUpperCase()}
                  </text>
                </g>
              );
            })}

            {/* Action nodes */}
            {nodes.filter(n => n.type === 'ACTION').map(node => {
              const pos = positions[node.id];
              if (!pos) return null;
              const highlighted = isHighlighted(node.id);
              const isSelected = selectedNodeId === node.id;
              const color = STATUS_COLORS[node.status];

              return (
                <g key={node.id}
                  onClick={(e) => { e.stopPropagation(); onSelectNode(node.id); }}
                  style={{ cursor: 'pointer', transition: 'opacity 0.3s' }}
                  opacity={highlighted ? 1 : 0.15}
                >
                  {/* Selection glow */}
                  {isSelected && (
                    <rect x={pos.x - 58} y={pos.y - 22} width={116} height={44} rx={8}
                      fill="none" stroke={color} strokeWidth="2.5" opacity="0.35" filter="url(#glow)"
                    />
                  )}
                  {/* Background */}
                  <rect x={pos.x - 52} y={pos.y - 18} width={104} height={36} rx={5}
                    fill="hsl(220 50% 7%)" stroke={color} strokeWidth={isSelected ? 2 : 1.2}
                    filter="url(#node-shadow)"
                  />
                  {/* Status dot */}
                  <circle cx={pos.x - 38} cy={pos.y} r="4" fill={color} />
                  {/* Action label */}
                  <text x={pos.x + 6} y={pos.y + 1}
                    textAnchor="middle" fontSize="9" fontFamily="var(--font-body)"
                    fontWeight="500" fill="hsl(var(--gray-100))"
                  >
                    {node.label.length > 15 ? node.label.slice(0, 15) + '…' : node.label}
                  </text>
                  {/* Status label below */}
                  <text x={pos.x} y={pos.y + 30}
                    textAnchor="middle" fontSize="7.5" fontFamily="var(--font-mono)"
                    fill={color} letterSpacing="0.06em" fontWeight="600"
                  >
                    {STATUS_LABELS[node.status]?.toUpperCase()}
                  </text>
                </g>
              );
            })}

            {/* Legend */}
            <g transform="translate(30, 640)">
              <text x="0" y="0" fontSize="8.5" fontFamily="var(--font-mono)" fill="hsl(var(--gray-500))" letterSpacing="0.08em">LEGEND</text>
              <rect x="0" y="10" width="14" height="10" rx="2" fill="none" stroke="hsl(var(--gray-400))" strokeWidth="1" />
              <text x="20" y="18" fontSize="8" fontFamily="var(--font-body)" fill="hsl(var(--gray-400))">Asset</text>
              <rect x="60" y="10" width="10" height="10" rx="2" fill="none" stroke="hsl(195 100% 40%)" strokeWidth="1" />
              <text x="76" y="18" fontSize="8" fontFamily="var(--font-body)" fill="hsl(var(--gray-400))">Action</text>
              <circle cx="120" cy="15" r="5" fill="transparent" stroke="hsl(195 100% 40%)" strokeWidth="1" strokeDasharray="2 1" />
              <text x="130" y="18" fontSize="8" fontFamily="var(--font-body)" fill="hsl(var(--gray-400))">Event label</text>
              <line x1="170" y1="15" x2="190" y2="15" stroke="hsl(var(--gray-700))" strokeWidth="1" strokeDasharray="3 2" />
              <text x="196" y="18" fontSize="8" fontFamily="var(--font-body)" fill="hsl(var(--gray-400))">Hosted on</text>
              <line x1="260" y1="15" x2="280" y2="15" stroke="hsl(195 100% 40%)" strokeWidth="1.5" />
              <circle r="2" fill="hsl(195 100% 65%)"><animateMotion dur="1s" repeatCount="indefinite" path="M 260 15 L 280 15" /></circle>
              <text x="286" y="18" fontSize="8" fontFamily="var(--font-body)" fill="hsl(var(--gray-400))">Chain flow</text>
            </g>
          </svg>
        </div>
      );
    };

    const zoomBtnStyle = {
      width: 32, height: 32, borderRadius: 6,
      background: 'hsl(220 50% 10%)', border: '1px solid hsl(var(--gray-700))',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      cursor: 'pointer', padding: 0,
    };

    // ─── App ────────────────────────────────────────────────────────────────────

    function App() {
      const [selectedNodeId, setSelectedNodeId] = useState(null);
      const positions = useMemo(() => computeLayout(MOCK_DATA.nodes, MOCK_DATA.edges), []);

      const handleSelectNode = (nodeId) => {
        setSelectedNodeId(prev => prev === nodeId ? null : nodeId);
      };

      return (
        <AppShell activeNav="simulations">
          <StatsBanner stats={MOCK_DATA.stats} />
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            <LiveFeed
              nodes={MOCK_DATA.nodes}
              edges={MOCK_DATA.edges}
              selectedNodeId={selectedNodeId}
              onSelectNode={handleSelectNode}
            />
            <GraphView
              nodes={MOCK_DATA.nodes}
              edges={MOCK_DATA.edges}
              selectedNodeId={selectedNodeId}
              onSelectNode={handleSelectNode}
              positions={positions}
            />
          </div>
        </AppShell>
      );
    }

    // ─── Render ─────────────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
