  <style>
    .material-symbols-outlined {
      font-size: 20px;
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
    }
    @keyframes particle-flow {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .pulse-dot {
      position: relative;
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .pulse-dot::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: inherit;
      animation: pulse-ring 2s ease-out infinite;
    }
  </style>
</head>

        ))}
        <div style={{ marginTop: 'auto', padding: '8px 12px' }}>
          <div style={{ marginTop: 8, fontSize: '0.625rem', color: 'var(--text-tertiary)', fontFamily: 'var(--font-mono)', letterSpacing: '0.04em' }}>
            by Filigran
          </div>
        </div>
      </nav>
    );

    const AppShell = ({ activeNav, children }) => (
      <div style={{ minHeight: '100vh', minWidth: 1400 }}>
        <TopBar />
        <Sidebar activeId={activeNav} />
        <main style={{
          marginLeft: 'var(--nav-width-expanded)',
          paddingTop: 'var(--topbar-height)',
          height: '100vh',
          display: 'flex',
          flexDirection: 'column',
        }}>
          {children}
        </main>
      </div>
    );

    // ─── Mock Data ──────────────────────────────────────────────────────────────

    const STATUS_COLORS = {
      prevented: 'hsl(123 73% 46%)',
      detected: 'hsl(27 88% 48%)',
      undetected: 'hsl(4 87% 48%)',
      pending: 'hsl(var(--gray-400))',
    };

    const STATUS_LABELS = {
      prevented: 'Prevented',
      detected: 'Detected',
      undetected: 'Undetected',
      pending: 'Pending',
    };

    const ASSETS = [
      { id: 'WKS-FINANCE-01', os: 'Windows 11', ip: '10.0.1.42', role: 'Workstation', x: 200, y: 260 },
      { id: 'SRV-DC-01', os: 'Win Server 2022', ip: '10.0.0.1', role: 'Domain Controller', x: 750, y: 260 },
      { id: 'SRV-DB-01', os: 'Ubuntu 22.04', ip: '10.0.2.10', role: 'Database Server', x: 1300, y: 260 },
    ];

    const ACTIONS = [
      { id: 1, name: 'Spearphishing Email', asset: 'WKS-FINANCE-01', status: 'detected', x: 120, y: 470 },
      { id: 2, name: 'PowerShell Dropper', asset: 'WKS-FINANCE-01', status: 'undetected', x: 310, y: 470 },
      { id: 3, name: 'LSASS Memory Dump', asset: 'WKS-FINANCE-01', status: 'prevented', x: 215, y: 590 },
      { id: 4, name: 'SMB Lateral Move', asset: 'SRV-DC-01', status: 'undetected', x: 670, y: 470 },
      { id: 5, name: 'Kernel Exploit PE', asset: 'SRV-DC-01', status: 'undetected', x: 860, y: 470 },
      { id: 6, name: 'Data Exfiltration', asset: 'SRV-DB-01', status: 'pending', x: 1300, y: 470 },
    ];

    // Chain edges (action→action via events)
    const CHAIN_EDGES = [
      { from: 1, to: 2, event: 'Payload Executed' },
      { from: 2, to: 3, event: null }, // sequential, same host
      { from: 3, to: 4, event: 'Credentials Available' },
      { from: 4, to: 5, event: null }, // sequential, same host
      { from: 5, to: 6, event: 'Admin Access Gained' },
    ];

    const FEED_ITEMS = [
      { time: '09:11:33', action: 'Kernel Exploit PE', status: 'undetected', detail: 'CVE-2024-21338 exploited' },
      { time: '09:08:02', action: 'SMB Lateral Move', status: 'undetected', detail: 'Moved to SRV-DC-01' },
      { time: '09:05:18', action: 'LSASS Memory Dump', status: 'prevented', detail: 'Blocked by CrowdStrike' },
      { time: '09:03:44', action: 'PowerShell Dropper', status: 'undetected', detail: 'Cobalt Strike beacon' },
      { time: '09:01:12', action: 'Spearphishing Email', status: 'detected', detail: 'Alert raised, not blocked' },
    ];

    // ─── Stats Banner ───────────────────────────────────────────────────────────

    const StatsBanner = () => {
      const stats = [
        { label: 'Prevented', count: 1, color: STATUS_COLORS.prevented },
        { label: 'Detected', count: 1, color: STATUS_COLORS.detected },
        { label: 'Undetected', count: 3, color: STATUS_COLORS.undetected },
        { label: 'Pending', count: 1, color: STATUS_COLORS.pending },
      ];
      return (
        <div style={{
          display: 'flex', alignItems: 'center', gap: 24,
          padding: '10px 20px',
          background: 'var(--box-background)',
          borderBottom: '1px solid var(--border-default)',
        }}>
          <span style={{ fontFamily: 'var(--font-title)', fontSize: '0.8125rem', fontWeight: 500, color: 'var(--text-primary)' }}>
            Attack path
          </span>
          <div style={{ width: 1, height: 20, background: 'var(--border-default)' }} />
          {stats.map(s => (
            <div key={s.label} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <div style={{ width: 8, height: 8, borderRadius: '50%', background: s.color }} />
              <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.8125rem', fontVariantNumeric: 'tabular-nums', color: s.color }}>
                {s.count}
              </span>
              <span style={{ fontSize: '0.75rem', color: 'var(--text-secondary)' }}>{s.label}</span>
            </div>
          ))}
          <div style={{ marginLeft: 'auto', display: 'flex', gap: 8 }}>
            <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.6875rem', color: 'var(--text-tertiary)', letterSpacing: '0.04em' }}>
              CAMPAIGN: RED-TEAM-2024-Q4
            </span>
          </div>
        </div>
      );
    };

    // ─── Live Feed Panel ────────────────────────────────────────────────────────

    const LiveFeed = () => (
      <div style={{
        width: 260,
        borderRight: '1px solid var(--border-default)',
        background: 'var(--box-background)',
        display: 'flex', flexDirection: 'column',
        overflow: 'hidden',
      }}>
        <div style={{
          padding: '12px 14px 8px',
          borderBottom: '1px solid var(--border-default)',
          display: 'flex', alignItems: 'center', gap: 8,
        }}>
          <div className="pulse-dot" style={{ background: STATUS_COLORS.undetected }} />
          <span style={{ fontFamily: 'var(--font-title)', fontSize: '0.75rem', fontWeight: 500, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text-secondary)' }}>
            Live execution feed
          </span>
        </div>
        <div style={{ flex: 1, overflowY: 'auto', padding: '8px 0' }}>
          {FEED_ITEMS.map((item, i) => (
            <div key={i} style={{
              padding: '8px 14px',
              borderLeft: `2px solid ${STATUS_COLORS[item.status]}`,
              marginBottom: 2,
            }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 2 }}>
                <span style={{ fontFamily: 'var(--font-mono)', fontSize: '0.6875rem', color: 'var(--text-tertiary)', fontVariantNumeric: 'tabular-nums' }}>
                  {item.time}
                </span>
                <span style={{
                  fontSize: '0.5625rem', fontFamily: 'var(--font-mono)', fontWeight: 500,
                  padding: '1px 4px', borderRadius: 2,
                  background: STATUS_COLORS[item.status], color: '#fff',
                  textTransform: 'uppercase', letterSpacing: '0.04em',
                }}>
                  {STATUS_LABELS[item.status]}
                </span>
              </div>
              <div style={{ fontSize: '0.8125rem', color: 'var(--text-primary)', fontWeight: 500, marginBottom: 1 }}>
                {item.action}
              </div>
              <div style={{ fontSize: '0.7rem', color: 'var(--text-tertiary)' }}>
                {item.detail}
              </div>
            </div>
          ))}
        </div>
        <div style={{
          padding: '8px 14px',
          borderTop: '1px solid var(--border-default)',
          fontSize: '0.6875rem', color: 'var(--text-tertiary)',
          fontFamily: 'var(--font-mono)',
        }}>
          Next: Data Exfiltration (pending)
        </div>
      </div>
    );

    // ─── Graph View ─────────────────────────────────────────────────────────────

    const GraphView = () => {
      const svgRef = useRef(null);
      const [hovered, setHovered] = useState(null);

      const getAction = (id) => ACTIONS.find(a => a.id === id);
      const getAsset = (id) => ASSETS.find(a => a.id === id);

      // Asset → Action edges (structural)
      const assetActionEdges = ACTIONS.map(action => {
        const asset = getAsset(action.asset);
        return { ax: asset.x, ay: asset.y + 50, bx: action.x, by: action.y - 30 };
      });

      // Chain edge paths with midpoints
      const chainPaths = CHAIN_EDGES.map(edge => {
        const from = getAction(edge.from);
        const to = getAction(edge.to);
        const mx = (from.x + to.x) / 2;
        const my = (from.y + to.y) / 2;

        // Use a curved path for cross-asset chains
        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const curveOffset = Math.abs(dx) > 200 ? -60 : -30;

        const path = `M ${from.x} ${from.y} C ${from.x} ${from.y + curveOffset}, ${to.x} ${to.y + curveOffset}, ${to.x} ${to.y}`;
        return { ...edge, path, mx, my: my + curveOffset / 2 };
      });

      return (
        <div style={{ flex: 1, position: 'relative', overflow: 'hidden', background: 'hsl(220 56% 5%)' }}>
          <svg
            ref={svgRef}
            viewBox="0 0 1550 700"
            style={{ width: '100%', height: '100%' }}
            preserveAspectRatio="xMidYMid meet"
          >
            <defs>
              {/* Arrow marker for chain edges */}
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="hsl(var(--gray-300))" />
              </marker>
              <marker id="arrow-event" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="hsl(195 100% 40%)" />
              </marker>

              {/* Particle for animated edges */}
              <circle id="particle" r="2.5" fill="hsl(195 100% 60%)" />

              {/* Glow filter for event markers */}
              <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>

            {/* Asset → Action edges (dashed, subtle) */}
            {assetActionEdges.map((e, i) => (
              <line key={`ae-${i}`}
                x1={e.ax} y1={e.ay} x2={e.bx} y2={e.by}
                stroke="hsl(var(--gray-700))" strokeWidth="1" strokeDasharray="4 3"
                opacity="0.5"
              />
            ))}

            {/* Chain edges (action → action) */}
            {chainPaths.map((edge, i) => {
              const hasEvent = !!edge.event;
              return (
                <g key={`chain-${i}`}>
                  {/* Background glow for event edges */}
                  {hasEvent && (
                    <path d={edge.path} fill="none"
                      stroke="hsl(195 100% 40%)" strokeWidth="3" opacity="0.15"
                    />
                  )}
                  {/* Main edge */}
                  <path d={edge.path} fill="none"
                    stroke={hasEvent ? 'hsl(195 100% 40%)' : 'hsl(var(--gray-500))'}
                    strokeWidth={hasEvent ? 1.5 : 1}
                    markerEnd={hasEvent ? 'url(#arrow-event)' : 'url(#arrow)'}
                    opacity={hasEvent ? 0.9 : 0.6}
                  />
                  {/* Animated particles on chain edges */}
                  <circle r="2" fill={hasEvent ? 'hsl(195 100% 65%)' : 'hsl(var(--gray-300))'} opacity="0.8">
                    <animateMotion dur={hasEvent ? '2.5s' : '3s'} repeatCount="indefinite" path={edge.path} />
                  </circle>
                  {hasEvent && (
                    <circle r="2" fill="hsl(195 100% 65%)" opacity="0.5">
                      <animateMotion dur="2.5s" repeatCount="indefinite" path={edge.path} begin="1.25s" />
                    </circle>
                  )}
                  {/* Event marker (circle on midpoint) */}
                  {hasEvent && (
                    <g>
                      <circle cx={edge.mx} cy={edge.my} r="14"
                        fill="hsl(220 56% 8%)" stroke="hsl(195 100% 40%)" strokeWidth="1.5"
                        filter="url(#glow)"
                      />
                      <circle cx={edge.mx} cy={edge.my} r="5"
                        fill="hsl(195 100% 50%)" opacity="0.8"
                      />
                      <text x={edge.mx} y={edge.my + 24}
                        textAnchor="middle" fontSize="9" fontFamily="var(--font-mono)"
                        fill="hsl(195 100% 60%)" letterSpacing="0.03em"
                      >
                        {edge.event}
                      </text>
                    </g>
                  )}
                </g>
              );
            })}

            {/* Asset nodes (large rounded rectangles) */}
            {ASSETS.map(asset => {
              const assetActions = ACTIONS.filter(a => a.asset === asset.id);
              // Border color = worst status
              const statusPriority = ['undetected', 'detected', 'pending', 'prevented'];
              const worstStatus = statusPriority.find(s => assetActions.some(a => a.status === s)) || 'pending';
              const borderColor = STATUS_COLORS[worstStatus];

              return (
                <g key={asset.id}>
                  {/* Background rect */}
                  <rect
                    x={asset.x - 90} y={asset.y - 44}
                    width={180} height={88} rx={4}
                    fill="hsl(218 50% 9%)"
                    stroke={borderColor} strokeWidth="1.5" opacity="0.95"
                  />
                  {/* Asset icon area */}
                  <rect
                    x={asset.x - 84} y={asset.y - 38}
                    width={168} height={22} rx={2}
                    fill="hsla(0,0%,100%,0.03)"
                  />
                  {/* Hostname */}
                  <text x={asset.x} y={asset.y - 22}
                    textAnchor="middle" fontSize="11.5" fontFamily="var(--font-mono)"
                    fontWeight="600" fill="hsl(var(--gray-100))" letterSpacing="0.02em"
                  >
                    {asset.id}
                  </text>
                  {/* OS + IP */}
                  <text x={asset.x} y={asset.y + 2}
                    textAnchor="middle" fontSize="9.5" fontFamily="var(--font-mono)"
                    fill="hsl(var(--gray-400))" letterSpacing="0.01em"
                  >
                    {asset.os} · {asset.ip}
                  </text>
                  {/* Role badge */}
                  <rect
                    x={asset.x - 40} y={asset.y + 14}
                    width={80} height={18} rx={2}
                    fill="hsla(0,0%,100%,0.05)" stroke="hsl(var(--gray-700))" strokeWidth="0.5"
                  />
                  <text x={asset.x} y={asset.y + 26}
                    textAnchor="middle" fontSize="8.5" fontFamily="var(--font-mono)"
                    fill="hsl(var(--gray-300))" letterSpacing="0.06em" textTransform="uppercase"
                  >
                    {asset.role}
                  </text>
                </g>
              );
            })}

            {/* Action nodes (smaller rounded squares) */}
            {ACTIONS.map(action => {
              const color = STATUS_COLORS[action.status];
              const isHovered = hovered === action.id;
              return (
                <g key={action.id}
                  onMouseEnter={() => setHovered(action.id)}
                  onMouseLeave={() => setHovered(null)}
                  style={{ cursor: 'pointer' }}
                >
                  {/* Hover glow */}
                  {isHovered && (
                    <rect
                      x={action.x - 54} y={action.y - 22}
                      width={108} height={44} rx={6}
                      fill="none" stroke={color} strokeWidth="2" opacity="0.3"
                      filter="url(#glow)"
                    />
                  )}
                  {/* Node background */}
                  <rect
                    x={action.x - 50} y={action.y - 18}
                    width={100} height={36} rx={4}
                    fill="hsl(220 50% 7%)"
                    stroke={color} strokeWidth={isHovered ? 2 : 1.2}
                  />
                  {/* Status dot */}
                  <circle cx={action.x - 38} cy={action.y} r="4" fill={color} />
                  {/* Action name (wrapped) */}
                  <text x={action.x + 4} y={action.y + 1}
                    textAnchor="middle" fontSize="9" fontFamily="var(--font-body)"
                    fontWeight="500" fill="hsl(var(--gray-100))"
                  >
                    {action.name.length > 14 ? action.name.slice(0, 14) + '…' : action.name}
                  </text>
                  {/* Status label below */}
                  <text x={action.x} y={action.y + 30}
                    textAnchor="middle" fontSize="8" fontFamily="var(--font-mono)"
                    fill={color} letterSpacing="0.06em" textTransform="uppercase" fontWeight="500"
                  >
                    {STATUS_LABELS[action.status]}
                  </text>
                </g>
              );
            })}

            {/* Legend */}
            <g transform="translate(30, 640)">
              <text x="0" y="0" fontSize="9" fontFamily="var(--font-mono)" fill="hsl(var(--gray-400))" letterSpacing="0.06em">
                LEGEND
              </text>
              {/* Asset */}
              <rect x="0" y="10" width="14" height="10" rx="2" fill="none" stroke="hsl(var(--gray-400))" strokeWidth="1" />
              <text x="20" y="18" fontSize="8.5" fontFamily="var(--font-body)" fill="hsl(var(--gray-400))">Asset</text>
              {/* Action */}
              <rect x="60" y="10" width="10" height="10" rx="2" fill="none" stroke="hsl(195 100% 40%)" strokeWidth="1" />
              <text x="76" y="18" fontSize="8.5" fontFamily="var(--font-body)" fill="hsl(var(--gray-400))">Action</text>
              {/* Event */}
              <circle cx="125" cy="15" r="5" fill="hsl(220 56% 8%)" stroke="hsl(195 100% 40%)" strokeWidth="1" />
              <circle cx="125" cy="15" r="2" fill="hsl(195 100% 50%)" />
              <text x="135" y="18" fontSize="8.5" fontFamily="var(--font-body)" fill="hsl(var(--gray-400))">Event</text>
              {/* Dashed line */}
              <line x1="175" y1="15" x2="195" y2="15" stroke="hsl(var(--gray-700))" strokeWidth="1" strokeDasharray="3 2" />
              <text x="200" y="18" fontSize="8.5" fontFamily="var(--font-body)" fill="hsl(var(--gray-400))">Hosted on</text>
              {/* Solid line */}
              <line x1="268" y1="15" x2="288" y2="15" stroke="hsl(195 100% 40%)" strokeWidth="1.5" />
              <text x="294" y="18" fontSize="8.5" fontFamily="var(--font-body)" fill="hsl(var(--gray-400))">Chain flow</text>
            </g>
          </svg>
        </div>
      );
    };

    // ─── App ────────────────────────────────────────────────────────────────────

    function App() {
      return (
        <AppShell activeNav="simulations">
          <StatsBanner />
          <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
            <LiveFeed />
            <GraphView />
          </div>
        </AppShell>
      );
    }

    // ─── Render ─────────────────────────────────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
