  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" />
  <style>
    .material-symbols-outlined {
      font-size: 20px;
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20;
    }

    /* Background themes */
    .bg-command-center {
      background: #0b1120;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,180,255,0.015) 2px, rgba(0,180,255,0.015) 3px),
        repeating-linear-gradient(90deg, transparent, transparent 60px, rgba(0,180,255,0.02) 60px, rgba(0,180,255,0.02) 61px),
        repeating-linear-gradient(0deg, transparent, transparent 60px, rgba(0,180,255,0.02) 60px, rgba(0,180,255,0.02) 61px);
    }
    .bg-command-center::before {
      content: '';
      position: absolute;
      inset: 0;
      background: conic-gradient(from 0deg at 50% 50%, transparent 0deg, rgba(0,150,255,0.03) 30deg, transparent 60deg);
      animation: radar-sweep 8s linear infinite;
      pointer-events: none;
    }
    @keyframes radar-sweep {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .bg-pure-noir {
      background: #0a0a0a;
    }

    .bg-circuit-board {
      background: #080e08;
      background-image:
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(0,255,100,0.02) 40px, rgba(0,255,100,0.02) 41px),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(0,255,100,0.02) 40px, rgba(0,255,100,0.02) 41px),
        radial-gradient(circle at 25% 25%, rgba(0,255,100,0.008) 0%, transparent 50%);
    }

    .bg-glassmorphism {
      background: #0c0f18;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(60,80,180,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 70%, rgba(0,180,150,0.06) 0%, transparent 40%);
    }

    /* Particle animation along path */
    @keyframes particle-flow {
      0% { offset-distance: 0%; opacity: 0; }
      5% { opacity: 1; }
      95% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    @keyframes particle-flow-slow {
      0% { offset-distance: 0%; opacity: 0; }
      5% { opacity: 0.6; }
      95% { opacity: 0.6; }
      100% { offset-distance: 100%; opacity: 0; }
    }

    /* Diamond pulse */
    @keyframes diamond-pulse {
      0%, 100% { transform: rotate(45deg) scale(1); opacity: 0.9; }
      50% { transform: rotate(45deg) scale(1.15); opacity: 1; }
    }

    /* Glow ring for nodes */
    @keyframes glow-breathe {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.7; }
    }

    /* Satellite orbit */
    @keyframes orbit-float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }

    /* Feed item enter */
    @keyframes feed-in {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>

    // ─── Data Model ─────────────────────────────────────────────────────────────

    // ─── SVG Graph: Assets View ─────────────────────────────────────────────────

    const AssetNode = ({ asset, actions: assetActions }) => {
      const worstStatus = assetActions.reduce((worst, a) => {
        const priority = { undetected: 3, pending: 2, detected: 1, prevented: 0 };
        return priority[a.status] > priority[worst] ? a.status : worst;
      }, 'prevented');

      const glowColor = STATUS_COLORS[worstStatus];
      const nodeW = 160, nodeH = 80;

      // Satellite positions around the asset — spread evenly below
      const satellitePositions = assetActions.map((_, i) => {
        const total = assetActions.length;
        const angleStart = 200; // start below-left
        const angleSpread = 140; // spread arc
        const angle = (angleStart + (i / Math.max(total - 1, 1)) * angleSpread) * (Math.PI / 180);
        const radius = 130;
        return {
          x: Math.cos(angle) * radius,
          y: Math.sin(angle) * radius,
        };
      });

      return (
        <g transform={`translate(${asset.x}, ${asset.y})`}>
          {/* Glow ring */}
          <rect x={-nodeW/2 - 4} y={-nodeH/2 - 4} width={nodeW + 8} height={nodeH + 8}
            rx="6" fill="none" stroke={glowColor} strokeWidth="1.5" opacity="0.3"
            style={{ animation: 'glow-breathe 3s ease-in-out infinite' }} />

          {/* Main node — hexagonal-ish rounded rect */}
          <rect x={-nodeW/2} y={-nodeH/2} width={nodeW} height={nodeH}
            rx="4" fill="hsl(218, 50%, 9%)" stroke="hsl(var(--gray-700))" strokeWidth="1" />

          {/* Inner structure lines */}
          <line x1={-nodeW/2} y1={-nodeH/2 + 22} x2={nodeW/2} y2={-nodeH/2 + 22}
            stroke="hsl(var(--gray-800))" strokeWidth="0.5" />

          {/* Role badge */}
          <rect x={-nodeW/2 + 6} y={-nodeH/2 + 5} width={asset.role.length * 5.5 + 12} height={14}
            rx="2" fill={glowColor} opacity="0.15" />
          <text x={-nodeW/2 + 12} y={-nodeH/2 + 15}
            style={{ fontSize: '8px', fontFamily: 'IBM Plex Mono', fill: glowColor, letterSpacing: '0.05em' }}>
            {asset.role.toUpperCase()}
          </text>

          {/* Hostname */}
          <text x={0} y={-2} textAnchor="middle"
            style={{ fontSize: '12px', fontFamily: 'IBM Plex Mono', fontWeight: 500, fill: 'hsl(var(--gray-100))' }}>
            {asset.hostname}
          </text>

          {/* IP + OS */}
          <text x={0} y={14} textAnchor="middle"
            style={{ fontSize: '9px', fontFamily: 'IBM Plex Mono', fill: 'hsl(var(--gray-400))', fontVariantNumeric: 'tabular-nums' }}>
            {asset.ip} · {asset.os}
          </text>

          {/* Satellite action nodes */}
          {assetActions.map((action, i) => {
            const pos = satellitePositions[i];
            const pillW = Math.min(action.name.length * 5.8 + 20, 120);
            return (
              <g key={action.id} transform={`translate(${pos.x}, ${pos.y})`}
                style={{ animation: `orbit-float 4s ease-in-out ${i * 0.5}s infinite` }}>
                {/* Connection line to parent asset center */}
                <line x1={0} y1={0} x2={-pos.x} y2={-pos.y}
                  stroke="hsl(var(--gray-700))" strokeWidth="0.5" strokeDasharray="3,3" opacity="0.4" />
                {/* Pill shape */}
                <rect x={-pillW/2} y={-10} width={pillW} height={20}
                  rx="10" fill="hsl(220, 50%, 9%)" stroke={STATUS_COLORS[action.status]} strokeWidth="1" opacity="0.9" />
                {/* Status dot */}
                <circle cx={-pillW/2 + 10} cy={0} r={3} fill={STATUS_COLORS[action.status]} />
                {/* Payload name */}
                <text x={-pillW/2 + 18} y={3.5}
                  style={{ fontSize: '8px', fontFamily: 'IBM Plex Sans', fill: 'hsl(var(--gray-200))', fontWeight: 400 }}>
                  {action.name.length > 16 ? action.name.slice(0, 15) + '…' : action.name}
                </text>
              </g>
            );
          })}
        </g>
      );
    };

    const AnimatedEdge = ({ x1, y1, x2, y2, status, label, eventName }) => {
      const pathId = `edge-${x1}-${y1}-${x2}-${y2}`;
      // Cubic bezier for smooth curve
      const mx = (x1 + x2) / 2;
      const my = (y1 + y2) / 2;
      const ctrl1x = x1 + (x2 - x1) * 0.3;
      const ctrl1y = y1 - 30;
      const ctrl2x = x1 + (x2 - x1) * 0.7;
      const ctrl2y = y2 - 30;
      const d = `M ${x1} ${y1} C ${ctrl1x} ${ctrl1y}, ${ctrl2x} ${ctrl2y}, ${x2} ${y2}`;
      const color = STATUS_COLORS[status];
      const speed = status === 'pending' ? '4s' : '2s';

      // Diamond (event) position at midpoint
      const diamondX = mx;
      const diamondY = my - 15;

      return (
        <g>
          {/* Path line */}
          <path d={d} fill="none" stroke={color} strokeWidth="1.5" opacity="0.25" />
          <path d={d} fill="none" stroke={color} strokeWidth="0.5" opacity="0.6" strokeDasharray="4,6" />

          {/* Animated particles */}
          {[0, 0.33, 0.66].map((offset, i) => (
            <circle key={i} r="3" fill={color} opacity="0.9">
              <animateMotion dur={speed} repeatCount="indefinite" begin={`${offset * parseFloat(speed)}s`}>
                <mpath href={`#${pathId}`} />
              </animateMotion>
            </circle>
          ))}
          {/* Smaller trailing particles */}
          {[0.1, 0.43, 0.76].map((offset, i) => (
            <circle key={`t${i}`} r="1.5" fill={color} opacity="0.5">
              <animateMotion dur={speed} repeatCount="indefinite" begin={`${offset * parseFloat(speed)}s`}>
                <mpath href={`#${pathId}`} />
              </animateMotion>
            </circle>
          ))}

          {/* Hidden path for animateMotion */}
          <path id={pathId} d={d} fill="none" stroke="none" />

          {/* Edge label */}
          {label && (
            <text x={mx} y={my + 18} textAnchor="middle"
              style={{ fontSize: '8px', fontFamily: 'IBM Plex Sans', fill: 'hsl(var(--gray-400))', fontStyle: 'italic' }}>
              {label}
            </text>
          )}

          {/* Diamond event gate */}
          {eventName && (
            <g transform={`translate(${diamondX}, ${diamondY})`}>
              <rect x={-8} y={-8} width={16} height={16} rx="2"
                fill="hsl(218, 50%, 12%)" stroke={color} strokeWidth="1"
                style={{ transform: 'rotate(45deg)', transformOrigin: 'center', animation: 'diamond-pulse 3s ease-in-out infinite' }} />
              <text x={0} y={-14} textAnchor="middle"
                style={{ fontSize: '7px', fontFamily: 'IBM Plex Mono', fill: color, letterSpacing: '0.03em' }}>
                {eventName}
              </text>
            </g>
          )}
        </g>
      );
    };

    const AssetsView = ({ bgClass }) => {
      const svgRef = useRef(null);

      const assetActionsMap = useMemo(() => {
        const map = {};
        assets.forEach(a => { map[a.id] = actions.filter(act => act.asset === a.id); });
        return map;
      }, []);

      return (
        <div className={bgClass} style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>
          <svg ref={svgRef} width="100%" height="100%" viewBox="0 0 1500 750" preserveAspectRatio="xMidYMid meet"
            style={{ position: 'absolute', inset: 0 }}>
            {/* Lateral movement edges */}
            {lateralMoves.map((lm, i) => {
              const fromAsset = assets.find(a => a.id === lm.from);
              const toAsset = assets.find(a => a.id === lm.to);
              const evt = events.find(e => {
                const fromAct = actions.find(a => a.id === e.fromAction);
                const toAct = actions.find(a => a.id === e.toAction);
                return fromAct && toAct && fromAct.asset === lm.from && toAct.asset === lm.to;
              });
              return (
                <AnimatedEdge key={i}
                  x1={fromAsset.x + 100} y1={fromAsset.y}
                  x2={toAsset.x - 100} y2={toAsset.y}
                  status={lm.status}
                  label={lm.action}
                  eventName={evt ? evt.name : null}
                />
              );
            })}

            {/* Asset nodes */}
            {assets.map(asset => (
              <AssetNode key={asset.id} asset={asset} actions={assetActionsMap[asset.id]} />
            ))}
          </svg>
        </div>
      );
    };

    // ─── SVG Graph: Kill Chain View ─────────────────────────────────────────────

    const KillChainView = ({ bgClass }) => {
      const phases = ['Initial Access', 'Execution', 'Credential Access', 'Lateral Movement', 'Privilege Escalation', 'Collection'];
      const phaseWidth = 180;
      const phaseGap = 20;
      const startX = 60;
      const nodeY = 260;

      // Position each chain element within its phase column
      const positions = useMemo(() => {
        const pos = {};
        // Map actions to phase indices
        const phaseIndex = {};
        phases.forEach((p, i) => { phaseIndex[p] = i; });

        // Actions get placed in their phase column center
        actions.forEach(a => {
          const pi = phaseIndex[a.phase] ?? 0;
          const cx = startX + pi * (phaseWidth + phaseGap) + phaseWidth / 2;
          pos[a.id] = { x: cx, y: nodeY, isEvent: false };
        });

        // Events get placed between their source and target actions
        events.forEach(e => {
          const fromPos = pos[e.fromAction];
          const toPos = pos[e.toAction];
          if (fromPos && toPos) {
            pos[e.id] = { x: (fromPos.x + toPos.x) / 2, y: nodeY - 60, isEvent: true };
          }
        });
        return pos;
      }, []);

      return (
        <div className={bgClass} style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>
          <svg width="100%" height="100%" viewBox="0 0 1300 520" preserveAspectRatio="xMidYMid meet"
            style={{ position: 'absolute', inset: 0 }}>

            {/* Phase columns */}
            {phases.map((phase, i) => {
              const colX = startX + i * (phaseWidth + phaseGap);
              return (
                <g key={phase}>
                  <rect x={colX} y={30} width={phaseWidth} height={24}
                    rx="2" fill="hsla(0,0%,100%,0.03)" stroke="hsl(var(--gray-800))" strokeWidth="0.5" />
                  <text x={colX + phaseWidth/2} y={46} textAnchor="middle"
                    style={{ fontSize: '8px', fontFamily: 'IBM Plex Mono', fill: 'hsl(var(--gray-400))', letterSpacing: '0.06em', textTransform: 'uppercase' }}>
                    {phase}
                  </text>
                  {/* Vertical guide line */}
                  <line x1={colX + phaseWidth/2} y1={58}
                    x2={colX + phaseWidth/2} y2={450}
                    stroke="hsl(var(--gray-800))" strokeWidth="0.5" strokeDasharray="2,4" opacity="0.3" />
                </g>
              );
            })}

            {/* Edges between connected actions (through events) */}
            {(() => {
              const edges = [];
              // Direct action→action edges (via events)
              const connections = [
                { from: 'a1', to: 'a2', event: 'e3' },
                { from: 'a2', to: 'a3', event: null },
                { from: 'a3', to: 'a4', event: 'e1' },
                { from: 'a4', to: 'a5', event: null },
                { from: 'a5', to: 'a6', event: 'e2' },
              ];
              connections.forEach((conn, idx) => {
                const fromPos = positions[conn.from];
                const toPos = positions[conn.to];
                if (!fromPos || !toPos) return;

                const fromAction = actions.find(a => a.id === conn.from);
                const color = fromAction ? STATUS_COLORS[fromAction.status] : 'hsl(var(--gray-500))';
                const speed = '2.5s';

                // Curved path
                const dx = toPos.x - fromPos.x;
                const dy = toPos.y - fromPos.y;
                const mx = (fromPos.x + toPos.x) / 2;
                const curveY = Math.min(fromPos.y, toPos.y) - 40;
                const d = `M ${fromPos.x + 55} ${fromPos.y} C ${fromPos.x + 55 + dx * 0.3} ${curveY}, ${toPos.x - 55 - dx * 0.3} ${curveY}, ${toPos.x - 55} ${toPos.y}`;
                const pathId = `kc-edge-${idx}`;

                edges.push(
                  <g key={idx}>
                    <path d={d} fill="none" stroke={color} strokeWidth="1.5" opacity="0.25" />
                    <path d={d} fill="none" stroke={color} strokeWidth="0.7" opacity="0.5" strokeDasharray="4,6" />
                    {/* Particles */}
                    {[0, 0.4, 0.8].map((offset, pi) => (
                      <circle key={pi} r="2.5" fill={color} opacity="0.85">
                        <animateMotion dur={speed} repeatCount="indefinite" begin={`${offset * 2.5}s`}>
                          <mpath href={`#${pathId}`} />
                        </animateMotion>
                      </circle>
                    ))}
                    <path id={pathId} d={d} fill="none" stroke="none" />
                  </g>
                );
              });
              return edges;
            })()}

            {/* Action nodes */}
            {actions.map((action) => {
              const pos = positions[action.id];
              if (!pos) return null;
              const color = STATUS_COLORS[action.status];
              const pillW = 130;
              return (
                <g key={action.id} transform={`translate(${pos.x}, ${pos.y})`}>
                  {/* Glow */}
                  <rect x={-pillW/2 - 2} y={-20} width={pillW + 4} height={40}
                    rx="20" fill="none" stroke={color} strokeWidth="1" opacity="0.2"
                    style={{ animation: 'glow-breathe 3s ease-in-out infinite' }} />
                  {/* Main pill */}
                  <rect x={-pillW/2} y={-18} width={pillW} height={36}
                    rx="18" fill="hsl(218, 50%, 9%)" stroke={color} strokeWidth="1.5" />
                  {/* Status dot */}
                  <circle cx={-pillW/2 + 16} cy={0} r={4} fill={color} />
                  {/* Label */}
                  <text x={-pillW/2 + 26} y={4}
                    style={{ fontSize: '9.5px', fontFamily: 'IBM Plex Sans', fill: 'hsl(var(--gray-100))', fontWeight: 500 }}>
                    {action.name.length > 15 ? action.name.slice(0, 14) + '…' : action.name}
                  </text>
                  {/* Status label above */}
                  <text x={0} y={-28} textAnchor="middle"
                    style={{ fontSize: '7px', fontFamily: 'IBM Plex Mono', fill: color, textTransform: 'uppercase', letterSpacing: '0.06em' }}>
                    {STATUS_LABELS[action.status]}
                  </text>
                </g>
              );
            })}

            {/* Event diamond gates */}
            {events.map((evt) => {
              const pos = positions[evt.id];
              if (!pos) return null;
              const srcAction = actions.find(a => a.id === evt.fromAction);
              const color = srcAction ? STATUS_COLORS[srcAction.status] : 'hsl(var(--gray-500))';
              return (
                <g key={evt.id} transform={`translate(${pos.x}, ${pos.y})`}>
                  <rect x={-10} y={-10} width={20} height={20} rx="3"
                    fill="hsl(218, 50%, 10%)" stroke={color} strokeWidth="1.5"
                    style={{ transform: 'rotate(45deg)', transformOrigin: 'center', animation: 'diamond-pulse 3s ease-in-out infinite' }} />
                  <circle cx={0} cy={0} r={2.5} fill={color} opacity="0.7" />
                  <text x={0} y={22} textAnchor="middle"
                    style={{ fontSize: '7.5px', fontFamily: 'IBM Plex Mono', fill: color, letterSpacing: '0.02em' }}>
                    {evt.name}
                  </text>
                  <text x={0} y={-18} textAnchor="middle"
                    style={{ fontSize: '6px', fontFamily: 'IBM Plex Mono', fill: 'hsl(var(--gray-500))', textTransform: 'uppercase', letterSpacing: '0.08em' }}>
                    EVENT
                  </text>
                </g>
              );
            })}
          </svg>
        </div>
      );
    };

    // ─── Background Switcher ────────────────────────────────────────────────────

    const bgOptions = [
      { id: 'command-center', label: 'Command Center', cls: 'bg-command-center' },
      { id: 'pure-noir', label: 'Pure Noir', cls: 'bg-pure-noir' },
      { id: 'circuit-board', label: 'Circuit Board', cls: 'bg-circuit-board' },
      { id: 'glassmorphism', label: 'Glassmorphism', cls: 'bg-glassmorphism' },
    ];

    const BackgroundSwitcher = ({ current, onChange }) => {
      const [open, setOpen] = useState(false);
      return (
        <div style={{ position: 'absolute', bottom: 12, right: 12, zIndex: 10 }}>
          {open && (
            <div style={{
              position: 'absolute', bottom: 36, right: 0,
              background: 'hsl(218, 50%, 9%)', border: '1px solid var(--border-default)',
              borderRadius: 'var(--radius)', padding: 4, minWidth: 150,
            }}>
              {bgOptions.map(opt => (
                <div key={opt.id} onClick={() => { onChange(opt.id); setOpen(false); }}
                  style={{
                    padding: '6px 10px', cursor: 'pointer', borderRadius: 'var(--radius)',
                    fontSize: '0.75rem', fontFamily: 'var(--font-body)',
                    color: current === opt.id ? 'var(--text-primary)' : 'var(--text-secondary)',
                    background: current === opt.id ? 'var(--hover-bg)' : 'transparent',
                  }}>
                  {opt.label}
                </div>
              ))}
            </div>
          )}
          <div onClick={() => setOpen(!open)} style={{
            width: 28, height: 28, borderRadius: 'var(--radius)',
            background: 'hsl(218, 50%, 9%)', border: '1px solid var(--border-default)',
            display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer',
          }}>
            <Icon name="palette" size={16} style={{ color: 'var(--text-secondary)' }} />
          </div>
        </div>
      );
    };

    // ─── Main App ───────────────────────────────────────────────────────────────

    function App() {
      const [view, setView] = useState('assets');
      const [bgId, setBgId] = useState('command-center');
      const bgClass = bgOptions.find(b => b.id === bgId)?.cls || 'bg-command-center';

      return (
        <div style={{ minHeight: '100vh', minWidth: 1400 }}>
          <TopBar />
          <Sidebar activeId="simulations" />
          <main style={{
            marginLeft: 'var(--nav-width-expanded)',
            paddingTop: 'var(--topbar-height)',
            display: 'flex', flexDirection: 'column',
            height: '100vh',
          }}>
            {/* Stats banner */}
            <StatsBanner />

            {/* Main content area */}
            <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
              {/* Left: Live Feed */}
              <LiveFeed />

              {/* Right: Graph area */}
              <div style={{ flex: 1, display: 'flex', flexDirection: 'column', position: 'relative' }}>
                {/* View toggle */}
                <div style={{
                  display: 'flex', alignItems: 'center', gap: 0,
                  padding: '8px 16px',
                  background: 'var(--box-background)',
                  borderBottom: '1px solid var(--border-default)',
                }}>
                  <span style={{
                    fontFamily: 'var(--font-title)', fontSize: '0.875rem', fontWeight: 500,
                    color: 'var(--text-secondary)', marginRight: 16,
                  }}>
                    APT29 Lateral Movement Campaign
                  </span>
                  <div style={{ display: 'flex', gap: 0, marginLeft: 'auto' }}>
                    {[
                      { id: 'assets', label: 'Assets', icon: 'dns' },
                      { id: 'killchain', label: 'Kill Chain', icon: 'timeline' },
                    ].map(tab => (
                      <div key={tab.id} onClick={() => setView(tab.id)} style={{
                        display: 'flex', alignItems: 'center', gap: 5,
                        padding: '5px 14px', cursor: 'pointer',
                        borderRadius: 'var(--radius)',
                        background: view === tab.id ? 'var(--hover-bg)' : 'transparent',
                        border: view === tab.id ? '1px solid var(--border-medium-light)' : '1px solid transparent',
                        fontSize: '0.8125rem', fontFamily: 'var(--font-body)',
                        color: view === tab.id ? 'var(--text-primary)' : 'var(--text-secondary)',
                        transition: 'all 0.15s',
                      }}>
                        <Icon name={tab.icon} size={14} />
                        <span>{tab.label}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Graph */}
                {view === 'assets' ? <AssetsView bgClass={bgClass} /> : <KillChainView bgClass={bgClass} />}

                {/* Background switcher */}
                <BackgroundSwitcher current={bgId} onChange={setBgId} />
              </div>
            </div>
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
