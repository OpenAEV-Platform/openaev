site_name: OpenAEV Documentation
site_description: Documentation about OpenAEV, the next-generation Open Adversary Exposure Validation Platform.
site_author: Filigran
site_url: https://docs.openaev.io
copyright: © 2026 Filigran. All rights reserved
repo_name: GitHub
repo_url: https://github.com/OpenAEV-Platform/openaev
edit_uri: https://github.com/OpenAEV-Platform/openaev/blob/main/docs/docs/

# Theming
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  features:
    - navigation.tabs
    - navigation.path
    - navigation.footer
    - navigation.expand
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - search.highlight
  palette:
    scheme: filigran
  font:
    text: IBM Plex Sans
    code: Roboto Mono
# CSS
extra_css:
  - assets/css/custom.css

# Extra
extra:
  feature_flags:
    enabled: !ENV [DOCS_FEATURE_FLAGS] # enabled: !ENV [DOCS_FEATURE_FLAGS, "audit-log,multi-tenancy"]
  version:
    provider: mike
  analytics:
    provider: google
    property: G-D12HQ64D7C
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OpenAEV-Platform
    - icon: fontawesome/solid/book
      link: https://blog.filigran.io
    - icon: fontawesome/brands/slack
      link: https://community.filigran.io
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/company/filigran
    - icon: fontawesome/brands/x-twitter
      link: https://twitter.com/FiligranHQ
    - icon: fontawesome/brands/facebook
      link: https://facebook.com/FiligranHQ

# Plugins
plugins:
  - mike:
      alias_type: symlink
      canonical_version: latest
  - search
  - redirects:
      redirect_maps:
        'deployment/authentication.md': 'deployment/platform/authentication.md'
        'deployment/certificate-validation.md': 'deployment/platform/certificate-validation.md'
        'deployment/configuration.md': 'reference/deployment/configuration.md'
        'deployment/ecosystem/collectors.md': 'integrations/collectors/deploy-collectors.md'
        'deployment/ecosystem/executors.md': 'integrations/executors/executors.md'
        'deployment/ecosystem/injectors.md': 'integrations/injectors/deploy-injectors.md'
        'deployment/ecosystem/integration-manager/configuration.md': 'deployment/integration-manager/configuration.md'
        'deployment/ecosystem/integration-manager/installation.md': 'deployment/integration-manager/installation.md'
        'deployment/ecosystem/integration-manager/overview.md': 'deployment/integration-manager/overview.md'
        'deployment/ecosystem/integration-manager/proxy-configuration.md': 'deployment/integration-manager/proxy-configuration.md'
        'deployment/ecosystem/integration-manager/quick-start.md': 'deployment/integration-manager/quick-start.md'
        'deployment/ecosystem/integration-manager/registry-authentication.md': 'deployment/integration-manager/registry-authentication.md'
        'deployment/ecosystem/integration-manager/troubleshooting.md': 'deployment/integration-manager/troubleshooting.md'
        'deployment/ecosystem/mcp-server.md': 'integrations/mcp-server/mcp-server.md'
        'deployment/installation.md': 'deployment/platform/installation.md'
        'deployment/managers.md': 'deployment/platform/managers.md'
        'deployment/upgrade.md': 'deployment/platform/upgrade.md'
        'deployment/url-access-token.md': 'deployment/platform/url-access-token.md'
        'usage/autonomous-attack-chaining/configuration.md': 'usage/attack-chaining/autonomous/configuration.md'
        'usage/autonomous-attack-chaining/overview.md': 'usage/attack-chaining/autonomous/overview.md'
        'usage/autonomous-attack-chaining/scenario-creation.md': 'usage/attack-chaining/autonomous/scenario-creation.md'
        'usage/environment/collectors.md': 'integrations/collectors/collectors.md'
        'usage/environment/injectors.md': 'integrations/injectors/injectors.md'
        'usage/environment/injects-builtin.md': 'integrations/injectors/injects-builtin.md'
        'usage/environment/openaev-agent.md': 'integrations/agents/openaev-agent.md'
        'usage/evaluate/atomic-testing/atomic-testing.md': 'usage/run-and-evaluate/atomic-testing/atomic-testing.md'
        'usage/evaluate/dashboards/custom-dashboards.md': 'usage/run-and-evaluate/dashboards/custom-dashboards.md'
        'usage/evaluate/dashboards/widgets.md': 'usage/run-and-evaluate/dashboards/widgets.md'
        'usage/evaluate/expectations/expectations.md': 'usage/run-and-evaluate/expectations/expectations.md'
        'usage/evaluate/findings/findings.md': 'usage/run-and-evaluate/findings/findings.md'
        'usage/evaluate/injects/inject-overview.md': 'usage/run-and-evaluate/injects/inject-overview.md'
        'usage/evaluate/injects/inject-result.md': 'usage/run-and-evaluate/injects/inject-result.md'
        'usage/evaluate/injects/inject-status.md': 'usage/run-and-evaluate/injects/inject-status.md'
        'usage/evaluate/injects/inject-tests.md': 'usage/run-and-evaluate/injects/inject-tests.md'
        'usage/evaluate/overview.md': 'usage/run-and-evaluate/overview.md'
        'usage/evaluate/reporting/reporting.md': 'usage/run-and-evaluate/reporting/reporting.md'
        'usage/evaluate/simulation/simulation.md': 'usage/run-and-evaluate/simulation/simulation.md'
        'usage/evaluate/xtm-suite-connector.md': 'integrations/xtm-suite/xtm-suite-connector.md'
        'usage/foundations/injects-and-expectations.md': 'usage/get-started/foundations/injects-and-expectations.md'
        'usage/foundations/scenarios-and-simulations.md': 'usage/get-started/foundations/scenarios-and-simulations.md'
        'usage/getting-started.md': 'usage/get-started/getting-started.md'
        'usage/inject-chaining.md': 'usage/attack-chaining/inject-chaining.md'
        'usage/notifications/notification-center.md': 'usage/run-and-evaluate/notifications/notification-center.md'
        'usage/notifications/overview.md': 'usage/run-and-evaluate/notifications/overview.md'
        'usage/notifications/triggers.md': 'usage/run-and-evaluate/notifications/triggers.md'
        'usage/rest-api.md': 'reference/apis/rest-api.md'
  - macros
  - git-committers:
      repository: OpenAEV-Platform/openaev
      branch: main
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - glightbox

# Extensions
markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - def_list
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.smartsymbols
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.betterem
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: false
      auto_title: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.snippets:
      url_download: true

